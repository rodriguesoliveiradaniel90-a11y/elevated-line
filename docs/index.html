d it back to me when it arrives?","coach":"Deixa terminar. Aceita a escalada em princ\u00edpio. Mostra autoridade REAL (pode aprovar). Oferece resolver antes, sem bloquear."},{"customer":"Okay \u2014 it's just come through. 6 0 5 7 2 1.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: the pool is listed, it's green and unusable, it's the whole reason you booked, and you've already called twice. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"\u2026You can approve it? Why didn't the other two say that?","customer_if_weak":"Nah, I've heard that before. Supervisor. Now.","expects":["ownership","policy","expectations"],"model":"I can't speak for the earlier calls, but I can speak for this one. The pool is a listed amenity that isn't usable, so it's covered under 'not as advertised'. For a missing amenity while you're staying, the refund is a portion of the nightly rate, not the full stay \u2014 I want to be clear on that so it's not a surprise. I'll put the figure through now and you'll see it in the app within a few minutes.","coach":"N\u00e3o critica os colegas. Explica o escopo (parcial, n\u00e3o total) antes de aprovar. A\u00e7\u00e3o imediata."},{"customer":"Right. And if I still want to talk to someone senior about the runaround?","expects":["future"],"model":"Then I'll set that up and brief them properly so you don't start from zero \u2014 I'll note it on case 2277 as a complaint about the earlier handling, separate from the refund. You'll get a message with the refund confirmation shortly. Thanks for giving me the chance to sort it.","coach":"Escala sem drama, com resumo, separando reclama\u00e7\u00e3o de reembolso."},{"custom e evening'."},{"customer":"It's Aoife Byrne.","expects":["auth","paraphrase"],"model":"Thank you, Aoife \u2014 that matches what I have here. So, just to make sure I've got this right: you'd just got in and there was a strong smell of gas in the kitchen; you're now outside. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Okay \u2014 yes.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, you're safe outside, and the next call is to the gas emergency line \u2014 I've messaged you the number. Second, the flat is unsafe, so you won't be staying there; I'm arranging somewhere else for tonight and refunding the nights. And third, message me on the case once you're somewhere safe and warm, and I'll have options waiting. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 9910. Thank you for your time, Aoife.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Evacuate; emergency services first; rebook tonight; refund; host notified.","policy_ref":"rebooking_refund","why":"Safety hazard = uninhabitable; safety protocol overrides call structure."},"auth":{"path":"alura","customer_name":"Aoife Byrne"},"callback":false,"value_tier":"standard","reference":"9910"},{"id":"mis-out-01","title":"Calling a guest back \u2014 the host has replied","category":"mismatch","callType":"outbound_guest","severity":1,"emotion":"exhausted","accent":"en-GB","caller":{"name":"Sam","role":"guest"},"context":{"listing":"Cabin, Lake District","booking":"3 nights","facts":["guest reported no hot tub (listed) at 22:40","host replied: hot tub heater fixed by 09:00, offers one night 50% off","it's 23:15; guest is tired","agent calling back as promised"]},"lexicon":["hot tub","listed amenity","goodwill","follow up","in writing"],"turns":[{"customer":"Hi \u2014 yeah, it's late, sorry, I'm shattered. Is this about the hot tub?","expects":["opening","empathy","auth","recording"],"model":"It is \u2014 this is {name} from Airbnb, calling back as I said I would. I'll keep it to two minutes so you can sleep. Just confirming it's Sam at the cabin in the Lake District? Before we go on, two quick things: this call is being recorded for training and quality purposes \u2014 is that okay with you? And just to confirm I'm speaking with the right person, could I have your first and last name?","coach":"Exausto: curto, promete dura\u00e7\u00e3o, mant\u00e9m a palavra do callback."},{"customer":"Yeah, that's fine. It's Sam Ferris.","expects":["auth","paraphrase"],"model":"Thank you. Thank you, Sam \u2014 that matches what I have here. So, just to make sure I've got this right: the hot tub, which is listed, isn't working tonight, and the host has offered a fix at nine tomorrow plus fifty percent off tonight. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Yep. Go on.","expects":["options","policy","expectations"],"model":"Two things. The host has an engineer coming at nine tomorrow morning to fix the heater, and they've offered fifty percent off tonight's rate as a goodwill gesture, which I think is a fair offer for one evening without the tub. If it's not fixed by tomorrow lunchtime, that changes \u2014 a listed amenity that's out for the stay is covered, and I'd look at a bigger refund. Does the host's offer work for you for tonight?","coach":"Resolve HOJE, deixa o resto para amanh\u00e3 com um gatilho claro (n\u00e3o consertado at\u00e9 o almo\u00e7o \u2192 outra pol\u00edtica)."},{"customer":"Yeah, that's fine. Cheers.","expects":["future"],"model":"I'll accept it on your behalf and put everything in writing on the case now \u2014 reference 3081 \u2014 so you've got it in the morning. If the engineer's late, message the case and I'll pick it up. Sleep well.","coach":"Por escrito, n\u00famero, gatilho para amanh\u00e3. 'Sleep well' \u00e9 apropriado aqui."},{"customer":"Yep.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the host has an engineer coming at nine tomorrow and has offered fifty percent off tonight's rate, which you've accepted for tonight. Second, if it isn't fixed by tomorrow lunchtime, that changes \u2014 a listed amenity out for the stay is covered and I'd look at a bigger refund. And third, I'm accepting the offer on your behalf and putting everything in writing on the case. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 3081. Thank you for your time, Sam.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Accept host goodwill for tonight; escalate if not fixed by tomorrow.","policy_ref":"rebooking_refund","why":"Minor, short-duration amenity outage handled with host goodwill; larger remedy if persists."},"auth":{"path":"alura","customer_name":"Sam Ferris"},"callback":true,"value_tier":"standard","reference":"3081"},{"id":"hin-01","title":"Host: 'the guest left a broken window \u2014 what do I do?'","category":"host_damage","callType":"inbound_host","severity":2,"emotion":"calm","accent":"en-AU","value_tier":"high","callback":false,"reference":"5610","caller":{"name":"Karen","role":"host"},"auth":{"path":"alura","customer_name":"Karen Whitlock"},"context":{"listing":"Beach house, Byron Bay","booking":"guest checked out this morning","facts":["cracked window pane in the lounge, found at turnover","host has before/after photos and a glazier's quote for AUD 480","guest hasn't been contacted yet","host has 40+ five-star reviews \u2014 a host worth keeping"]},"lexicon":["glazier","quote","Resolution Center","14 days","itemised"],"turns":[{"customer":"Hi, yeah \u2014 Karen here, I've got the beach house in Byron. The guests who left this morning have cracked the lounge window. I've got photos and a quote from the glazier. What's the process? I've never had to do this.","expects":["opening","auth","listen"],"model":"Hi Karen, this is {name} with Airbnb Elevated Support \u2014 I can walk you through the whole process, it's straightforward when you do it in the right order. Before we go any further, I just need to confirm the account \u2014 could I have your first and last name, please?","coach":"Host calmo e objetivo: espelhe o ritmo, sem empatia perform\u00e1tica. Autentique primeiro."},{"customer":"Karen Whitlock.","expects":["auth","paraphrase"],"model":"Thank you, Karen \u2014 that matches what I have here. So, just to make sure I've got this right: the guests checked out this morning, you found a cracked window pane in the lounge at turnover, you have before-and-after photos and a glazier's quote for four hundred and eighty dollars, and you haven't contacted the guest yet. Is that everything?","coach":"'That matches' fecha a autentica\u00e7\u00e3o. Par\u00e1frase com os fatos em ordem.","customer_if_weak":"Sorry \u2014 did you verify me? You didn't say."},{"customer":"That's it exactly. So do I message them, or do I come to you?","expects":["policy","options","ownership"],"model":"You go to the guest first, through the Resolution Center \u2014 that's the required first step, and it has to happen within 14 days of check-out, so you've got plenty of time but don't sit on it. Upload the photos and the glazier's quote and request the four-eighty. If the guest pays, done. If they decline or don't respond, you then submit it to Airbnb under Host Damage Protection, and that deadline is 30 days from check-out. Your evidence is exactly what a reviewer wants \u2014 before-and-after and an itemised quote.","coach":"Ordem do processo com os dois prazos (14 e 30 dias). Elogia a evid\u00eancia \u2014 \u00e9 o que decide.","customer_if_weak":"Right, but which one first? You said two things."},{"customer":"Perfect. And this won't affect my rating or anything, will it?","expects":["policy","empathy","options"],"model":"No \u2014 filing a damage request doesn't touch your ratings or your Superhost status; it's a normal part of hosting. And Karen, I'll say this because it's true: forty-plus five-star reviews and evidence this organised is exactly the kind of host we want to keep. I'll message you the Resolution Center path right after this call so you can do it in two minutes.","coach":"Responde ao medo real (rating), com verdade. Reten\u00e7\u00e3o: reconhece o host de alto valor sem prometer nada fora da regra."},{"customer":"Great, thanks.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the cracked window is physical damage caused by the guest, which is what Host Damage Protection is for, and your photos and quote are the right evidence. Second, step one is to request the four hundred and eighty dollars from the guest in the Resolution Center within 14 days of check-out \u2014 I'm sending you the path by message now. Third, if the guest doesn't pay, you submit to Airbnb within 30 days of check-out, and none of this affects your ratings. Have I explained those steps clearly? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case \u2014 you'll have it all in writing in the app under reference 5610. Thanks for calling, Karen.","coach":"Resumo completo \u2192 passos claros? \u2192 mais ajuda? \u2192 fechar. Refer\u00eancia e 'por escrito'.","customer_if_weak":"Hang on, what was the first step again?"}],"resolution":{"correct":"Guide the host: Resolution Center request within 14 days, then Host Damage Protection within 30 days; evidence is sufficient.","policy_ref":"host_damage_protection","why":"Process order and deadlines; physical damage covered."}},{"id":"hin-02","title":"Host: 'the guest says it was dirty \u2014 I have the cleaner's photos'","category":"uninhabitable","callType":"inbound_host","severity":2,"emotion":"host_defensive","accent":"en-US","value_tier":"high","callback":false,"reference":"6720","caller":{"name":"Luis","role":"host"},"auth":{"path":"pin","customer_name":"Luis Herrera","verified_phone_ends":"3391","pin":"517204"},"context":{"listing":"Condo, San Diego","booking":"guest arrived yesterday, 4 nights","facts":["guest reported 'filthy on arrival' with photos of a stained sofa and dust","host has the cleaner's timestamped photos from 2 hours before check-in","the sofa stain appears in the cleaner's photos too \u2014 it's pre-existing","host is worried about payout and about the review"]},"lexicon":["timestamped","pre-existing","stain","turnover","reasonably clean"],"turns":[{"customer":"Hey, so I just got a notification that my guest reported the condo as 'filthy'. That's ridiculous \u2014 my cleaner was there two hours before check-in, I have her photos with timestamps. What happens to my payout now?","expects":["opening","auth","listen"],"model":"Hi Luis, this is {name} with Airbnb Elevated Support. I'm glad you called straight away, and timestamped photos from the turnover are exactly the right thing to have \u2014 let's get them on the record. Before we go any further, I need to verify the account: I'm sending a PIN to the phone number ending in 3391 right now \u2014 could you read it back to me when it arrives?","coach":"Host defensivo: valide a evid\u00eancia dele antes de qualquer coisa. Autentique por PIN.","customer_if_weak":"So you're already on their side."},{"customer":"Got it \u2014 five one seven two zero four.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: the guest reported the condo as filthy on arrival with photos of a stained sofa and some dust; your cleaner was there two hours before check-in and you have her timestamped photos; and you want to know what this means for your payout. Is that everything?","coach":"Fecha a auth. Par\u00e1frase separa o que o guest alega do que o host tem.","customer_if_weak":"Did that go through? You didn't say."},{"customer":"Yes. And the sofa stain is in HER photos too \u2014 it's been there for a year, it's not dirt, it's an old mark.","expects":["clarify","policy","empathy"],"model":"That's an important detail, and it works in your favour: if the same mark is visible in the cleaner's photos, it's pre-existing, not a cleaning failure. The standard the policy uses is 'reasonably clean and sanitary' \u2014 not spotless \u2014 so an old mark on a sofa doesn't make a place unclean. Could you upload the cleaner's photos to the case now? And one question so I have the full picture: apart from the sofa, is there anything in the guest's photos your cleaner wouldn't have covered?","coach":"Ensina o crit\u00e9rio ('reasonably clean', n\u00e3o 'spotless') e pede a evid\u00eancia. Pergunta honesta sobre o resto \u2014 imparcialidade."},{"customer":"Dust on a top shelf, maybe. That's it. So what happens?","expects":["policy","options","ownership"],"model":"Here's how it works. Nothing is decided on this call \u2014 a reviewer looks at both sides' photos. With timestamped turnover photos showing the same sofa mark, the guest's claim of 'filthy' is going to be hard to support; some dust on a top shelf isn't an uninhabitable condition. Your payout isn't touched unless a reviewer finds a genuine cleanliness failure, and I'll note the pre-existing mark clearly. If the guest is unhappy, the usual path is that you can offer a small goodwill gesture yourself through the Resolution Center \u2014 entirely your choice, and it often heads off a bad review. I'll message you a summary within the hour.","coach":"N\u00e3o decide na liga\u00e7\u00e3o; explica o crit\u00e9rio e a probabilidade com honestidade; oferece ao host a ferramenta de reten\u00e7\u00e3o (gesto pr\u00f3prio) sem pressionar.","customer_if_weak":"So am I losing money or not? Yes or no."},{"customer":"Alright. That's fair.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the guest reported the condo as unclean, and you have timestamped cleaner photos from two hours before check-in that show the sofa mark is pre-existing. Second, I've asked you to upload those photos to the case, and I've noted that the mark is old and that the standard is 'reasonably clean', not spotless; a reviewer will look at both sides and your payout isn't affected unless they find a genuine failure. Third, if you want, you can offer the guest a small goodwill gesture through the Resolution Center \u2014 your call. Have I explained those steps clearly? \u2026 And is there anything else I can help you with today? \u2026 Then I'll close this case, and you'll have it all in writing in the app under reference 6720. Thanks, Luis.","coach":"Sumariza\u00e7\u00e3o completa antes das duas perguntas e do fechamento.","customer_if_weak":"Wait, do I upload something or not?"}],"resolution":{"correct":"Evidence goes to review; pre-existing mark noted; payout likely unaffected; host may offer own goodwill.","policy_ref":"cleanliness","why":"'Reasonably clean' standard; impartial review of both sides' evidence."}},{"id":"hin-03","title":"Host: needs to cancel \u2014 mother in hospital","category":"host_cancel","callType":"inbound_host","severity":2,"emotion":"host_pleading","accent":"en-IN","value_tier":"standard","callback":false,"reference":"7308","caller":{"name":"Meera","role":"host"},"auth":{"path":"manual","customer_name":"Meera Krishnan","phone":"+91 98 4455 0128","dob":"3 February 1979","payment_last4":"2264"},"context":{"listing":"Apartment, Bengaluru","booking":"guest arriving in 6 days, 3 nights","facts":["host's mother was admitted to hospital last night; host must travel","host is calling from a relative's phone","host has a hospital admission letter","cancellation 6 days out normally carries a 25% fee (48h\u201330d window)"]},"lexicon":["admission letter","documentation","penalty","valid reason","calendar blocked"],"turns":[{"customer":"Hello, good evening. I am a host, I have an apartment in Bengaluru. My mother was admitted to hospital last night and I have to travel to her. I have a guest coming in six days \u2014 I need to cancel, but I am worried about the penalty. Please, what can I do?","expects":["opening","auth","empathy","listen"],"model":"Good evening, Meera, this is {name} with Airbnb Elevated Support. I'm sorry about your mother \u2014 let's sort the booking so it's one less thing on your mind. Before we go any further, I need to verify the account, and as you're not calling from the number we have on file I'll need a few details: your full name, the phone number on the account, your date of birth, and the last four digits of the payment method.","coach":"Empatia curta e sincera, depois autentica\u00e7\u00e3o manual explicada (n\u00famero diferente).","customer_if_weak":"I am sorry, why do you need all this? I only want to cancel."},{"customer":"Yes, of course. Meera Krishnan. The number on the account is plus nine one, nine eight, four four five five, zero one two eight. Date of birth third February 1979. And the card ends in two two six four.","expects":["auth","paraphrase"],"model":"Thank you \u2014 that all matches. You're verified. So, just to make sure I've got this right: your mother was admitted to hospital last night, you need to travel to be with her, you have a guest arriving in six days for three nights, and you want to cancel without being penalised. Is that everything?","coach":"Fecha a autentica\u00e7\u00e3o manual e parafraseia.","customer_if_weak":"Sir, did it match? You did not say."},{"customer":"Yes. I have the hospital letter also, the admission letter.","expects":["policy","options","ownership"],"model":"That letter is exactly what matters. Here's how it works: a host cancellation six days out normally carries a fee \u2014 twenty-five percent in that window \u2014 but a valid reason outside your control, with documentation, can waive it, and a hospital admission for a parent is a clear example. I can't decide the waiver on this call; a reviewer does. What I'll do now is process the cancellation, attach your admission letter, and flag it as documented. Can you upload the letter in the app, or send it to me on the case?","coach":"Regra + exce\u00e7\u00e3o + limite do agente + a\u00e7\u00e3o concreta. Sem prometer o waiver.","customer_if_weak":"So I will be charged or not? Please tell me clearly."},{"customer":"I will upload now. And the guest? I feel bad for them.","expects":["policy","empathy","expectations"],"model":"The guest gets a full refund and help rebooking \u2014 that happens automatically, so they're looked after. Your calendar will show those dates as blocked, which is standard after any cancellation. You'll have the reviewer's decision on the fee by message, usually within a couple of days. And Meera \u2014 go be with your mother; the case is in hand.","coach":"Responde \u00e0 preocupa\u00e7\u00e3o com o guest, explica o bloqueio de calend\u00e1rio sem drama, prazo, toque humano."},{"customer":"Thank you, sir. Thank you very much.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, you need to cancel the reservation in six days' time because your mother is in hospital, and you have the admission letter. Second, I've processed the cancellation, and once you upload the letter I'll attach it and flag the case as documented \u2014 a reviewer decides on waiving the fee, usually within a couple of days. Third, the guest is refunded and rebooked automatically, and your calendar shows those dates as blocked. Have I explained those steps clearly? \u2026 Is there anything else I can help you with today? \u2026 Then I'll close this case, and you'll have all of it in writing in the app under reference 7308. Take care, Meera.","coach":"Resumo \u2192 claro? \u2192 mais ajuda? \u2192 fechar. Tom humano mantido.","customer_if_weak":"Sorry, what should I upload again?"}],"resolution":{"correct":"Cancel; attach hospital letter; fee waiver decided by reviewer; guest refunded and rebooked.","policy_ref":"host_cancellation_policy","why":"Documented valid reason outside host's control can exempt the fee."}},{"id":"acc-in-03","title":"Couldn't find the place \u2014 pin was 2 km off","category":"access","callType":"inbound_guest","severity":2,"emotion":"frustrated","accent":"en-GB","value_tier":"standard","callback":false,"reference":"5133","caller":{"name":"Oliver","role":"guest"},"auth":{"path":"alura","customer_name":"Oliver Grant"},"context":{"listing":"Townhouse, Lisbon","booking":"4 nights, arrived last night","policy":"Moderate","facts":["map pin in the listing was about 2 km from the actual house","guest and host exchanged 14 messages over 90 minutes before he found it","arrived at 00:40 instead of 23:00; host was apologetic","guest wants the first night refunded"]},"lexicon":["map pin","directions","street","taxi","first night"],"turns":[{"customer":"Evening. Look, we got in eventually, but the map pin on the listing is two kilometres from the actual house. Ninety minutes, three taxis, fourteen messages with the host. We walked in at twenty to one. I'd like the first night refunded, frankly.","expects":["opening","auth","empathy","listen"],"model":"Good evening, this is {name} with Airbnb Elevated Support. Ninety minutes and three taxis to find a house you'd already paid for is a rotten end to a travel day, and I'm glad you're in. Before we go any further, I just need to confirm the account \u2014 could I have your first and last name, please?","coach":"Empatia espec\u00edfica (90 min, tr\u00eas t\u00e1xis) antes do processo. Autentica\u00e7\u00e3o por Alura."},{"customer":"Oliver Grant.","expects":["auth","paraphrase"],"model":"Thank you, Oliver \u2014 that matches what I have here. So, just to make sure I've got this right: the pin on the listing was about two kilometres off, it took you ninety minutes and fourteen messages with the host to find the house, you got in at twenty to one instead of eleven, and you'd like the first night refunded. Is that everything?","coach":"Fecha a auth e parafraseia com os n\u00fameros do cliente.","customer_if_weak":"Did you verify me or not? You just moved on."},{"customer":"That's it. And the host was nice about it, to be fair, but nice doesn't get me the evening back.","expects":["clarify","policy","options"],"model":"Fair. Here's how I'd frame it: a wrong location on the listing is one of the things the policy calls 'not as advertised', and a delayed first night because of it is exactly the kind of impact a reviewer looks at. What I need from you is the message thread with the host \u2014 that's your evidence, and it's strong because it shows the time. Two quick things: what time was check-in meant to be, and did the rest of the house match the listing once you were in?","coach":"Nomeia a categoria ('not as advertised' \u2014 localiza\u00e7\u00e3o) e pede a evid\u00eancia que j\u00e1 existe. Perguntas de decis\u00e3o."},{"customer":"Check-in was from eleven. And yes, the house itself is fine, lovely actually.","expects":["policy","options","expectations","ownership"],"model":"Good \u2014 that matters, because it means we're talking about the first night, not the stay. I'm putting the first night forward for a partial or full refund on the basis of the wrong location and the delay, with the message thread attached; I won't promise the reviewer's number, but the case is clear and the evidence is on the app. Separately, I'm flagging the pin on the listing so the next guest doesn't do the same. You'll hear from me by message within a day or two.","coach":"Escopo honesto (noite 1, n\u00e3o a estadia). A\u00e7\u00e3o, evid\u00eancia, prazo, sem promessa de valor.","customer_if_weak":"So is it a yes or a no?"},{"customer":"Alright. Thanks.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the map pin was two kilometres off and it delayed your check-in from eleven to twenty to one, which falls under 'not as advertised'. Second, I've put the first night forward for refund with your message thread as evidence, and flagged the listing's pin. Third, you'll have the reviewer's decision by message within a day or two, and the rest of the stay stands as booked. Have I explained those steps clearly? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case; you'll have all of this in writing in the app under reference 5133. Enjoy the rest of Lisbon, Oliver.","coach":"Resumo completo, as duas perguntas, fechamento com refer\u00eancia.","customer_if_weak":"Hang on, what exactly did you put forward?"}],"resolution":{"correct":"First night forwarded for refund (wrong location = mismatch); listing pin flagged; rest of stay stands.","policy_ref":"rebooking_refund","why":"Inaccurate location is a listed mismatch; impact limited to the first night."}},{"id":"acc-in-04","title":"Smart lock dead, slept in the car","category":"access","callType":"inbound_guest","severity":3,"emotion":"angry","accent":"en-US","value_tier":"high","callback":false,"reference":"7702","caller":{"name":"Marcus","role":"guest"},"auth":{"path":"manual","customer_name":"Marcus Bell","phone":"617-555-0122","dob":"19 April 1983","payment_last4":"8806"},"context":{"listing":"Loft, Nashville","booking":"3 nights, check-in was last night","policy":"Strict","facts":["smart lock battery dead; keypad unresponsive","host didn't answer from 22:10 until 07:30","guest slept in his rental car outside","guest is calling from a friend's phone \u2014 his own died"]},"lexicon":["smart lock","battery","keypad","unresponsive","slept in the car"],"turns":[{"customer":"I slept in my car last night. The smart lock on your listing is dead \u2014 keypad does nothing, no light, nothing \u2014 and the host didn't answer a single message from ten till this morning. I'm on my buddy's phone because mine died. Somebody better fix this.","expects":["opening","auth","empathy","listen"],"model":"This is {name} with Airbnb Elevated Support. Sleeping in your car outside a place you'd paid for, with no answer from the host all night, is unacceptable, and I'm going to deal with it now. Because you're calling from a different number, I need to verify the account first with a few details: your full name, the phone number on the account, your date of birth, and the last four digits of the payment method.","coach":"Raiva: fato + a\u00e7\u00e3o, sem defender. Explica POR QUE \u00e9 autentica\u00e7\u00e3o manual (n\u00famero diferente)."},{"customer":"Seriously? Fine. Marcus Bell. Six one seven, five five five, zero one two two. April nineteenth, eighty-three. Card ends in eight eight zero six.","expects":["auth","paraphrase"],"model":"Thank you, Marcus \u2014 that all matches, you're verified. So, just to make sure I've got this right: the smart lock's keypad was completely dead when you arrived, the host didn't respond from ten last night until half seven this morning, and you slept in your car outside the loft. Is that everything?","coach":"Fecha a auth manual e parafraseia sem julgamento.","customer_if_weak":"Did that go through? Because I'm not repeating it."},{"customer":"That's it. And now he's texting 'so sorry, battery' like that fixes anything.","expects":["policy","options","ownership","clarify"],"model":"It doesn't. Here's where it stands: a check-in time that passed with no way in and no host response is an access failure, full stop \u2014 the battery is the host's responsibility, not yours. The night you couldn't use is refundable, and I'm putting that through now. Then there's today: is the lock working now, and do you actually want to stay there, or would you rather I rebook you somewhere else for the remaining two nights?","coach":"Pol\u00edtica clara e decisiva (access failure). Separa a noite perdida da decis\u00e3o sobre o resto; d\u00e1 escolha."},{"customer":"He says it's working. I'll stay \u2014 I don't have the energy to move. But I want that night back and I want him to know this isn't okay.","expects":["policy","expectations","ownership","retention"],"model":"Understood, and both of those are happening. The first night is going forward for refund as an access failure \u2014 with the message timestamps as evidence, I'd be surprised by anything else, though the reviewer signs it off, not me. The host is being notified formally, and this goes on their record. And Marcus, given the night you had, I'm adding a credit as a goodwill gesture, separate from the refund. You'll see both in the app; refunds usually land within 15 days.","coach":"Cliente de alto valor com caso claro: reembolso pela regra + gesto separado. Prazo real.","customer_if_weak":"Great, more words. What am I actually getting?"},{"customer":"Fine.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the smart lock was dead and the host was unreachable all night, so last night is an access failure and is going forward for refund. Second, you're staying for the remaining two nights now that the lock works, the host has been formally notified, and I've added a goodwill credit separately. Third, you'll see the refund and the credit in the app, with the refund usually landing within 15 days. Have I explained those steps clearly? \u2026 Is there anything else I can help you with today? \u2026 Then I'll close this case; you'll have it all in writing under reference 7702. Get some sleep, Marcus.","coach":"Resumo, confirma\u00e7\u00e3o, fechamento \u2014 e um toque humano proporcional.","customer_if_weak":"Wait, what's the refund for again?"}],"resolution":{"correct":"Night 1 refunded (access failure); host notified; goodwill credit for high-value guest; stay continues.","policy_ref":"checkin_trouble","why":"Check-in time passed, no access, no host response."}},{"id":"hin-04","title":"Host: 'they left the place filthy'","category":"host_damage","callType":"inbound_host","severity":2,"emotion":"frustrated","accent":"en-IE","value_tier":"high","callback":false,"reference":"6045","caller":{"name":"Niamh","role":"host"},"auth":{"path":"pin","customer_name":"Niamh Keane","verified_phone_ends":"7719","pin":"640218"},"context":{"listing":"Cottage, Kerry","booking":"guests checked out this morning after 5 nights","facts":["rubbish left in every room, dishes unwashed, sticky floors, a red-wine stain on a cream rug","host's cleaner says it's 5 extra hours; rug may need professional cleaning","host has photos from this morning and the cleaner's turnover photos from before check-in","host has 60+ reviews at 4.9 \u2014 worth keeping"]},"lexicon":["rubbish","unwashed","sticky","stain","rug","extra cleaning"],"turns":[{"customer":"Hi, Niamh here, the cottage in Kerry. The lot that checked out this morning left it in a state \u2014 rubbish in every room, dishes in the sink, floors sticky, and a red-wine stain the size of a dinner plate on my cream rug. My cleaner's saying five extra hours. What can I actually claim?","expects":["opening","auth","listen"],"model":"Hi Niamh, this is {name} with Airbnb Elevated Support. I can tell you exactly what's claimable and how, and it's clearer than you might think. Before we go any further, I need to verify the account: I'm sending a PIN to the phone number ending in 7719 right now \u2014 could you read it back to me when it arrives?","coach":"Host frustrada e pr\u00e1tica: promete clareza, autentica por PIN."},{"customer":"Grand \u2014 six four zero two one eight.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: the guests checked out this morning after five nights, the cottage was left with rubbish everywhere, unwashed dishes and sticky floors, there's a red-wine stain on a cream rug, your cleaner estimates five extra hours, and you've got photos from this morning and from before check-in. Is that everything?","coach":"Fecha a auth; par\u00e1frase separa o desarrumado do dano.","customer_if_weak":"Sorry \u2014 did that PIN go through? You didn't say."},{"customer":"That's it. So, the five hours and the rug?","expects":["policy","clarify","empathy"],"model":"Here's the line the policy draws, and it matters for what you ask for. Normal mess after a stay \u2014 dishes, bins, floors \u2014 is expected turnover and usually isn't claimable as damage. What IS covered is extra cleaning caused by the guest beyond the ordinary, and stains are named specifically. So the rug is a strong claim: get a professional cleaning quote, or a replacement quote if it won't come out. The five hours is arguable if you can show it was well beyond a normal turnover \u2014 your before-and-after photos help there. One question: was there anything else \u2014 smoke smell, extra people, damage to furniture?","coach":"Ensina a linha (turnover normal \u00d7 limpeza extra/manchas) com honestidade \u2014 inclusive o que \u00e9 'arguable'. Pergunta o que pode aumentar o claim."},{"customer":"No smoke, no damage that I saw. Just filth. So how do I do it?","expects":["policy","options","ownership","expectations"],"model":"Two steps in order. First, request the amount from the guest in the Resolution Center within 14 days of check-out \u2014 you're on day zero, so plenty of time, but do it while the photos are fresh. Put the rug quote and the cleaner's invoice for the extra hours, itemised, with the before-and-after photos. Second, if the guest doesn't pay or declines, submit it to Airbnb under Host Damage Protection within 30 days of check-out. I'll message you the path right after this call. And Niamh \u2014 sixty reviews at four-point-nine; hosts like you are exactly who this protection is for.","coach":"Ordem, prazos, evid\u00eancia itemizada. Reten\u00e7\u00e3o genu\u00edna de host de alto valor."},{"customer":"Okay. That's clear. Thanks.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the rug stain is claimable as guest-caused extra cleaning, and the five extra hours can be included if your photos show it was well beyond a normal turnover; ordinary mess on its own isn't. Second, step one is a Resolution Center request to the guest within 14 days, with the rug quote, the itemised cleaning invoice and your before-and-after photos \u2014 I'm sending you the path now. Third, if the guest doesn't pay, you submit to Airbnb within 30 days of check-out. Have I explained those steps clearly? \u2026 Is there anything else I can help you with today? \u2026 Then I'll close this case; you'll have all of it in writing under reference 6045. Thanks for calling, Niamh.","coach":"Resumo com a linha da pol\u00edtica, os dois passos e os prazos.","customer_if_weak":"Sorry, what goes in the request again?"}],"resolution":{"correct":"Rug stain claimable; extra hours arguable with evidence; ordinary mess not; Resolution Center 14d then HDP 30d.","policy_ref":"host_damage_protection","why":"Stains and extra cleaning are named; normal turnover is not damage."}},{"id":"hd-out-03","title":"Calling a host: the guest broke the TV","category":"host_damage","callType":"outbound_host","severity":2,"emotion":"calm","accent":"en-ZA","value_tier":"standard","callback":true,"reference":"8121","caller":{"name":"Thabo","role":"host"},"auth":{"path":"alura","customer_name":"Thabo Nkosi"},"context":{"listing":"Flat, Cape Town","booking":"guest checked out 3 days ago","facts":["host opened a Resolution Center request for a cracked 55-inch TV \u2014 R 7,500","guest replied 'it was already cracked' and declined","host has a check-in photo showing the TV intact, dated the morning of arrival","you're calling to walk him through submitting to Airbnb"]},"lexicon":["cracked","screen","receipt","proof of purchase","declined"],"turns":[{"customer":"Hello, Thabo speaking.","expects":["opening","recording","auth"],"model":"Hi Thabo, this is {name} calling from Airbnb's Elevated Support team about the TV in your Cape Town flat. Before we start, two quick things: this call is being recorded for training and quality purposes \u2014 is that okay with you? And just to confirm I'm speaking with the right person, could I have your first and last name?","coach":"Callback: aviso de grava\u00e7\u00e3o com pergunta + confirmar a pessoa, antes de qualquer conte\u00fado."},{"customer":"Ja, that's fine. Thabo Nkosi.","expects":["auth","paraphrase"],"model":"Thank you, Thabo \u2014 that matches. So, just to make sure I've got this right: you asked the guest for seven and a half thousand rand for a cracked fifty-five-inch TV through the Resolution Center, the guest said it was already cracked and declined, and you have a photo from the morning of check-in showing the screen intact. Is that everything?","coach":"Fecha a auth; parafraseia o caso e a evid\u00eancia.","customer_if_weak":"Sorry, did you say it matched? I missed that."},{"customer":"That's right. And the guest's story is nonsense \u2014 my photo is timestamped.","expects":["policy","options","ownership"],"model":"That timestamped check-in photo is the single most useful thing you have, so let's build around it. The guest declining doesn't end it \u2014 it moves it to the next step: you submit a Host Damage Protection request to Airbnb, and you have until 30 days after check-out, so about 27 days left. A reviewer will look at both sides; your photo, a receipt or proof of purchase for the TV, and a repair or replacement quote is the set they'll want. Do you have the receipt, or at least the model number?","coach":"N\u00e3o chama o guest de mentiroso; deixa a evid\u00eancia falar. Prazo contado. Pede o que falta."},{"customer":"I have the receipt from last year, and a quote from the shop.","expects":["policy","expectations","ownership"],"model":"Then you're in good shape. Submit the request from the reservation page with the check-in photo, the check-out photo of the crack, the receipt and the quote \u2014 I'll message you the exact path now. One honest note: the reviewer may take depreciation into account on a year-old TV, so the figure could come back below the quote; I'd rather you hear that from me now. Decisions usually take a few days.","coach":"Expectativa honesta (deprecia\u00e7\u00e3o) antes que vire surpresa. Prazo.","customer_if_weak":"So will I get the full amount or not?"},{"customer":"Fair enough. Thanks for the call.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the guest declined your Resolution Center request, so the next step is a Host Damage Protection request to Airbnb, due within 30 days of check-out \u2014 about 27 days from now. Second, you'll submit the timestamped check-in photo, the photo of the crack, last year's receipt and the shop's quote; I'm sending you the path by message. Third, a reviewer decides in a few days and may apply depreciation on a year-old TV. Have I explained those steps clearly? \u2026 Is there anything else I can help you with today? \u2026 Then I'll close this case; you'll have it all in writing under reference 8121. Thanks, Thabo.","coach":"Resumo com prazo, evid\u00eancia e a ressalva honesta.","customer_if_weak":"Wait \u2014 how many days did you say?"}],"resolution":{"correct":"Host submits HDP request within 30 days with photos, receipt, quote; depreciation possible.","policy_ref":"host_damage_protection","why":"Guest declined in Resolution Center; process moves to Airbnb review."}},{"id":"app-in-02","title":"Guest accused of damage \u2014 'that stain was there'","category":"appeal","callType":"inbound_guest","severity":2,"emotion":"suspicious","accent":"en-IN","value_tier":"high","callback":false,"reference":"9207","caller":{"name":"Priyanka","role":"guest"},"auth":{"path":"pin","customer_name":"Priyanka Nair","verified_phone_ends":"2044","pin":"391775"},"context":{"listing":"Apartment, Dubai","booking":"checked out 6 days ago","facts":["host requested AED 900 for a sofa stain via Resolution Center","guest says the stain was there at check-in and she has a check-in video showing it","guest is worried about being 'charged automatically'","guest has stayed 40+ nights on the platform this year"]},"lexicon":["stain","check-in video","declined","charged","dispute"],"turns":[{"customer":"Hello, I have received a request for nine hundred dirhams for a sofa stain. This stain was already there when I checked in \u2014 I have a video from the first day showing it clearly. I am worried you will just charge my card. Can you tell me how this works?","expects":["opening","auth","empathy","listen"],"model":"Hello, this is {name} with Airbnb Elevated Support \u2014 and no, nothing gets charged to your card automatically, so let's take that worry off the table first. A check-in video showing the stain is exactly the right evidence. Before we go further, I need to verify the account: I'm sending a PIN to the number ending in 2044 right now \u2014 could you read it back to me when it arrives?","coach":"Responde ao medo concreto primeiro ('nada \u00e9 cobrado automaticamente'), valida a evid\u00eancia, autentica por PIN."},{"customer":"Okay, it is here \u2014 three nine one seven seven five.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: the host has asked for nine hundred dirhams for a sofa stain, you're certain the stain was there at check-in, you have a video from day one that shows it, and you want to know how to respond without being charged. Is that everything?","coach":"Fecha a auth e parafraseia com o pedido real da cliente.","customer_if_weak":"Sorry \u2014 was the PIN correct? You did not confirm."},{"customer":"Yes, exactly. What should I do?","expects":["policy","options","ownership"],"model":"Here's how it works, step by step. The host's request came through the Resolution Center; you can decline it and, in the same place, add your check-in video and a short note saying the stain was present on arrival. If the host then escalates to Airbnb, a reviewer looks at both sides' evidence \u2014 and a dated check-in video is about as strong as evidence gets. You are never charged without that review, and you'll be able to see and respond to everything in the app. Would you like me to stay on while you upload the video?","coach":"Processo em ordem, direito de resposta, for\u00e7a da evid\u00eancia, oferta de ajuda concreta."},{"customer":"Yes please. I have stayed more than forty nights this year; I do not want a problem on my account.","expects":["retention","empathy","expectations"],"model":"I can see that history, Priyanka, and I want to say clearly: a host's request is not a mark against you \u2014 it's a request, and declining it with evidence is exactly what the process expects. Nothing on your account changes because of this. Once the video is up, I'll add a note on the case that you responded promptly with dated evidence. If it does go to review, that usually takes a few days and you'll be told by message.","coach":"Cliente de alto valor com medo de 'ficar marcada': tranquiliza com fatos, n\u00e3o com promessas de resultado."},{"customer":"Thank you. That is a relief.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the host's nine-hundred-dirham request is a Resolution Center request \u2014 nothing is charged to your card automatically. Second, you're declining it and uploading your check-in video with a note that the stain was present on arrival, and I'm noting on the case that you responded with dated evidence. Third, if the host escalates, a reviewer looks at both sides and you'll hear by message within a few days; your account isn't affected by the request itself. Have I explained those steps clearly? \u2026 Is there anything else I can help you with today? \u2026 Then I'll close this case; you'll have it all in writing under reference 9207. Thank you, Priyanka.","coach":"Resumo, confirma\u00e7\u00e3o, fechamento.","customer_if_weak":"Sorry \u2014 so do I pay or not?"}],"resolution":{"correct":"Guest declines with check-in video; no automatic charge; review only if host escalates.","policy_ref":"resolution_center","why":"Both sides' evidence is reviewed; dated check-in video is strong."}},{"id":"hin-05","title":"Host: 'they checked out three hours late and left a mess'","category":"host_damage","callType":"inbound_host","severity":1,"emotion":"host_indignant","accent":"en-AU","value_tier":"standard","callback":false,"reference":"3388","caller":{"name":"Bruce","role":"host"},"auth":{"path":"manual","customer_name":"Bruce Callaghan","phone":"+61 412 555 090","dob":"27 September 1970","payment_last4":"1147"},"context":{"listing":"Unit, Surfers Paradise","booking":"guests checked out today, 3 hours late","facts":["late check-out pushed the cleaner and delayed the next guests by 2 hours","unit left messy: pizza boxes, towels on the floor, nothing broken","house rules state 10 am check-out and a AUD 80 late fee","host is calling from his work phone"]},"lexicon":["check-out","late fee","house rules","next guests","towels"],"turns":[{"customer":"Yeah, g'day, Bruce here. Bunch of blokes just checked out of my unit three hours late \u2014 pizza boxes everywhere, towels on the floor \u2014 and my next guests had to wait two hours in the car park. My house rules say ten o'clock and an eighty-dollar late fee. I want that fee and I want them to know about it.","expects":["opening","auth","listen"],"model":"G'day Bruce, this is {name} with Airbnb Elevated Support. Late check-out that knocks on to your next guests is a genuine problem, and I'll tell you exactly what you can do about it. As you're calling from a number that isn't the one on the account, I need to verify a few details first: your full name, the phone number on the account, your date of birth, and the last four digits of the payment method.","coach":"Indigna\u00e7\u00e3o: reconhece o impacto real (pr\u00f3ximos h\u00f3spedes), autentica manual explicando o motivo."},{"customer":"Bruce Callaghan. Oh-four-one-two, five-five-five, oh-nine-oh. Twenty-seventh of September, nineteen seventy. Card ends one one four seven.","expects":["auth","paraphrase"],"model":"Thanks, Bruce \u2014 that all matches, you're verified. So, just to make sure I've got this right: the guests left three hours after your ten o'clock check-out, the unit was messy but nothing was broken, your next guests waited two hours, and your house rules set an eighty-dollar late check-out fee that you'd like to charge. Is that everything?","coach":"Fecha a auth manual; par\u00e1frase separa atraso (regra) de bagun\u00e7a (turnover) e registra 'nada quebrado'.","customer_if_weak":"Mate, did that go through or not?"},{"customer":"That's it. So can I charge it?","expects":["policy","options","empathy"],"model":"You can request it, and the way to do that is the Resolution Center: request the eighty-dollar late fee from the guest, citing the house rule, with the check-out time \u2014 messages or the smart-lock log if you have one. On the mess: pizza boxes and towels on the floor are unpleasant, but with nothing broken and no stains, that's normal turnover and isn't a damage claim. I'd keep the request to the late fee \u2014 a clean, rule-based ask is far more likely to be paid than a padded one. Do you have anything that shows the actual check-out time?","coach":"Ferramenta certa (Resolution Center para a taxa da house rule); honesto que bagun\u00e7a comum n\u00e3o \u00e9 dano; aconselha pedido limpo."},{"customer":"The lock log says 12:58. Fair enough on the mess, I suppose.","expects":["options","expectations","ownership"],"model":"Twelve fifty-eight against a ten o'clock rule \u2014 that's clear. Put the request in today with that log and the house rule quoted; the guest has time to respond, and if they decline, you can ask Airbnb to look at it. I'll message you the Resolution Center path now. And for the next guests who waited: if you'd like to send them a small gesture, you can do that from the same place \u2014 your call, but it tends to save the review.","coach":"Evid\u00eancia concreta, a\u00e7\u00e3o hoje, e uma dica de reten\u00e7\u00e3o para os pr\u00f3ximos h\u00f3spedes."},{"customer":"Righto. Cheers.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the guests checked out at twelve fifty-eight against a ten o'clock house rule, and you're requesting the eighty-dollar late fee through the Resolution Center with the lock log and the rule quoted \u2014 I'm sending you the path now. Second, the mess itself is normal turnover with nothing broken, so it isn't a damage claim. Third, if the guest declines, you can escalate to Airbnb, and you may want to send your next guests a small gesture for the wait. Have I explained those steps clearly? \u2026 Is there anything else I can help you with today? \u2026 Then I'll close this case; you'll have it all in writing under reference 3388. Cheers, Bruce.","coach":"Resumo, confirma\u00e7\u00e3o, fechamento.","customer_if_weak":"Hang on, what am I requesting again?"}],"resolution":{"correct":"Late fee requested via Resolution Center with lock log; ordinary mess not a damage claim.","policy_ref":"resolution_center","why":"House-rule fees go through Resolution Center; normal turnover is not damage."}}],"auth_paths":{"alura":"J\u00e1 autenticado pela Alura \u2014 pedir nome e sobrenome","pin":"Pr\u00e9-autenticado \u2014 enviar PIN ao n\u00famero verificado","manual":"Manual \u2014 nome completo, telefone, data de nascimento, 4 \u00faltimos d\u00edgitos do pagamento"}}</script>
<script type="application/json" id="d-emotions">{"_about":"Matriz de soft skills: como reconhecer o estado emocional do cliente pela fala e o que fazer/dizer/evitar. 'trap' = o erro que o agente costuma cometer nesse estado.","emotions":[{"id":"angry","label":"Anger","label_pt":"Raiva","color":"crit","signals":["fala alta e r\u00e1pida","interrup\u00e7\u00f5es","'this is unacceptable'","palavr\u00f5es","'I want to speak to your manager'"],"needs":"ser levado a s\u00e9rio e ver a\u00e7\u00e3o, n\u00e3o desculpas gen\u00e9ricas","do":["deixar terminar sem interromper","reconhecer o fato espec\u00edfico, n\u00e3o a emo\u00e7\u00e3o em geral","dizer o que voc\u00ea VAI fazer agora, com verbo e prazo","baixar o volume e desacelerar \u2014 o cliente tende a espelhar"],"dont":["'please calm down'","'I understand how you feel' (soa script)","justificar a empresa","pedir desculpas repetidamente"],"phrases":["You're right to be upset \u2014 arriving at eleven at night and not being able to get in is not acceptable, and I'm going to work on this with you right now.","Let me make sure I have this exactly right, because I don't want to get any part of it wrong.","Here's what I can do in the next five minutes."],"trap":"Defender a pol\u00edtica antes de reconhecer o fato. A ordem certa \u00e9 fato \u2192 a\u00e7\u00e3o \u2192 pol\u00edtica.","sequence":["ouvir at\u00e9 o fim","nomear o fato espec\u00edfico","assumir a pr\u00f3xima a\u00e7\u00e3o","s\u00f3 ent\u00e3o explicar limites"]},{"id":"frustrated","label":"Frustration","label_pt":"Frustra\u00e7\u00e3o","color":"warn","signals":["suspiros","'I've already explained this'","'nobody has called me back'","tom cansado mais que bravo"],"needs":"n\u00e3o repetir tudo de novo; sentir progresso","do":["mostrar que voc\u00ea LEU o hist\u00f3rico antes de perguntar","resumir o caso de volta em duas frases","assumir a continuidade: 'from here, I'm your point of contact'"],"dont":["'can you tell me what happened?' sem ler o caso","transferir sem contexto","prometer callback que n\u00e3o vai acontecer"],"phrases":["I can see this is your third contact about this, and I'm sorry you've had to repeat yourself. I've read the notes \u2014 let me confirm what I have.","You shouldn't have to chase this. I'm going to own it from here."],"trap":"Come\u00e7ar do zero. O cliente frustrado j\u00e1 contou a hist\u00f3ria; pe\u00e7a s\u00f3 o que falta.","sequence":["reconhecer o hist\u00f3rico","resumir","assumir posse","dar um pr\u00f3ximo passo com prazo"]},{"id":"panicked","label":"Panic","label_pt":"P\u00e2nico","color":"crit","signals":["fala entrecortada","'I don't know what to do'","refer\u00eancia a hora/seguran\u00e7a/crian\u00e7as","perguntas em cascata"],"needs":"seguran\u00e7a imediata e uma instru\u00e7\u00e3o por vez","do":["primeiro: 'are you safe right now?'","uma instru\u00e7\u00e3o por vez, curta","voz firme e lenta","confirmar que voc\u00ea vai ficar na linha"],"dont":["explicar pol\u00edtica agora","listar op\u00e7\u00f5es demais","transferir"],"phrases":["First thing: are you somewhere safe right now? Good. I'm staying on the line with you.","Let's do one thing at a time. Right now, I need the address you're at."],"trap":"Tentar resolver o caso inteiro. Em p\u00e2nico, o objetivo \u00e9 estabilizar; o caso vem depois.","sequence":["seguran\u00e7a","estabilizar","um passo por vez","s\u00f3 depois: caso"]},{"id":"crying","label":"Tears","label_pt":"Choro","color":"warn","signals":["voz embargada","pausas longas","pedido de desculpa por chorar"],"needs":"tempo e permiss\u00e3o para se recompor sem constrangimento","do":["dar tempo em sil\u00eancio (3\u20135 s)","normalizar: 'take your time'","voz mais baixa","oferecer continuar por mensagem se preferir"],"dont":["'don't cry'","preencher o sil\u00eancio com pol\u00edtica","apressar"],"phrases":["Take your time \u2014 there's no rush at all. I'm here.","We can do this at whatever pace works for you."],"trap":"Ficar desconfort\u00e1vel com o sil\u00eancio e falar demais.","sequence":["sil\u00eancio","permiss\u00e3o","ritmo do cliente","continuar"]},{"id":"grieving","label":"Grief","label_pt":"Luto","color":"warn","signals":["viagem por funeral/doen\u00e7a","cancelamento por morte na fam\u00edlia","voz apagada"],"needs":"humanidade primeiro; burocracia depois e com o m\u00ednimo de atrito","do":["condol\u00eancias curtas e sinceras","explicar que existe caminho para circunst\u00e2ncias extenuantes e o que precisa","reduzir ao m\u00ednimo o que o cliente precisa fazer"],"dont":["condol\u00eancias longas ou perform\u00e1ticas","pedir documenta\u00e7\u00e3o de forma fria","citar percentuais antes de explicar o caminho"],"phrases":["I'm very sorry for your loss. Let me take as much of this off your plate as I can.","There is a process for situations like this. I'll walk you through exactly what's needed, and it's less than you might think."],"trap":"Ir direto para 'we'll need a death certificate'.","sequence":["condol\u00eancias","caminho existe","m\u00ednimo necess\u00e1rio","voc\u00ea cuida do resto"]},{"id":"entitled","label":"Entitlement","label_pt":"Exig\u00eancia / 'eu mere\u00e7o'","color":"warn","signals":["'I'm a Superhost'","'I've spent thousands on this platform'","'I know my rights'","exig\u00eancia de exce\u00e7\u00e3o"],"needs":"ser reconhecido, mas a regra n\u00e3o muda por status","do":["reconhecer o hist\u00f3rico com a plataforma genuinamente","separar 'o que reconhe\u00e7o' de 'o que a pol\u00edtica permite'","oferecer o que est\u00e1 dentro da regra com generosidade"],"dont":["ceder \u00e0 press\u00e3o fora da pol\u00edtica","ironizar o status","dizer 'rules are rules'"],"phrases":["I can see you've been with us a long time, and I want to get this right for you. What I'm able to do is X \u2014 and I'll do that fully.","Your history matters to us. It doesn't change what the policy allows here, but it does change how carefully I'm going to handle it."],"trap":"Confundir reconhecimento com exce\u00e7\u00e3o.","sequence":["reconhecer status","limite claro","tudo que cabe na regra","sem promessas fora dela"]},{"id":"confused","label":"Confusion","label_pt":"Confus\u00e3o","color":"good","signals":["'wait, so what does that mean?'","repete perguntas","mistura termos (AirCover, refund, cancellation)"],"needs":"uma coisa por vez, sem jarg\u00e3o, com checagem","do":["definir cada termo na primeira vez","checar compreens\u00e3o: 'does that make sense so far?'","resumir em tr\u00eas pontos no fim"],"dont":["siglas sem explicar","falar r\u00e1pido","empilhar op\u00e7\u00f5es"],"phrases":["Let me explain that in plain terms, and stop me if anything isn't clear.","So, in short: one, two, three. Shall I send that in writing as well?"],"trap":"Explicar a pol\u00edtica inteira quando o cliente s\u00f3 precisa de uma resposta.","sequence":["um termo por vez","checar","resumir","enviar por escrito"]},{"id":"elderly_slow","label":"Older caller / slower pace","label_pt":"Pessoa mais velha / ritmo lento","color":"good","signals":["pede para repetir","dificuldade com o app","fala pausada","desconforto com tecnologia"],"needs":"paci\u00eancia genu\u00edna e passos concretos","do":["falar devagar sem infantilizar","um passo por vez, esperando confirma\u00e7\u00e3o","oferecer fazer pelo cliente o que for poss\u00edvel","perguntar se h\u00e1 algu\u00e9m que possa ajudar com o app"],"dont":["apressar","'just tap the button'","suspirar"],"phrases":["No problem at all \u2014 I'll go step by step, and you tell me when you're ready for the next one.","Would it help if I did that part on my end?"],"trap":"Assumir que a lentid\u00e3o \u00e9 falta de intelig\u00eancia.","sequence":["ritmo do cliente","passo","confirma\u00e7\u00e3o","pr\u00f3ximo"]},{"id":"language_barrier","label":"Language barrier","label_pt":"Barreira de idioma","color":"good","signals":["ingl\u00eas limitado","tradu\u00e7\u00e3o literal","sil\u00eancio ap\u00f3s pergunta complexa","'sorry, my English'"],"needs":"frases curtas, vocabul\u00e1rio simples, confirma\u00e7\u00e3o frequente","do":["frases curtas, sem phrasal verbs","reformular em vez de repetir mais alto","confirmar por escrito no app","perguntar se prefere outro idioma dispon\u00edvel"],"dont":["falar mais alto","g\u00edrias","perguntas duplas"],"phrases":["I'll keep this simple. Is the problem with the KEY, or with the DOOR?","I will write this in the app too, so you have it."],"trap":"Repetir a mesma frase mais alto.","sequence":["simplificar","uma pergunta por vez","confirmar","escrever"]},{"id":"sarcastic","label":"Sarcasm","label_pt":"Sarcasmo","color":"warn","signals":["'oh, great, another one'","'sure, that's helpful'","riso seco"],"needs":"ser tratado como adulto; ver compet\u00eancia, n\u00e3o simpatia for\u00e7ada","do":["n\u00e3o entrar no jogo nem se defender","responder ao conte\u00fado, n\u00e3o ao tom","ser direto e competente"],"dont":["rir junto","'I sense some frustration'","ficar defensivo"],"phrases":["Fair enough. Let me show you rather than tell you \u2014 here's what I'm doing right now.","I'd rather give you something concrete than more words."],"trap":"Tentar 'quebrar o gelo'. Sarcasmo cede a compet\u00eancia, n\u00e3o a simpatia.","sequence":["ignorar o tom","conte\u00fado","a\u00e7\u00e3o vis\u00edvel","seguir"]},{"id":"threatening","label":"Threats (review / lawyer / chargeback / social media)","label_pt":"Amea\u00e7as","color":"crit","signals":["'I'll leave a one-star review'","'my lawyer'","'I'll dispute it with my bank'","'I'll post this everywhere'"],"needs":"perceber que a amea\u00e7a n\u00e3o \u00e9 necess\u00e1ria para ser levado a s\u00e9rio","do":["reconhecer o direito do cliente sem reagir \u00e0 amea\u00e7a","manter o foco no que voc\u00ea pode fazer","documentar no caso","se houver amea\u00e7a pessoal: seguir protocolo de seguran\u00e7a da opera\u00e7\u00e3o"],"dont":["pedir para n\u00e3o avaliar mal","argumentar sobre a amea\u00e7a","ceder por medo","'that's your right' em tom seco"],"phrases":["You're free to do that, of course. What I'd like to do first is give you a reason not to need to \u2014 let me show you what I can resolve today.","I'll note everything we discussed on the case so it's on record."],"trap":"Negociar contra a amea\u00e7a. Trate o caso; a amea\u00e7a perde for\u00e7a quando o caso anda.","sequence":["n\u00e3o reagir","foco no caso","a\u00e7\u00e3o","registrar"]},{"id":"talking_over","label":"Talks over you","label_pt":"Fala por cima","color":"warn","signals":["n\u00e3o deixa terminar frases","mon\u00f3logo","repete o mesmo ponto"],"needs":"ser ouvido completamente antes de ouvir","do":["parar de falar e deixar esgotar","anotar enquanto fala","retomar com o nome: 'Mr. Okafor, may I\u2026'","frases curtas quando retomar"],"dont":["falar ao mesmo tempo","aumentar o volume","'if you let me finish'"],"phrases":["I want to hear all of it \u2014 go on.","May I take thirty seconds to tell you what I'm going to do? Then I'm all yours again."],"trap":"Disputar o turno de fala. Voc\u00ea perde sempre.","sequence":["ceder","anotar","pedir turno curto","cumprir"]},{"id":"repeating","label":"Repeats themselves","label_pt":"Repete a mesma coisa","color":"good","signals":["mesma frase 3+ vezes","n\u00e3o registra suas respostas"],"needs":"sinal expl\u00edcito de que foi entendido","do":["repetir de volta com as palavras do cliente","escrever no app e dizer que escreveu","perguntar: 'is there anything I've missed?'"],"dont":["'as I said\u2026'","seguir sem confirmar"],"phrases":["Let me say it back to you so you know I've got it: \u2026. Is that exactly it?","I've written that on the case, word for word."],"trap":"Achar que o cliente n\u00e3o ouviu. Ele n\u00e3o se sentiu ouvido.","sequence":["espelhar","confirmar","registrar","avan\u00e7ar"]},{"id":"escalation_demand","label":"Demands a supervisor","label_pt":"Exige supervisor","color":"warn","signals":["'get me your manager'","'I want someone who can actually help'"],"needs":"acreditar que quem est\u00e1 na linha pode resolver","do":["n\u00e3o recusar nem ceder de imediato: 'I can do that. Before I do, let me tell you what I'm able to resolve myself, so you don't have to start over'","demonstrar autoridade real (o que voc\u00ea PODE aprovar)","se persistir, escalar com resumo completo"],"dont":["'there's no supervisor available'","transferir sem contexto","levar para o pessoal"],"phrases":["I can arrange that. First, let me tell you what I'm authorised to do right now \u2014 it may save you a second call.","If you'd still like a supervisor after that, I'll set it up and brief them fully."],"trap":"Bloquear a escalada. Ofere\u00e7a valor primeiro; escale sem drama depois.","sequence":["aceitar em princ\u00edpio","mostrar autoridade pr\u00f3pria","resolver ou escalar com resumo"]},{"id":"silent","label":"Monosyllabic / silent","label_pt":"Monossil\u00e1bico / calado","color":"good","signals":["'yeah', 'ok', 'fine'","pausas longas","respostas de uma palavra"],"needs":"perguntas abertas e permiss\u00e3o para discordar","do":["perguntas abertas: 'what would a good outcome look like for you?'","tolerar pausas","checar se est\u00e1 satisfeito de verdade"],"dont":["preencher com fala","assumir concord\u00e2ncia"],"phrases":["I want to make sure this actually works for you. What would you need to feel this is sorted?","You've gone quiet \u2014 did I miss something?"],"trap":"Ler 'ok' como acordo.","sequence":["pergunta aberta","pausa","confirmar satisfa\u00e7\u00e3o real"]},{"id":"suspicious","label":"Suspects a scam","label_pt":"Desconfiado (acha que \u00e9 golpe)","color":"warn","signals":["'how do I know you're really Airbnb?'","recusa dar dados","'I'll call back through the app'"],"needs":"verifica\u00e7\u00e3o que ele controla","do":["elogiar a cautela genuinamente","oferecer canal verific\u00e1vel (mensagem no app, n\u00famero oficial)","nunca pedir senha/cart\u00e3o","dar o n\u00famero do caso para ele conferir"],"dont":["insistir","pedir dados sens\u00edveis","levar para o pessoal"],"phrases":["That's exactly the right instinct. I'll send a message through the app right now so you can see it's us \u2014 and you're welcome to call back through the official channel.","I'll never ask for your password or card details."],"trap":"Tentar convencer. Deixe-o verificar.","sequence":["validar cautela","canal verific\u00e1vel","nunca dados sens\u00edveis","aguardar"]},{"id":"embarrassed","label":"Embarrassed (caused the problem)","label_pt":"Envergonhado (causou o problema)","color":"good","signals":["'it was kind of my fault'","riso nervoso","minimiza o dano"],"needs":"honestidade sem julgamento","do":["agradecer a honestidade","explicar o processo sem moralizar","apresentar o caminho mais leve dentro da regra"],"dont":["'well, you should have\u2026'","tom de bronca"],"phrases":["Thanks for being straight with me \u2014 that genuinely makes this easier. Here's how this normally goes.","These things happen. Let's just get it sorted."],"trap":"Qualquer tom de julgamento fecha o cliente.","sequence":["agradecer","processo","caminho leve"]},{"id":"exhausted","label":"Exhausted (late, long day)","label_pt":"Exausto","color":"good","signals":["'I just want to sleep'","meia-noite local","voz arrastada"],"needs":"decis\u00e3o r\u00e1pida para esta noite; o resto amanh\u00e3","do":["separar 'esta noite' de 'o caso'","resolver o imediato","marcar o resto por mensagem"],"dont":["processar o caso inteiro agora"],"phrases":["Let's sort tonight first, and I'll message you tomorrow with the rest so you don't have to stay on the line.","What do you need in the next hour?"],"trap":"Ser completo quando o cliente precisa de r\u00e1pido.","sequence":["hoje","depois","mensagem"]},{"id":"host_defensive","label":"Host: defensive (accused)","label_pt":"Host defensivo","color":"warn","signals":["'that guest is lying'","'my cleaner was there that morning'","lista de reviews positivos"],"needs":"sentir que sua vers\u00e3o conta e que o processo \u00e9 justo","do":["dizer que voc\u00ea ligou justamente para ouvir o lado dele","pedir evid\u00eancia do lado dele (fotos pr\u00e9 check-in, mensagens)","explicar crit\u00e9rios objetivos da decis\u00e3o","n\u00e3o revelar mais do que o necess\u00e1rio do outro lado"],"dont":["'the guest says\u2026' como se fosse fato","decidir na liga\u00e7\u00e3o","tom de acusa\u00e7\u00e3o"],"phrases":["I'm calling because your side of this matters, and I want it on the record before anything is decided.","Do you have photos from before check-in, or messages with the guest? Those help a lot."],"trap":"Soar como se a decis\u00e3o j\u00e1 estivesse tomada.","sequence":["ouvir","evid\u00eancia do host","crit\u00e9rios","pr\u00f3ximos passos e prazo"]},{"id":"host_indignant","label":"Host: indignant (losing payout)","label_pt":"Host indignado (vai perder pagamento)","color":"crit","signals":["'you're taking money out of my pocket'","'I'll delist'","'whose side are you on?'"],"needs":"entender o porqu\u00ea com clareza e ter um caminho de recurso","do":["explicar a base da decis\u00e3o com os fatos","ser claro sobre o valor e o motivo","apresentar o caminho de contesta\u00e7\u00e3o e o prazo","n\u00e3o discutir a pol\u00edtica, explicar como ela se aplica"],"dont":["'I'm just following policy'","pedir desculpa pela decis\u00e3o","prometer revis\u00e3o que n\u00e3o existe"],"phrases":["I want to be completely clear about what was decided and why, because you deserve that. The payout was reduced by X because Y.","If you believe something was missed, here's how to dispute it and the timeframe."],"trap":"Amaciar a not\u00edcia at\u00e9 ela ficar confusa. Clareza \u00e9 respeito.","sequence":["not\u00edcia clara","motivo","valor","recurso e prazo"]},{"id":"host_pleading","label":"Host: pleading (small operator)","label_pt":"Host implorando (pequeno anfitri\u00e3o)","color":"warn","signals":["'this is my only income'","'please, I have kids'","voz tr\u00eamula"],"needs":"humanidade e informa\u00e7\u00e3o exata sobre o que ainda pode fazer","do":["reconhecer o impacto real","ser exato sobre o que depende dele (evid\u00eancia, prazos)","n\u00e3o dar esperan\u00e7a falsa"],"dont":["'I wish I could help' vazio","prometer o que n\u00e3o pode"],"phrases":["I hear how much this matters, and I'm not going to pretend otherwise. What I can do is make sure nothing on your side is missed \u2014 here's exactly what would help.","I can't change the outcome on this call, but I can make sure your case is as strong as it can be."],"trap":"Ceder emocionalmente e prometer.","sequence":["reconhecer","exatid\u00e3o","o que ele controla","sem falsa esperan\u00e7a"]},{"id":"disappointed","label":"Disappointment","label_pt":"Chatea\u00e7\u00e3o / decep\u00e7\u00e3o","color":"warn","signals":["tom baixo, sem raiva","'I was really looking forward to this'","suspiros","'it is what it is'"],"needs":"ter a perda reconhecida antes de ouvir a solu\u00e7\u00e3o; n\u00e3o ser tratado como um ticket","do":["nomear o que foi perdido (a viagem, a comemora\u00e7\u00e3o, o descanso)","ir direto ao que d\u00e1 para fazer, sem inflar","dar uma escolha real, mesmo pequena"],"dont":["'at least\u2026' (minimiza)","excesso de alegria no tom","prometer compensar o que n\u00e3o se compensa"],"phrases":["I'm sorry \u2014 you'd planned this for months, and it didn't go the way it should have.","I can't give you the weekend back, but here's what I can do, and I'll do it properly."],"trap":"Tratar a decep\u00e7\u00e3o como se fosse raiva contida e ficar defensivo. Decep\u00e7\u00e3o pede reconhecimento, n\u00e3o justificativa.","sequence":["nomear a perda","o que d\u00e1 para fazer","escolha","pr\u00f3ximo passo"]},{"id":"calm","label":"Calm / matter-of-fact","label_pt":"Calmo / objetivo","color":"good","signals":["fala pausada","d\u00e1 os fatos em ordem","sem carga emocional"],"needs":"efici\u00eancia e precis\u00e3o; n\u00e3o quer conversa, quer resolu\u00e7\u00e3o","do":["espelhar o ritmo: objetivo e claro","confirmar os fatos em uma frase","ir para a pol\u00edtica e o pr\u00f3ximo passo r\u00e1pido"],"dont":["empatia perform\u00e1tica ('I can only imagine\u2026')","alongar"],"phrases":["Got it \u2014 access failure at 11:40, host unreachable, you're inside the window. Here's what happens next.","I'll keep this brief."],"trap":"Aplicar o roteiro de empatia em quem n\u00e3o pediu. Soa falso e perde tempo.","sequence":["confirmar fatos","pol\u00edtica","pr\u00f3ximo passo","fechar"]}]}</script>
<script type="application/json" id="d-phrases">{"_about":"Banco de frases por FASE da chamada. 'warm' = vers\u00e3o mais acolhedora e natural; 'neutral' = vers\u00e3o s\u00f3bria. 'why' explica a escolha. 'avoid' lista o que soa rob\u00f3tico, defensivo ou juridicamente arriscado.","phases":[{"id":"opening","label":"Opening","label_pt":"Apresenta\u00e7\u00e3o","inbound":[{"warm":"Thank you for calling Airbnb, this is {name} with the Elevated Support team. Who am I speaking with today?","why":"Nome + equipe + pergunta aberta pelo nome do cliente. 'Elevated Support' sinaliza que ele chegou a algu\u00e9m com autoridade."},{"neutral":"Airbnb Elevated Support, {name} speaking. How can I help?","why":"Curto, para quando o cliente j\u00e1 vem falando."}],"outbound_guest":[{"warm":"Hi, is this Ms. Okafor? This is {name} calling from Airbnb's Elevated Support team about your stay at the flat in Lisbon \u2014 is now a good time to talk for a few minutes?","why":"Confirma a pessoa, diz quem voc\u00ea \u00e9, diz sobre o qu\u00ea, e pede permiss\u00e3o. Quatro coisas em uma frase; sem elas o cliente fica em guarda."},{"neutral":"Good afternoon, this is {name} from Airbnb Elevated Support. I'm calling about case reference 4471. Do you have a moment?","why":"Vers\u00e3o s\u00f3bria com n\u00famero de caso."}],"outbound_host":[{"warm":"Hi Marco, this is {name} from Airbnb's Elevated Support team. I'm calling about the reservation from the 14th to the 18th \u2014 I wanted to hear your side before anything moves forward. Is this a good time?","why":"'Hear your side' desarma a defensiva antes que ela comece."},{"neutral":"This is {name} from Airbnb Elevated Support, regarding reservation HMK5T2. I need about ten minutes of your time \u2014 is now okay?","why":"Direto, com estimativa de tempo."}],"avoid":[{"text":"Hello? Yes? Airbnb.","why":"Sem nome, sem equipe, sem estrutura."},{"text":"I'm calling to inform you that\u2026","why":"Soa como notifica\u00e7\u00e3o autom\u00e1tica; dispara defesa."}]},{"id":"thanks","label":"Thanking for the contact","label_pt":"Agradecer o contato","lines":[{"warm":"Thanks for reaching out \u2014 I know it takes time to explain all this, and I appreciate it.","why":"Reconhece o esfor\u00e7o do cliente, n\u00e3o s\u00f3 o contato."},{"warm":"I'm glad you called rather than letting this sit. Let's get it looked at properly.","why":"Valida a decis\u00e3o de ligar."},{"neutral":"Thank you for contacting us about this.","why":"Neutro, para chat."}],"avoid":[{"text":"Thank you for your patience.","why":"Quando o cliente N\u00c3O teve paci\u00eancia, soa ir\u00f4nico. Use s\u00f3 se for verdade."}]},{"id":"auth","label":"Authentication","label_pt":"Autentica\u00e7\u00e3o (cr\u00edtico)","principle":"Toda chamada come\u00e7a aqui, antes de qualquer informa\u00e7\u00e3o da conta. Tr\u00eas caminhos: (1) j\u00e1 autenticado pela Alura \u2192 nome e sobrenome; (2) pr\u00e9-autenticado \u2192 PIN no n\u00famero verificado; (3) manual \u2192 nome completo, telefone, data de nascimento e os 4 \u00daLTIMOS d\u00edgitos do m\u00e9todo de pagamento. Nunca: senha, cart\u00e3o completo, CVV. N\u00e3o autenticar \u00e9 motivo de desligamento.","alura":[{"warm":"Before we go any further, I just need to confirm the account \u2014 could I have your first and last name, please?","why":"Alura j\u00e1 verificou; voc\u00ea s\u00f3 confirma. 'Before we go any further' sinaliza que \u00e9 obrigat\u00f3rio, n\u00e3o desconfian\u00e7a."},{"warm":"Thank you, {name_customer} \u2014 that matches what I have here. I've got your account in front of me.","why":"Diga explicitamente que confirmou. Isso fecha a etapa na grava\u00e7\u00e3o."}],"pin":[{"warm":"I need to verify the account before we continue. I'm sending a PIN to the phone number ending in 4471 right now \u2014 could you read it back to me when it arrives?","why":"Diz o que vai fazer, para onde vai, e o que espera. Os 4 \u00faltimos d\u00edgitos do telefone ajudam o cliente a confiar."},{"warm":"Perfect \u2014 that matches. You're verified, and I can see the reservation now.","why":"Fecha a etapa com 'verified'."},{"neutral":"It can take up to a minute to arrive. If it doesn't, I'll verify you another way \u2014 nothing to worry about.","why":"Antecipa o atraso do SMS sem abrir margem para pular a etapa."}],"manual":[{"warm":"As you're not calling from the number we have on file, I'll need to verify the account with a few details \u2014 it's a standard security step. Could I have your full name, the phone number on the account, your date of birth, and the last four digits of the payment method?","why":"Explica POR QUE \u00e9 manual (n\u00famero diferente) e nomeia os quatro dados de uma vez, para o cliente n\u00e3o sentir interrogat\u00f3rio."},{"warm":"Thank you \u2014 that all matches. You're verified.","why":"Fecha a etapa."},{"warm":"I'll never ask for your password, your full card number or the security code \u2014 only the last four digits.","why":"Protege o cliente e voc\u00ea. Diga quando o cliente hesitar."}],"if_fails":[{"warm":"I'm not able to verify the account with those details, and without that I can't share anything specific about the reservation \u2014 I'm sorry, it's there to protect you. Two options: I can message you through the app, or you can call back from the number registered on the account.","why":"Sem autentica\u00e7\u00e3o, sem informa\u00e7\u00e3o. Ofere\u00e7a os dois caminhos seguros."}],"avoid":[{"text":"Can I get your password to pull up the account?","why":"Nunca. Sinal de golpe, incidente de seguran\u00e7a."},{"text":"What's the card number?","why":"S\u00f3 os 4 \u00faltimos d\u00edgitos."},{"text":"(pular a etapa porque o cliente est\u00e1 nervoso)","why":"Estabilize primeiro se for emerg\u00eancia; autentique assim que for seguro. Nunca pule."}]},{"id":"recording","label":"Recording notice (callbacks)","label_pt":"Aviso de grava\u00e7\u00e3o (cr\u00edtico em callback)","principle":"Toda liga\u00e7\u00e3o que VOC\
