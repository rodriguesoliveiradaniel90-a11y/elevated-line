u00ca inicia: dizer que est\u00e1 sendo gravada para treinamento e qualidade, e perguntar se est\u00e1 tudo bem. Se n\u00e3o estiver, voc\u00ea pode parar a grava\u00e7\u00e3o. Esquecer isso numa chamada que a qualidade ouve \u00e9 motivo de desligamento.","lines":[{"warm":"Before we start, just so you know: this call is being recorded for training and quality purposes \u2014 is that okay with you?","why":"Curto, antes de qualquer conte\u00fado, com pergunta expl\u00edcita."},{"warm":"No problem at all \u2014 I'll stop the recording now. Right, let's carry on.","why":"Se o cliente recusar: para, confirma, segue."},{"warm":"Thank you. So, I'm calling about case 4471\u2026","why":"Se permitir: agradece e entra no assunto \u2014 sem repetir o aviso."}],"avoid":[{"text":"(come\u00e7ar direto no caso)","why":"O aviso vem ANTES do conte\u00fado."},{"text":"This call may be recorded.","why":"'May' \u00e9 vago. Diga que EST\u00c1 sendo gravada e pergunte."}]},{"id":"hold","label":"Hold & transfer","label_pt":"Espera e transfer\u00eancia (regra: 2 holds \u00d7 3 min)","lines":[{"warm":"May I place you on a brief hold \u2014 no more than three minutes \u2014 while I check the reservation? I'll come back and tell you what I've found.","why":"Permiss\u00e3o, tempo m\u00e1ximo, o que vai fazer."},{"warm":"Thanks for holding. Here's what I found.","why":"Retoma com conte\u00fado, n\u00e3o com desculpa."},{"warm":"I'm going to need a bit longer than a hold allows. Would you be happy to continue this over chat? I can keep researching on my side and you won't have to wait on the line.","why":"Depois do 2\u00ba hold, ou quando a pesquisa \u00e9 longa: transfer\u00eancia para o chat, com permiss\u00e3o."},{"warm":"I'm going to bring in our claims team, and I'll stay on the line to introduce you so you don't have to start over.","why":"Transfer\u00eancia quente."}],"avoid":[{"text":"Hold on.","why":"Sem permiss\u00e3o, sem tempo, sem motivo."},{"text":"(um terceiro hold)","why":"Regra: m\u00e1ximo 2. V\u00e1 para o chat."},{"text":"(voltar aos 5 minutos)","why":"M\u00e1ximo 3 minutos por hold."}],"principle":"At\u00e9 2 holds seguidos, de 3 minutos cada \u2014 sempre com permiss\u00e3o e com o tempo dito. Se precisar de mais, ofere\u00e7a continuar pelo chat (s\u00f3 com permiss\u00e3o do cliente) e pesquise por l\u00e1."},{"id":"empathy","label":"Empathy without admitting liability","label_pt":"Empatia sem confessar responsabilidade","principle":"'I'm sorry you're dealing with this' reconhece a experi\u00eancia do cliente. 'I'm sorry we did X' admite que a empresa errou \u2014 s\u00f3 diga isso quando for verdade e confirmado. A empatia certa \u00e9 espec\u00edfica ao fato, n\u00e3o gen\u00e9rica \u00e0 emo\u00e7\u00e3o.","lines":[{"warm":"I'm sorry you're dealing with this \u2014 arriving late and finding the place like that is not how anyone wants a trip to start.","why":"Espec\u00edfica ao fato, sem admitir culpa."},{"warm":"That sounds genuinely stressful, especially with kids in the car at that hour.","why":"Nomeia o detalhe que o cliente contou \u2014 prova que voc\u00ea ouviu."},{"warm":"You did the right thing taking photos straight away. That's going to help.","why":"Elogia a a\u00e7\u00e3o concreta; prepara a evid\u00eancia."},{"neutral":"I understand the situation, and I'll help you with it.","why":"S\u00f3bria."}],"avoid":[{"text":"I understand how you feel.","why":"Ningu\u00e9m acredita. Substitua pelo fato espec\u00edfico."},{"text":"I'm sorry we damaged your property.","why":"Admiss\u00e3o de responsabilidade antes de investigar."},{"text":"Unfortunately\u2026","why":"Anuncia m\u00e1 not\u00edcia antes de diz\u00ea-la; o cliente para de ouvir."},{"text":"Calm down.","why":"Nunca funcionou na hist\u00f3ria das chamadas."}]},{"id":"paraphrase","label":"Paraphrase the problem","label_pt":"Parafrasear o problema","principle":"Depois que o cliente exp\u00f5e o problema, reformule com as suas palavras \u2014 n\u00e3o repita literalmente \u2014 e pergunte se faltou algo. \u00c9 o que prova escuta, evita resolver o caso errado, e acalma quem j\u00e1 explicou tr\u00eas vezes.","lines":[{"warm":"So, just to make sure I've got this right: you arrived at half eleven, the lockbox code was rejected six times, and the host hasn't answered in forty minutes. Is that everything?","why":"Fatos concretos na ordem em que aconteceram + pergunta de fechamento."},{"warm":"Let me say that back to you so you know I've understood: \u2026 Have I missed anything?","why":"Vers\u00e3o para quem repete ou est\u00e1 frustrado."},{"neutral":"If I've understood correctly, the issue is X and what you're asking for is Y \u2014 is that right?","why":"Separa o problema do pedido \u2014 \u00fatil em recursos e disputas."}],"avoid":[{"text":"Okay, so what happened?","why":"Faz o cliente repetir em vez de voc\u00ea reformular."},{"text":"(repetir palavra por palavra)","why":"Parece papagaio. Reformule."}]},{"id":"clarify","label":"Clarifying questions","label_pt":"Perguntas de esclarecimento","lines":[{"warm":"Can I ask \u2014 when did you first notice the problem? I ask because there's a 72-hour window from that moment, and I want to make sure we're inside it.","why":"Explica POR QUE pergunta. A pergunta das 72h sem contexto soa como armadilha."},{"warm":"Were you able to reach the host about it? What did they say?","why":"A pol\u00edtica pede contato com o host quando vi\u00e1vel."},{"warm":"Do you have any photos or video? You can upload them in the app and I'll see them on my side.","why":"Evid\u00eancia, com o caminho."},{"warm":"Are you still at the property, or have you left?","why":"Fator de decis\u00e3o expl\u00edcito na pol\u00edtica."},{"warm":"Just so I understand the scale of it \u2014 is it one room, or the whole place?","why":"'Parte da estadia afetada'."}],"avoid":[{"text":"Did you report it within 72 hours?","why":"Fechada e acusat\u00f3ria. Pergunte QUANDO descobriu."}]},{"id":"options","label":"Explaining what's possible","label_pt":"Explicar a possibilidade de resolu\u00e7\u00e3o","principle":"Diga o que voc\u00ea VAI fazer, o que PODE acontecer, e o que N\u00c3O depende de voc\u00ea \u2014 nessa ordem. Nunca prometa o resultado de uma an\u00e1lise que ainda n\u00e3o foi feita.","lines":[{"warm":"Here's how this works. First, I'll document everything you've told me and the photos. Then it goes to review, and that's where the decision on a refund is made. What I can tell you now is which policy applies and what the possible outcomes are.","why":"Processo \u2192 decis\u00e3o \u2192 escopo do que voc\u00ea pode afirmar."},{"warm":"There are two paths here: we can look at rebooking you somewhere comparable for the remaining nights, or a refund for the nights affected. Which would be more useful to you?","why":"Duas op\u00e7\u00f5es, n\u00e3o cinco. Pergunta a prefer\u00eancia."},{"warm":"I can't promise the outcome of the review, but I can promise it will be looked at today and that you'll hear from me either way.","why":"Honesto sobre o limite; compromisso com o que controla."},{"neutral":"Based on what you've described, this would fall under our Rebooking and Refund Policy. The next step is a review of the evidence.","why":"Nomeia a pol\u00edtica."}],"avoid":[{"text":"You'll definitely get a full refund.","why":"Promessa de resultado que n\u00e3o \u00e9 seu."},{"text":"There's nothing I can do.","why":"Quase nunca \u00e9 verdade; h\u00e1 sempre um pr\u00f3ximo passo ou uma explica\u00e7\u00e3o."}]},{"id":"deny","label":"Delivering a no or a partial","label_pt":"Negar ou dar parcial","principle":"A negativa clara \u00e9 mais respeitosa que a negativa amaciada. Estrutura: o que foi decidido \u2192 por qu\u00ea (fato + regra) \u2192 o que ainda existe (recurso, gesto, pr\u00f3ximo passo).","lines":[{"warm":"I want to be straight with you. The refund request wasn't approved, and I'll tell you exactly why: the issue was reported six days after you found it, and the policy window is 72 hours. That's the whole reason.","why":"Claro, com o fato e a regra, sem 'unfortunately'."},{"warm":"What was approved is a refund for the two nights the heating was out \u2014 not the full stay, because the rest of the stay wasn't affected. I know that's not everything you asked for.","why":"Parcial explicada pela l\u00f3gica de 'parte afetada'; reconhece a lacuna."},{"warm":"If you feel something was missed in the review, you can dispute it, and I'll tell you how. I'd also add anything new you have \u2014 a message from the host, a receipt.","why":"Caminho de recurso concreto."},{"warm":"Separately from the policy, I'm able to offer a credit as a goodwill gesture. It doesn't change the decision, but I'd like you to have it.","why":"Gesto claramente separado da decis\u00e3o."}],"avoid":[{"text":"Unfortunately, as per policy, we are unable to\u2026","why":"Tr\u00eas marcadores de rob\u00f4 em uma frase."},{"text":"I'm sorry, my hands are tied.","why":"Transfere a culpa para o sistema e sai da conversa."}]},{"id":"policy","label":"Explaining the policy in plain English","label_pt":"Explicar a pol\u00edtica","lines":[{"warm":"The way the 72-hour rule works is simple: from the moment you discover a problem, you have three days to tell us or the host. It's there so issues can be checked while they're still happening.","why":"Regra + motivo. Regra sem motivo soa arbitr\u00e1ria."},{"warm":"Your booking was on a Strict policy, which means a free cancellation only within 48 hours of booking and at least 28 days before check-in. Because it was cancelled ten days out, the policy itself doesn't give a refund. That's the starting point \u2014 then we look at whether anything else applies.","why":"Pol\u00edtica do an\u00fancio explicada e depois aberta a exce\u00e7\u00f5es."},{"warm":"AirCover covers things that stop the place being what was advertised \u2014 no heating in winter, a missing bedroom, a pool that isn't there. It doesn't cover small inconveniences; the example we use is a broken toaster.","why":"Escopo com exemplos concretos."},{"warm":"For damage claims, the host needs to have asked you through the Resolution Center within 14 days of check-out. You have a right to respond, and both sides' evidence is looked at.","why":"Regra + direito do outro lado."}],"avoid":[{"text":"As per our terms and conditions section 4.2\u2026","why":"Ningu\u00e9m ouve depois de 'as per'."}]},{"id":"evidence","label":"Requesting evidence","label_pt":"Pedir evid\u00eancia","lines":[{"warm":"The strongest thing you can send is a photo with the date visible, or a short video walking through the room. Even a message to the host from that day helps.","why":"Diz O QUE \u00e9 forte, n\u00e3o s\u00f3 'send evidence'."},{"warm":"Could you upload those in the app under this reservation? I'll see them straight away and add them to the case.","why":"Caminho e confirma\u00e7\u00e3o."},{"warm":"If you don't have photos, don't worry \u2014 tell me what you do have, and we'll work with that.","why":"N\u00e3o fecha a porta."}],"avoid":[{"text":"Without evidence we can't do anything.","why":"Falso e hostil."}]},{"id":"expectations","label":"Managing expectations & timelines","label_pt":"Prazos e expectativas","lines":[{"warm":"Refunds are issued straight away on our side, but most take up to 15 days to show on your statement, depending on your bank. If it's not there by then, message me on the case and I'll chase it.","why":"N\u00famero real + o que fazer se falhar."},{"warm":"I'll follow up with you by message within 24 hours, whether or not there's news.","why":"Compromisso com prazo, inclusive sem novidade."},{"warm":"The review normally takes a day or two. I'd rather tell you two days and be early than one day and be late.","why":"Expectativa honesta."}],"avoid":[{"text":"It should be quick.","why":"Vago."}]},{"id":"summary","label":"Summary before closing","label_pt":"Sumariza\u00e7\u00e3o final (cr\u00edtico)","principle":"Antes de perguntar se o cliente entendeu e se precisa de mais ajuda, e antes de dizer que vai fechar o caso: resumir TUDO o que foi tratado \u2014 problema, o que foi feito, pr\u00f3ximos passos com prazos, refer\u00eancia. Vale para chat e liga\u00e7\u00e3o. Esquecer \u00e9 motivo de desligamento.","lines":[{"warm":"Before we finish, let me go over everything we covered today. You called because the lockbox code wasn't working and the host wasn't responding. I've messaged and called the host, opened an access-failure case, and started a rebooking search for tonight. You'll get options by message within the hour, and I'll call you back before six. Your reference is 4471.","why":"Problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia. Nessa ordem."},{"warm":"So today: the refund for the two affected nights was approved and is on its way \u2014 usually within 15 days; the hotel receipt is attached for the reviewer; and the dispute path is in the app if you need it.","why":"Vers\u00e3o curta para caso simples."},{"warm":"To sum up what we agreed: \u2026","why":"Abertura alternativa."}],"avoid":[{"text":"Okay, so is there anything else?","why":"Pulou o resumo. \u00c9 a falha que demite."},{"text":"(resumir s\u00f3 o pr\u00f3ximo passo)","why":"Resumo \u00e9 TUDO o que foi tratado."}]},{"id":"confirm","label":"Confirm understanding & offer more help","label_pt":"Confirmar entendimento e oferecer mais ajuda","principle":"Depois do resumo e antes de fechar: (1) os passos ficaram claros? (2) precisa de mais alguma coisa? S\u00f3 ent\u00e3o: 'vou fechar o caso'.","lines":[{"warm":"Have I explained those steps clearly? Is there anything you'd like me to go over again?","why":"Pergunta 1 \u2014 entendimento."},{"warm":"And is there anything else I can help you with today?","why":"Pergunta 2 \u2014 mais ajuda."},{"warm":"Then I'll go ahead and close this case. You'll have everything we discussed in writing in the app, under that reference.","why":"Fechamento anunciado, com o resumo por escrito."}],"avoid":[{"text":"I'm closing the case now, bye.","why":"Sem as duas perguntas antes."}]},{"id":"future","label":"Clarifying future doubts & how to reach us","label_pt":"Esclarecer d\u00favidas futuras","lines":[{"warm":"Before we finish \u2014 is there anything about this you're still unsure of? I'd rather cover it now than have you wonder later.","why":"Convite expl\u00edcito."},{"warm":"Your case reference is 4471. If you message through the app with that number, it comes straight to the team handling it \u2014 you won't have to start over.","why":"N\u00famero + como usar + benef\u00edcio."},{"warm":"I'm going to send a summary of what we agreed in the app in the next few minutes, so you have it in writing.","why":"Resumo por escrito \u2014 reduz recontato."},{"warm":"If anything changes tonight \u2014 the host gets back to you, or you find somewhere \u2014 just message the case, and we'll adjust.","why":"Antecipa o cen\u00e1rio mais prov\u00e1vel."}],"avoid":[{"text":"Is there anything else?","why":"F\u00f3rmula. Pergunte sobre O CASO."}]},{"id":"close","label":"Closing","label_pt":"Encerramento","lines":[{"warm":"Thanks for talking this through with me, Ms. Okafor. You'll hear from me by tomorrow. I hope the rest of the trip is a lot better than the start.","why":"Nome, pr\u00f3ximo passo, toque humano."},{"warm":"I've got everything I need. You don't need to do anything else tonight \u2014 I'll take it from here.","why":"Tira o peso do cliente."},{"neutral":"Thank you for your time. The case is documented and you'll receive an update by message.","why":"S\u00f3bria."}],"avoid":[{"text":"Have a nice day.","why":"Depois de uma noite trancado para fora? Leia a sala."}]},{"id":"host_specific","label":"Outbound to hosts","label_pt":"Ligando para anfitri\u00f5es","principle":"O host n\u00e3o te ligou; voc\u00ea ligou para ele, muitas vezes com not\u00edcia que custa dinheiro. Ele precisa de: por que voc\u00ea ligou, o que j\u00e1 se sabe, o que o lado dele pode mudar, e o que acontece a seguir.","lines":[{"warm":"I'm calling because a guest has reported an issue with the stay, and I want your account of it before anything is decided.","why":"Enquadra como investiga\u00e7\u00e3o justa."},{"warm":"Can you walk me through the check-in on the 14th \u2014 who prepared the place, and when?","why":"Pergunta aberta, factual."},{"warm":"Do you have photos from before check-in, or the cleaner's checklist? Those help your side a lot.","why":"Evid\u00eancia do host."},{"warm":"I have to be clear about something: because the guest couldn't get in until 1 a.m., the policy treats that as an access failure, and it affects the payout for that night. Here's how, and here's how you can dispute it.","why":"Not\u00edcia ruim clara, com mecanismo e recurso."},{"warm":"Your Superhost status isn't affected by this particular outcome. I want to say that because I know it's a worry.","why":"Antecipa o medo (quando for verdade)."},{"warm":"On the damage claim: the policy excludes normal wear and tear, so a worn sofa cushion wouldn't qualify \u2014 but a broken frame would. Which are we looking at?","why":"Ensina a linha da pol\u00edtica com exemplo do caso."}],"avoid":[{"text":"The guest says you\u2026","why":"Coloca a palavra do guest como acusa\u00e7\u00e3o."},{"text":"I'm just the messenger.","why":"Abdica."}]},{"id":"connection","label":"Line problems","label_pt":"Problemas de linha","lines":[{"warm":"I'm sorry, you're breaking up a little \u2014 could you say the last part again?","why":"Assume o problema como da linha, n\u00e3o do cliente."},{"warm":"If we get cut off, I'll call you straight back on this number.","why":"Antecipa a queda."},{"warm":"There's a bit of background noise on my end \u2014 I want to make sure I catch everything. Could you spell the name of the street for me?","why":"Pede soletrar com motivo."}],"avoid":[{"text":"What? Say again.","why":"Seco."}]},{"id":"retention","label":"Keeping the customer (CSAT)","label_pt":"Manter o cliente \u2014 julgamento comercial","principle":"Imparcial, com inclina\u00e7\u00e3o ao guest. Nunca pagar a quem est\u00e1 claramente errado. Mas os clientes desta linha gastam mais de US$ 1.000 e n\u00e3o podem ser perdidos \u2014 e hosts excelentes tampouco. Nos casos lim\u00edtrofes, o gesto de boa vontade separado da decis\u00e3o \u00e9 a ferramenta. Personaliza\u00e7\u00e3o (nome, detalhes) \u00e9 o que faz a nota do CSAT.","lines":[{"warm":"I can see you've been with us a long time, and I want to get this right for you. What the policy allows is X \u2014 and I'll do that fully, today.","why":"Reconhece o valor sem prometer exce\u00e7\u00e3o."},{"warm":"Separately from the decision, I'd like to offer a credit as a goodwill gesture. It doesn't change the outcome, but I'd like you to have it.","why":"Gesto claramente separado \u2014 para caso lim\u00edtrofe com cliente de alto valor."},{"warm":"I've looked at this carefully, and I'm not able to approve it \u2014 the evidence shows the damage happened after check-out, and paying it wouldn't be fair to the guest. Here's what I can do instead.","why":"Negativa a quem est\u00e1 errado, sem hostilidade, com o que resta."},{"warm":"You're one of the hosts we most want to keep, and I'll make sure this case reflects that \u2014 here's exactly what would help your side.","why":"Host excelente: reten\u00e7\u00e3o sem ceder na regra."}],"avoid":[{"text":"(pagar para o cliente parar de reclamar)","why":"Injusto com a outra parte e ensina o comportamento errado."},{"text":"Rules are rules.","why":"Perde o cliente de alto valor por nada."}]}]}</script>
<script type="application/json" id="d-policies">{"_about":"Refer\u00eancia DERIVADA do Airbnb Help Center (par\u00e1frase, n\u00e3o c\u00f3pia). Cada item traz a URL oficial. Verifique a fonte antes de citar n\u00fameros ao cliente: pol\u00edticas mudam.","_updated":"2026-09-11","policies":[{"id":"rebooking_refund","title":"Rebooking & Refund Policy (Reservation Issues)","source":"https://www.airbnb.com/help/article/2868","effective":"2025-02-06","summary":"Se a estadia tem um 'Reservation Issue', o Airbnb ajuda a remarcar ou reembolsa (total ou parcial). Quatro categorias: (1) Host cancela antes do check-in; (2) Host n\u00e3o d\u00e1 acesso; (3) Acomoda\u00e7\u00e3o inabit\u00e1vel \u2014 n\u00e3o razoavelmente limpa/sanit\u00e1ria, ou com risco \u00e0 sa\u00fade/seguran\u00e7a; (4) Significativamente diferente do an\u00fancio \u2014 tipo de espa\u00e7o, n\u00famero/tipo de c\u00f4modos, localiza\u00e7\u00e3o, presen\u00e7a n\u00e3o divulgada de host/pessoa/pet, amenidades anunciadas ausentes ou sem funcionar (ex.: piscina, banheira, eletrodom\u00e9sticos, aquecimento, ar-condicionado).","key_numbers":["Reportar em at\u00e9 72 horas ap\u00f3s DESCOBRIR o problema","Antes de acionar o Airbnb, quando vi\u00e1vel, o h\u00f3spede deve avisar o host e tentar resolver diretamente","Evid\u00eancia: fotos, v\u00eddeos ou confirma\u00e7\u00e3o do host"],"decision_factors":["gravidade do problema","impacto no h\u00f3spede","parte da estadia afetada","se o h\u00f3spede deixou a acomoda\u00e7\u00e3o","outros fatores atenuantes","for\u00e7a da evid\u00eancia"],"exclusions":["Problemas causados pelo pr\u00f3prio h\u00f3spede, acompanhantes, convidados ou pets","Inconvenientes menores (o AirCover cita a torradeira quebrada como exemplo)","Aplica-se a homes; n\u00e3o a experiences/services"],"host_side":"Quando h\u00e1 Reservation Issue, o host n\u00e3o recebe o payout ou tem o payout reduzido no valor reembolsado ao h\u00f3spede.","agent_must_say":["Qual foi o momento em que voc\u00ea descobriu o problema? (ancora as 72h)","Voc\u00ea conseguiu falar com o anfitri\u00e3o sobre isso? O que ele respondeu?","Voc\u00ea tem fotos ou v\u00eddeo? Pode enviar pelo app?","Voc\u00ea ainda est\u00e1 na acomoda\u00e7\u00e3o ou saiu?"],"common_misreadings":["Achar que 72h contam do check-in \u2014 contam da DESCOBERTA","Prometer reembolso total antes de ver evid\u00eancia e a parte da estadia afetada","Tratar amenidade menor (torradeira) como Mismatch coberto"]},{"id":"aircover_guests","title":"AirCover for guests","source":"https://www.airbnb.com/help/article/3218","summary":"Prote\u00e7\u00e3o inclu\u00edda em toda reserva de home. Cobre problemas s\u00e9rios: host cancela antes do check-in; aquecimento sem funcionar no inverno; n\u00famero de quartos diferente do anunciado; tipo de im\u00f3vel diferente (quarto privado vs casa inteira); amenidades principais anunciadas ausentes (piscina, cozinha). Resolu\u00e7\u00e3o: remarca\u00e7\u00e3o em lugar similar (conforme disponibilidade e pre\u00e7o compar\u00e1vel) ou reembolso total/parcial incluindo taxas de servi\u00e7o.","key_numbers":["72 horas para reportar ap\u00f3s a descoberta","Reembolsos: emitidos quase imediatamente; a maioria chega em at\u00e9 15 dias (pode variar por m\u00e9todo/regi\u00e3o)"],"exclusions":["Inconvenientes menores (torradeira quebrada)","Problemas de viagem em geral (atraso por tempestade, mala danificada)"],"agent_must_say":["O que o AirCover cobre \u00e9 o que impede a estadia de ser o que foi anunciado \u2014 n\u00e3o \u00e9 seguro-viagem","Se cabe remarca\u00e7\u00e3o, oferecemos primeiro; se n\u00e3o h\u00e1 op\u00e7\u00e3o compar\u00e1vel ou voc\u00ea preferir, reembolso"]},{"id":"cancellation_policies_guest","title":"Pol\u00edticas de cancelamento do an\u00fancio (cancelamento pelo h\u00f3spede)","source":"https://www.airbnb.com/help/article/475","summary":"O an\u00fancio escolhe uma pol\u00edtica; ela governa o que o h\u00f3spede recebe ao cancelar por vontade pr\u00f3pria.","tiers":[{"name":"Flexible","full_refund_until":"24h antes do check-in","after":"host recebe a 1\u00aa noite; se cancelar ap\u00f3s o check-in, noites usadas + 1"},{"name":"Moderate","full_refund_until":"5 dias antes do check-in","after":"noites usadas + 1 noite + 50% das noites n\u00e3o usadas"},{"name":"Limited","full_refund_until":"14 dias antes","after":"entre 7 e 14 dias: host recebe 50%; menos de 7 dias: host recebe 100%"},{"name":"Firm","full_refund_until":"30 dias antes","after":"conforme regras da pol\u00edtica Firm (verificar no an\u00fancio)"},{"name":"Strict","full_refund_until":"somente se cancelar em at\u00e9 48h da reserva E com 28+ dias at\u00e9 o check-in","after":"host recebe 100% de todas as noites (com limites por noites restantes)"},{"name":"Non-refundable (op\u00e7\u00e3o com desconto)","full_refund_until":"nunca (salvo Reservation Issue ou circunst\u00e2ncias extenuantes)","after":"sem reembolso"}],"agent_must_say":["Sua reserva foi feita na pol\u00edtica <tier>; pela pol\u00edtica, o reembolso seria <valor>","Isso muda se houver um Reservation Issue documentado \u2014 nesse caso entra outra pol\u00edtica","Sempre confirmar a pol\u00edtica exata no an\u00fancio antes de citar percentuais"],"common_misreadings":["Aplicar a regra 'gen\u00e9rica' sem checar a pol\u00edtica do an\u00fancio espec\u00edfico","Confundir cancelamento volunt\u00e1rio com Reservation Issue"]},{"id":"host_cancellation_policy","title":"Host Cancellation Policy (cancelamento pelo anfitri\u00e3o)","source":"https://www.airbnb.com/help/article/990","summary":"Host que cancela sem raz\u00e3o v\u00e1lida sofre penalidade e n\u00e3o recebe payout. Raz\u00f5es v\u00e1lidas: Major Disruptive Event ou motivos fora do controle \u2014 exigem documenta\u00e7\u00e3o.","penalties":[{"window":"48h ou menos antes do check-in (ou depois)","fee":"50% do valor das noites n\u00e3o utilizadas"},{"window":"entre 48h e 30 dias antes","fee":"25% do valor da reserva"},{"window":"mais de 30 dias antes","fee":"10% do valor da reserva"},{"window":"m\u00ednimo em qualquer caso","fee":"USD 50"}],"other_consequences":["calend\u00e1rio bloqueado nas datas","perda de Superhost","suspens\u00e3o ou remo\u00e7\u00e3o do an\u00fancio/conta"],"guest_side":"H\u00f3spede \u00e9 reembolsado integralmente e recebe ajuda para remarcar.","agent_must_say":["Ao ligar para o host: explicar que a pol\u00edtica prev\u00ea taxa por faixa de prazo e que documenta\u00e7\u00e3o pode isentar","Ao falar com o guest: reembolso integral + ajuda para remarcar"]},{"id":"host_damage_protection","title":"Host Damage Protection (AirCover for Hosts)","source":"https://www.airbnb.com/help/article/2869","summary":"Cobre perda/dano f\u00edsico \u00e0 propriedade eleg\u00edvel causado diretamente pelo h\u00f3spede respons\u00e1vel (incluindo pets), limpeza extra por manchas/fuma\u00e7a/convidados n\u00e3o autorizados, e perda de renda de reservas canceladas por causa do dano. Teto: USD 3.000.000.","key_numbers":["14 dias ap\u00f3s o check-out: host deve pedir ao h\u00f3spede via Resolution Center primeiro","30 dias ap\u00f3s o check-out: prazo m\u00e1ximo para enviar o formul\u00e1rio completo ao Airbnb","Teto USD 3.000.000"],"evidence":["recibos","fotos e v\u00eddeos","invent\u00e1rio com descri\u00e7\u00e3o, data de compra e condi\u00e7\u00e3o","or\u00e7amentos detalhados de reparo","comprovante de propriedade","boletim de ocorr\u00eancia (roubo/crime)"],"exclusions":["Danos descobertos ap\u00f3s o check-out do h\u00f3spede (sem nexo)","Desgaste natural (wear and tear) e deteriora\u00e7\u00e3o","MOFO, fungos e micr\u00f3bios","Atos da natureza (terremoto, clima)","Consum\u00edveis (exceto os especificados)","Bens fora da acomoda\u00e7\u00e3o; ve\u00edculos/embarca\u00e7\u00f5es em movimento"],"agent_must_say":["Ao host: o que \u00e9 desgaste natural n\u00e3o \u00e9 dano indeniz\u00e1vel","Ao host: precisa ter pedido ao h\u00f3spede no Resolution Center em 14 dias","Ao guest acusado: voc\u00ea tem direito de responder; a decis\u00e3o considera evid\u00eancia dos dois lados"],"common_misreadings":["Achar que mofo \u00e9 indeniz\u00e1vel \u2014 est\u00e1 exclu\u00eddo","Perder o prazo de 14 dias do Resolution Center"]},{"id":"monthly_stays","title":"Estadias mensais (28+ noites) \u2014 cancelamento pelo h\u00f3spede","source":"https://www.airbnb.com/help/article/1361","summary":"Aplica-se pol\u00edtica de longa dura\u00e7\u00e3o. Primeiro pagamento pode ser n\u00e3o reembols\u00e1vel. Se cancelar ap\u00f3s o in\u00edcio da estadia, o m\u00eas seguinte \u00e9 n\u00e3o reembols\u00e1vel. Host pode oferecer reembolso extra voluntariamente. Alternativa: pedir mudan\u00e7a de datas.","agent_must_say":["Confirmar se a reserva \u00e9 28+ noites \u2014 muda a pol\u00edtica inteira"]},{"id":"resolution_center","title":"Resolution Center","source":"https://www.airbnb.com/help/article/767","summary":"Canal para host e guest pedirem ou enviarem dinheiro um ao outro depois do in\u00edcio da reserva (ex.: host manda reembolso parcial por amenidade ausente; guest paga por uma caneca quebrada).","key_numbers":["At\u00e9 60 dias ap\u00f3s o check-out para abrir um pedido","Reembolsos: quase imediatos; maioria chega em at\u00e9 15 dias","Em media\u00e7\u00e3o, a parte tem 1 hora para responder"],"limits":["N\u00e3o serve para cobrar custos adicionais nem para reembolsar noites, contagem de h\u00f3spedes ou pets"],"agent_must_say":["Explicar ao guest/host como chegar: Trips (guest) ou Today (host) \u2192 reserva \u2192 Resolution Center"]},{"id":"checkin_trouble","title":"Problemas no check-in","source":"https://www.airbnb.com/help/article/4123","summary":"H\u00f3spede deve ligar/mensagem para o host primeiro. Se o hor\u00e1rio de check-in j\u00e1 passou, n\u00e3o consegue localizar/acessar e o host n\u00e3o respondeu em tempo razo\u00e1vel, contatar o Airbnb. Isso \u00e9 Access Failure.","agent_must_say":["Que horas era o check-in? Que horas voc\u00ea tentou falar com o host? Ele respondeu?","Voc\u00ea est\u00e1 em seguran\u00e7a agora? Precisa de acomoda\u00e7\u00e3o para esta noite?","Vamos tentar o host de novo enquanto conversamos; se n\u00e3o houver resposta, buscamos remarca\u00e7\u00e3o"]},{"id":"reporting_issue_flow","title":"Fluxo para reportar problema durante a estadia","source":"https://www.airbnb.com/help/article/248","summary":"1) Documentar (fotos/v\u00eddeo). 2) Contatar o host \u2014 melhor ponto de contato. 3) Se s\u00e9rio e o host n\u00e3o resolve, pedir ajuda ao Airbnb. Se o AirCover cobrir: remarca\u00e7\u00e3o em lugar similar (conforme disponibilidade e pre\u00e7o compar\u00e1vel) ou reembolso total/parcial.","key_numbers":["72 horas a partir da descoberta"],"agent_must_say":["Guiar o h\u00f3spede pelos tr\u00eas passos; confirmar cada um antes de decidir"]},{"id":"cleanliness","title":"Acomoda\u00e7\u00e3o suja no check-in","source":"https://www.airbnb.com/help/article/2993","summary":"Documentar, avisar o host, dar chance de corrigir quando razo\u00e1vel; se n\u00e3o for razoavelmente limpo e sanit\u00e1rio, pode ser Uninhabitable Condition.","agent_must_say":["Diferenciar 'n\u00e3o do meu padr\u00e3o' de 'n\u00e3o razoavelmente limpo/sanit\u00e1rio' \u2014 com evid\u00eancia"]}],"decision_tree":[{"q":"O h\u00f3spede cancelou por vontade pr\u00f3pria, sem problema na acomoda\u00e7\u00e3o?","yes":"cancellation_policies_guest (ou monthly_stays se 28+ noites)","no":"pr\u00f3xima"},{"q":"O host cancelou antes do check-in?","yes":"host_cancellation_policy + reembolso integral ao guest","no":"pr\u00f3xima"},{"q":"Houve problema na acomoda\u00e7\u00e3o (acesso, inabit\u00e1vel, diferente do an\u00fancio)?","yes":"rebooking_refund \u2192 checar 72h, contato com host, evid\u00eancia, parte afetada","no":"pr\u00f3xima"},{"q":"\u00c9 host pedindo indeniza\u00e7\u00e3o por dano?","yes":"host_damage_protection \u2192 14d Resolution Center, 30d formul\u00e1rio, exclus\u00f5es","no":"pr\u00f3xima"},{"q":"\u00c9 disputa de valor entre as partes ap\u00f3s a estadia?","yes":"resolution_center (60 dias)","no":"escalar / esclarecer"}]}</script>
<script type="application/json" id="d-rubric">{"_about":"Rubrica de corre\u00e7\u00e3o v2. Onze dimens\u00f5es (0\u20133), tr\u00eas delas CR\u00cdTICAS: falhar em auth, recording (quando aplic\u00e1vel) ou summary = falha cr\u00edtica \u2014 a nota \u00e9 limitada a 8/24 e a tela mostra reprova\u00e7\u00e3o, porque na opera\u00e7\u00e3o real isso \u00e9 motivo de desligamento. Usada offline (heur\u00edstica) e online (instru\u00e7\u00e3o ao Claude).","dimensions":[{"id":"auth","label":"Autentica\u00e7\u00e3o","weight":2.5,"critical":true,"bands":{"0":"N\u00e3o autenticou, ou pediu dado proibido (senha, cart\u00e3o completo, CVV).","1":"Tentou autenticar, mas incompleto ou fora do caminho certo (ex.: pediu s\u00f3 o nome quando era manual).","2":"Autenticou pelo caminho certo (Alura: nome e sobrenome \u00b7 PIN: enviou e ouviu de volta \u00b7 manual: nome completo, telefone, data de nascimento, 4 \u00faltimos d\u00edgitos).","3":"Autenticou pelo caminho certo, explicando o porqu\u00ea em uma frase, sem atrito, e confirmou 'verified' antes de qualquer dado da conta."}},{"id":"recording","label":"Aviso de grava\u00e7\u00e3o (callback/outbound)","weight":1.5,"critical":true,"bands":{"0":"Em callback/outbound, n\u00e3o avisou que a liga\u00e7\u00e3o \u00e9 gravada para treinamento e qualidade.","1":"Avisou, mas n\u00e3o perguntou se est\u00e1 tudo bem.","2":"Avisou e pediu permiss\u00e3o.","3":"Avisou, pediu permiss\u00e3o, e ofereceu parar a grava\u00e7\u00e3o caso o cliente n\u00e3o queira. (Se n\u00e3o for callback/outbound: pontua\u00e7\u00e3o m\u00e1xima autom\u00e1tica.)"}},{"id":"empathy","label":"Empatia espec\u00edfica","weight":1.5,"bands":{"0":"Sem reconhecimento, ou gen\u00e9rico ('I understand how you feel').","1":"Reconhece a emo\u00e7\u00e3o, n\u00e3o o fato.","2":"Reconhece o fato espec\u00edfico que o cliente contou.","3":"Reconhece o fato espec\u00edfico E um detalhe que prova escuta (hora, crian\u00e7a, terceiro contato)."}},{"id":"paraphrase","label":"Par\u00e1frase do problema","weight":1,"bands":{"0":"N\u00e3o reformulou o problema com as pr\u00f3prias palavras.","1":"Repetiu literalmente ou de forma vaga.","2":"Reformulou o problema com precis\u00e3o.","3":"Reformulou com precis\u00e3o E perguntou se faltou algo ('Is that everything?')."}},{"id":"ownership","label":"Posse sem confiss\u00e3o de responsabilidade","weight":1.5,"bands":{"0":"Transfere culpa ('not my department') OU admite responsabilidade da empresa antes de apurar.","1":"Assume ajudar, de forma vaga.","2":"Diz o que VAI fazer, com verbo concreto.","3":"Diz o que vai fazer, quando, e como o cliente vai saber \u2014 sem prometer o resultado da an\u00e1lise."}},{"id":"policy","label":"Precis\u00e3o de pol\u00edtica","weight":2,"bands":{"0":"Pol\u00edtica errada ou n\u00famero errado (ex.: 72h do check-in).","1":"Pol\u00edtica certa, incompleta.","2":"Pol\u00edtica certa, n\u00famero certo, fator relevante (72h da descoberta, parte afetada, evid\u00eancia).","3":"Pol\u00edtica certa em ingl\u00eas simples COM o motivo da regra, diferenciando o que se aplica do que n\u00e3o se aplica."}},{"id":"structure","label":"Estrutura e clareza","weight":1,"bands":{"0":"Sem estrutura; cliente sai sem pr\u00f3ximo passo.","1":"Pr\u00f3ximo passo enterrado.","2":"Fases vis\u00edveis na ordem certa.","3":"Fases vis\u00edveis, uma ideia por frase, ritmo ajustado ao estado do cliente."}},{"id":"language","label":"Ingl\u00eas natural e acolhedor","weight":1,"bands":{"0":"Erros que mudam o sentido, ou registro errado.","1":"Compreens\u00edvel, com marcas de tradu\u00e7\u00e3o literal ('since now', 'definitively').","2":"Natural, com contra\u00e7\u00f5es e ritmo de fala.","3":"Natural, caloroso, adaptado ao cliente (curto no p\u00e2nico, lento com idoso, simples na barreira de idioma)."}},{"id":"retention","label":"Julgamento comercial e personaliza\u00e7\u00e3o (CSAT)","weight":1.5,"bands":{"0":"Paga a um cliente claramente errado para evitar conflito, OU d\u00e1 uma negativa seca a cliente de alto valor sem gesto nem caminho.","1":"Aplica a pol\u00edtica sem olhar quem \u00e9 o cliente.","2":"Usa o nome e os detalhes do caso; oferece o m\u00e1ximo que a pol\u00edtica permite; imparcial.","3":"Tudo isso E, num caso lim\u00edtrofe com cliente de alto valor (guest ou host), usa um gesto de boa vontade claramente separado da decis\u00e3o \u2014 sem jamais pagar o que \u00e9 injusto."}},{"id":"summary","label":"Sumariza\u00e7\u00e3o final do caso","weight":2,"critical":true,"bands":{"0":"Encerrou sem resumir o que foi tratado.","1":"Resumo parcial ou s\u00f3 o pr\u00f3ximo passo.","2":"Resumiu problema, o que foi feito e o pr\u00f3ximo passo.","3":"Resumiu tudo em ordem, com prazos e refer\u00eancia, e disse que vai por escrito no app."}},{"id":"closing","label":"Confirma\u00e7\u00e3o e fechamento","weight":1,"bands":{"0":"N\u00e3o perguntou se entendeu nem se precisa de mais algo.","1":"Uma das duas perguntas.","2":"Perguntou se os passos ficaram claros E se precisa de mais alguma coisa, antes de dizer que vai fechar o caso.","3":"Tudo isso, na ordem certa (resumo \u2192 passos claros? \u2192 mais ajuda? \u2192 'vou fechar o caso'), com tom humano."}}],"critical_failures":[{"id":"auth_missing","label":"N\u00e3o autenticou o cliente","when":"Qualquer chamada, antes de dar informa\u00e7\u00e3o da conta ou tomar a\u00e7\u00e3o","consequence":"Reprova\u00e7\u00e3o. Na opera\u00e7\u00e3o real, motivo de desligamento."},{"id":"recording_missing","label":"Callback sem aviso de grava\u00e7\u00e3o","when":"Toda liga\u00e7\u00e3o que voc\u00ea inicia (callback / outbound)","consequence":"Reprova\u00e7\u00e3o. O time de qualidade ouve a chamada."},{"id":"summary_missing","label":"Fechou sem sumarizar","when":"Antes de perguntar se entendeu e se precisa de mais ajuda","consequence":"Reprova\u00e7\u00e3o."},{"id":"sensitive_data","label":"Pediu senha, cart\u00e3o completo ou CVV","when":"Nunca. Os 4 \u00faltimos d\u00edgitos s\u00e3o permitidos e exigidos na autentica\u00e7\u00e3o manual.","consequence":"Reprova\u00e7\u00e3o e incidente de seguran\u00e7a."},{"id":"hold_abuse","label":"Mais de 2 holds, ou hold acima de 3 minutos, ou sem permiss\u00e3o","when":"Regra: at\u00e9 2 holds seguidos de 3 minutos cada, sempre com permiss\u00e3o; ou transferir para o chat se o cliente permitir.","consequence":"Penalidade forte."}],"red_flags":[{"id":"liability","pattern":"admite culpa da empresa antes de apurar ('we damaged', 'our mistake')","penalty":"\u22122 em ownership"},{"id":"promise","pattern":"promete resultado de an\u00e1lise ('you'll definitely get', 'I guarantee')","penalty":"\u22122 em ownership"},{"id":"calm_down","pattern":"'calm down', 'relax', 'no need to shout'","penalty":"\u22122 em empathy"},{"id":"unfortunately_opener","pattern":"come\u00e7a a m\u00e1 not\u00edcia com 'unfortunately' ou 'as per policy'","penalty":"\u22121 em language"},{"id":"blame","pattern":"trata a vers\u00e3o de uma parte como fato contra a outra","penalty":"\u22122 em policy"},{"id":"72h_wrong","pattern":"72 horas contadas do check-in ou da reserva","penalty":"\u22123 em policy"},{"id":"jargon","pattern":"siglas/termos internos sem explicar","penalty":"\u22121 em language"},{"id":"pay_unfair","pattern":"aprova dinheiro a cliente claramente errado ou injusto s\u00f3 para encerrar","penalty":"\u22123 em retention"},{"id":"lose_customer","pattern":"negativa seca a cliente de alto valor, sem gesto dentro da pol\u00edtica nem caminho","penalty":"\u22122 em retention"},{"id":"sensitive_data","pattern":"pede senha, n\u00famero completo do cart\u00e3o, CVV ou c\u00f3digo de seguran\u00e7a","penalty":"falha cr\u00edtica"},{"id":"hold_no_permission","pattern":"coloca em espera sem pedir permiss\u00e3o e dizer o tempo","penalty":"\u22122 em structure"}],"scoring":{"max":24,"critical_cap":8,"bands":[{"min":21,"label":"Pronto para a linha","tone":"good"},{"min":15,"label":"S\u00f3lido \u2014 ajustar detalhes","tone":"good"},{"min":9,"label":"Funciona, mas fr\u00e1gil sob press\u00e3o","tone":"warn"},{"min":0,"label":"Refazer com o modelo ao lado","tone":"crit"}],"critical_band":{"label":"FALHA CR\u00cdTICA \u2014 reprova\u00e7\u00e3o","tone":"crit"}},"feedback_format":"Sempre: (1) uma frase do que ficou BOM, espec\u00edfica; (2) o maior problema, com a frase exata do agente e a vers\u00e3o corrigida; (3) uma reescrita completa em ingl\u00eas natural; (4) at\u00e9 3 corre\u00e7\u00f5es de ingl\u00eas (erro \u2192 corre\u00e7\u00e3o \u2192 por qu\u00ea), priorizando falsos amigos e tradu\u00e7\u00e3o literal; (5) nota por dimens\u00e3o; (6) se houver falha cr\u00edtica, dizer em uma frase por que isso demite."}</script>
<script type="application/json" id="d-drills">{"_about":"Drills de escuta. O app fala o texto na voz/sotaque indicado; o aluno transcreve; o app compara palavra a palavra. 'lexicon' = as palavras-alvo que precisam ser reconhecidas. difficulty 1\u20133 (velocidade e densidade).","accents":{"en-US":{"label":"American","flag":"\ud83c\uddfa\ud83c\uddf8","code":"US"},"en-GB":{"label":"British","flag":"\ud83c\uddec\ud83c\udde7","code":"GB"},"en-AU":{"label":"Australian","flag":"\ud83c\udde6\ud83c\uddfa","code":"AU"},"en-IN":{"label":"Indian","flag":"\ud83c\uddee\ud83c\uddf3","code":"IN"},"en-IE":{"label":"Irish","flag":"\ud83c\uddee\ud83c\uddea","code":"IE"},"en-ZA":{"label":"South African","flag":"\ud83c\uddff\ud83c\udde6","code":"ZA"},"en-NG":{"label":"Nigerian","flag":"\ud83c\uddf3\ud83c\uddec","code":"NG"}},"drills":[{"id":"d01","accent":"en-GB","difficulty":1,"text":"The tap in the bathroom won't stop dripping, and the boiler's making a banging noise.","lexicon":["tap","dripping","boiler"]},{"id":"d02","accent":"en-US","difficulty":1,"text":"The faucet is leaking under the sink and there's water pooling on the floor.","lexicon":["faucet","leaking","pooling"]},{"id":"d03","accent":"en-IN","difficulty":2,"text":"We found droppings inside the kitchen cupboards this morning, and there is a very strong odour coming from the drain.","lexicon":["droppings","cupboards","odour","drain"]},{"id":"d04","accent":"en-AU","difficulty":2,"text":"Mate, the lockbox code the host sent doesn't work, and it's half past eleven at night with the kids in the car.","lexicon":["lockbox","code","half past eleven"]},{"id":"d05","accent":"en-IE","difficulty":2,"text":"The whole flat smells musty, there's black mould on the bathroom ceiling, and the extractor fan doesn't work at all.","lexicon":["musty","mould","extractor fan"]},{"id":"d06","accent":"en-ZA","difficulty":2,"text":"The listing said there was a cot, but there's no cot, and the sofa bed is completely broken.","lexicon":["cot","sofa bed"]},{"id":"d07","accent":"en-GB","difficulty":3,"text":"I reported it to the host straight away, he said he'd send someone round, nobody came, and now it's been three days with no hot water and the radiators stone cold.","lexicon":["straight away","send someone round","radiators","stone cold"]},{"id":"d08","accent":"en-US","difficulty":2,"text":"We woke up covered in bites and I'm pretty sure it's bed bugs \u2014 I've got photos of the mattress seams.","lexicon":["bites","bed bugs","mattress seams"]},{"id":"d09","accent":"en-IN","difficulty":3,"text":"The AC unit is only blowing warm air, the water pressure in the shower is very low, and the intercom downstairs is not responding to anyone.","lexicon":["AC unit","water pressure","intercom"]},{"id":"d10","accent":"en-NG","difficulty":2,"text":"The host cancelled on us two days before check-in, and now everything nearby is double the price.","lexicon":["cancelled","two days before","double the price"]},{"id":"d11","accent":"en-AU","difficulty":3,"text":"Look, I'm not trying to be difficult, but the place was filthy \u2014 sticky worktops, hair in the plughole, and the bins hadn't been emptied.","lexicon":["filthy","worktops","plughole","bins"]},{"id":"d12","accent":"en-GB","difficulty":2,"text":"There's a wasp nest right above the front door and my daughter is allergic.","lexicon":["wasp nest","allergic"]},{"id":"d13","accent":"en-US","difficulty":3,"text":"I'm a host, and the guest left the place trashed \u2014 a cracked countertop, a dented fridge door, and cigarette smell in every room.","lexicon":["trashed","cracked","countertop","dented"]},{"id":"d14","accent":"en-IE","difficulty":3,"text":"The directions were wrong altogether \u2014 it sent us to the wrong side of the estate, and the buzzer for number twelve does nothing.","lexicon":["directions","estate","buzzer"]},{"id":"d15","accent":"en-ZA","difficulty":3,"text":"The geyser burst in the night and the whole passage is flooded; we've had to move to a guest house.","lexicon":["geyser","burst","passage","flooded"],"note":"South African: 'geyser' = water heater; 'passage' = hallway"},{"id":"d16","accent":"en-IN","difficulty":2,"text":"Kindly note that we have raised the request already; the amount is showing as pending only.","lexicon":["kindly","raised the request","pending only"],"note":"Indian English: 'kindly', 'raised', 'only' como \u00eanfase"},{"id":"d17","accent":"en-GB","difficulty":3,"text":"The tumble dryer's knackered, the hob's only got one ring working, and the cooker hood's hanging off the wall.","lexicon":["tumble dryer","knackered","hob","ring","cooker hood"],"note":"'knackered' = broken/exhausted (informal UK)"},{"id":"d18","accent":"en-US","difficulty":1,"text":"The trash wasn't taken out and there are roaches in the pantry.","lexicon":["trash","roaches","pantry"]},{"id":"d19","accent":"en-AU","difficulty":2,"text":"The ute's blocking the driveway and the host reckons it's not his problem.","lexicon":["ute","driveway","reckons"],"note":"'ute' = pickup truck; 'reckons' = thinks"},{"id":"d20","accent":"en-NG","difficulty":3,"text":"I have been calling since morning, nobody is picking, and the light has gone off in the whole compound.","lexicon":["picking","light has gone off","compound"],"note":"Nigerian English: 'picking' = answering; 'light' = electricity"},{"id":"d21","accent":"en-IE","difficulty":2,"text":"The immersion's not working so there's no hot water, and the place is freezing.","lexicon":["immersion","freezing"],"note":"Irish/UK: 'immersion' = electric water heater"},{"id":"d22","accent":"en-GB","difficulty":2,"text":"I'd like to dispute the decision \u2014 I've got an itemised receipt and a quote from the plumber.","lexicon":["dispute","itemised receipt","quote"]},{"id":"d23","accent":"en-US","difficulty":2,"text":"Are you going to reimburse me for the hotel? I'm out of pocket four hundred dollars.","lexicon":["reimburse","out of pocket"]},{"id":"d24","accent":"en-ZA","difficulty":2,"text":"The robot at the corner is out, so it's chaos, and we've been sitting in traffic for an hour.","lexicon":["robot","chaos"],"note":"South African: 'robot' = traffic light"},{"id":"d25","accent":"en-IN","difficulty":3,"text":"The flat is on the second floor but there is no lift, and my mother cannot climb; the listing did not mention this anywhere.","lexicon":["second floor","lift","did not mention"]},{"id":"d26","accent":"en-AU","difficulty":3,"text":"The smoke alarm's been chirping all night, there's exposed wiring by the kettle, and honestly it doesn't feel safe.","lexicon":["smoke alarm","chirping","exposed wiring"]},{"id":"d27","accent":"en-GB","difficulty":3,"text":"We've had no reply from the host since yesterday afternoon, the check-in was meant to be four o'clock, and it's now gone nine.","lexicon":["no reply","meant to be","gone nine"]},{"id":"d28","accent":"en-US","difficulty":3,"text":"I'm gonna be honest with you, I already filed a chargeback with my bank, so I just need to know where this stands.","lexicon":["chargeback","where this stands"]},{"id":"d29","accent":"en-NG","difficulty":2,"text":"The gate man said he was not informed about any guest, so we could not enter.","lexicon":["gate man","not informed","could not enter"]},{"id":"d30","accent":"en-IE","difficulty":3,"text":"Grand, so \u2014 if you can just send that in writing, I'll leave it with you, but I do need to hear back by tomorrow.","lexicon":["grand","in writing","leave it with you","hear back"]}]}</script>

<script type="application/json" id="d-ops">{"_about":"Regras OPERACIONAIS da linha (TP \u00b7 Airbnb Elevated Support), informadas pelo Daniel em 2026-09-11. N\u00c3O v\u00eam do Help Center \u2014 v\u00eam da opera\u00e7\u00e3o. Tr\u00eas delas s\u00e3o motivo de desligamento se o time de qualidade ouvir a chamada e elas faltarem.","source":"Instru\u00e7\u00f5es operacionais (Daniel, 2026-09-11)","critical":[{"id":"auth","title":"Autentica\u00e7\u00e3o \u2014 antes de qualquer informa\u00e7\u00e3o ou a\u00e7\u00e3o na conta","rule":"Toda chamada come\u00e7a por autenticar. Existem tr\u00eas caminhos, e o certo depende de como a chamada chega:","paths":[{"id":"alura","label":"J\u00e1 autenticado pela Alura","how":"O sistema j\u00e1 verificou. Voc\u00ea pede apenas nome e sobrenome e confirma com o que est\u00e1 na tela.","say":"Could I have your first and last name, please? \u2026 Thank you, that matches."},{"id":"pin","label":"Pr\u00e9-autenticado (conta identificada, n\u00e3o verificada)","how":"Voc\u00ea envia um PIN para o n\u00famero verificado na plataforma e pede para o cliente ler de volta.","say":"I'm sending a PIN to the phone number ending in 4471 \u2014 could you read it back to me when it arrives?"},{"id":"manual","label":"Autentica\u00e7\u00e3o manual","how":"Quando o cliente n\u00e3o liga do n\u00famero verificado, ou o PIN n\u00e3o \u00e9 poss\u00edvel. Voc\u00ea pede: nome completo, n\u00famero de telefone, data de nascimento, e os QUATRO \u00daLTIMOS d\u00edgitos do m\u00e9todo de pagamento.","say":"As you're not calling from the number on file, I'll need to verify the account with a few details: your full name, the phone number on the account, your date of birth, and the last four digits of the payment method."}],"never":"Nunca pedir senha, n\u00famero completo do cart\u00e3o, CVV ou c\u00f3digo de seguran\u00e7a. Os 4 \u00faltimos d\u00edgitos s\u00e3o permitidos \u2014 e exigidos \u2014 no caminho manual.","if_fails":"Se n\u00e3o conseguir autenticar, n\u00e3o d\u00ea nenhuma informa\u00e7\u00e3o espec\u00edfica da conta. Ofere\u00e7a: mensagem pelo app, ou que o cliente ligue de volta do n\u00famero verificado.","consequence":"N\u00e3o autenticar = falha grave; motivo de desligamento."},{"id":"recording","title":"Aviso de grava\u00e7\u00e3o em callback","rule":"Sempre que VOC\u00ca liga (callback ou qualquer outbound), diga que a liga\u00e7\u00e3o est\u00e1 sendo gravada para fins de treinamento e qualidade e pergunte se est\u00e1 tudo bem. Se o cliente n\u00e3o permitir, voc\u00ea pode parar a grava\u00e7\u00e3o. Se permitir, continua.","say":"Before we start: this call is being recorded for training and quality purposes \u2014 is that okay with you? \u2026 If you'd rather it wasn't, I can stop the recording now.","consequence":"Esquecer isso numa chamada que o time de qualidade ouve = desligamento."},{"id":"summary","title":"Sumariza\u00e7\u00e3o antes de fechar","rule":"Ao final do caso \u2014 chat ou liga\u00e7\u00e3o \u2014 voc\u00ea resume TUDO o que foi tratado. S\u00f3 depois pergunta se o cliente entendeu os passos, se precisa de mais ajuda, e ent\u00e3o diz que vai fechar o caso.","sequence":["1. Resumir tudo o que foi tratado (problema \u2192 o que foi feito \u2192 pr\u00f3ximos passos e prazos \u2192 refer\u00eancia)","2. Perguntar se os passos ficaram claros","3. Perguntar se precisa de mais alguma coisa","4. Dizer que vai fechar o caso; confirmar que o resumo vai por escrito no app"],"say":"Before we finish, let me go over everything we covered today\u2026 Have I explained those steps clearly? \u2026 Is there anything else I can help you with? \u2026 Then I'll go ahead and close this case \u2014 you'll have all of this in writing in the app.","consequence":"Esquecer = desligamento."}],"rules":[{"id":"paraphrase","title":"Parafrasear o problema","rule":"Depois que o cliente exp\u00f5e o problema, reformule com as suas palavras e pergunte se faltou algo. \u00c9 o que prova escuta e evita resolver o caso errado.","say":"So, just to make sure I've got this right: \u2026 Is that everything?"},{"id":"holds","title":"Holds","rule":"At\u00e9 2 holds seguidos, de 3 minutos cada. Sempre pedir permiss\u00e3o e dizer o tempo. Ao voltar, retomar com conte\u00fado, n\u00e3o com desculpa.","say":"May I place you on a brief hold, for up to three minutes, while I check this? \u2026 Thanks for holding \u2014 here's what I found."},{"id":"chat","title":"Transferir para o chat","rule":"Se precisar pesquisar mais do que os holds permitem, ofere\u00e7a continuar pelo chat \u2014 s\u00f3 com permiss\u00e3o do cliente \u2014 e siga o atendimento por l\u00e1.","say":"Would you be happy to continue this over chat? I can keep researching on my side and you won't have to wait on the line."},{"id":"impartial","title":"Imparcial \u2014 com inclina\u00e7\u00e3o ao guest, sem pagar injusti\u00e7a","rule":"O Elevated Support \u00e9 imparcial, mas mais voltado para o guest. Voc\u00ea n\u00e3o d\u00e1 dinheiro a um guest que est\u00e1 claramente errado ou fez algo injusto. Mas os clientes dessa linha gastam mais de US$ 1.000 na plataforma e n\u00e3o podem ser perdidos \u2014 e h\u00e1 hosts excelentes que tamb\u00e9m n\u00e3o queremos perder. Nos casos lim\u00edtrofes, o gesto de boa vontade (separado da decis\u00e3o) \u00e9 a ferramenta.","say":"Separately from the decision, I'd like to offer a credit as a goodwill gesture \u2014 it doesn't change the outcome, but I'd like you to have it."},{"id":"csat","title":"CSAT m\u00e1ximo","rule":"Educa\u00e7\u00e3o, atendimento especializado e PERSONALIZADO para cada cliente \u2014 nome, detalhes do caso, ritmo do cliente. O objetivo \u00e9 o cliente sair satisfeito e avaliar voc\u00ea e, principalmente, o Airbnb com a nota m\u00e1xima."},{"id":"callback","title":"Callbacks","rule":"Alguns clientes pedem retorno. Toda liga\u00e7\u00e3o de retorno \u00e9 outbound: aviso de grava\u00e7\u00e3o + confirmar com quem est\u00e1 falando + refer\u00eancia do caso."}]}</script>

  try { D[k] = JSON.parse(document.getElementById("d-"+k).textContent); } catch(e) { D[k] = null; console.error("data",k,e); }

const DOT = "\u00b7", ELL = "\u2026", DASH = "\u2014", STAR = "\u2605", OK = "\u2713", NO = "\u2717";

/* ---------------------------------------------------------------
   STORE (localStorage only)
---------------------------------------------------------------- */
const Store = {
  get(k,d){ try{ const v=localStorage.getItem("el."+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("el."+k, JSON.stringify(v)); }catch(e){} },
};
const S = {
  settings: Object.assign({agentName:"Agent", accent:"en-GB", rate:0.92, typedOnly:false, mode:"offline", depth:"quick", voiceMap:{}}, Store.get("settings",{})),
  progress: Store.get("progress",{}),
  drills:   Store.get("drills",{}),

};
const save = ()=>{ Store.set("settings",S.settings); Store.set("progress",S.progress); Store.set("drills",S.drills); Store.set("custom",S.custom); Store.set("recent",S.recent); };
const NAME = ()=> S.settings.agentName || "Agent";
const fill = t => (t||"").replace(/\{name\}/g, NAME());

/* ---------------------------------------------------------------
   VOICE -- TTS with quality-ranked voice choice, per-accent override,
   sentence chunking (Android cuts long utterances), natural rate.
---------------------------------------------------------------- */
const Voice = {
  voices: [], queue:[], speaking:false,
  refresh(){ try{ this.voices = (speechSynthesis.getVoices()||[]).filter(v=>/^en([-_]|$)/i.test(v.lang||"")); }catch(e){ this.voices=[]; } },
  score(v, lang){
    const n=(v.name||"")+" "+(v.voiceURI||""); let s=0;

    if(/google/i.test(n)) s+=5;
    if(/natural|neural|premium|enhanced|wavenet|journey|studio/i.test(n)) s+=4;
    if(/espeak|compact|klatt|eloquence|festival|pico|svox/i.test(n)) s-=8;
    if(v.localService) s+=1;
    return s;
  },
  pick(lang){
    const L=this.voices; if(!L.length) return null;
    const uri=S.settings.voiceMap[lang]; if(uri){ const v=L.find(x=>x.voiceURI===uri); if(v) return v; }
    return [...L].sort((a,b)=>this.score(b,lang)-this.score(a,lang))[0];
  },
  chunks(text){ return String(text).replace(/\s+/g," ").match(/[^.!?]+[.!?]+["')\]]?|[^.!?]+$/g) || [String(text)]; },
  speak(text, lang, rate){
    this.stop();
    const v=this.pick(lang||S.settings.accent); const r=rate||S.settings.rate||0.92;
    const parts=this.chunks(text); let done=0;
    return new Promise(res=>{
      const next=()=>{ if(done>=parts.length){ this.speaking=false; return res(true); }
        const u=new SpeechSynthesisUtterance(parts[done++].trim());
        if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=lang||"en-GB"; }
        u.rate=r; u.pitch=1; u.volume=1;
        u.onend=next; u.onerror=()=>{ this.speaking=false; res(false); };
        this.speaking=true; try{ speechSynthesis.speak(u); }catch(e){ res(false); } };
      next();
    });
  },
  stop(){ this.speaking=false; try{ speechSynthesis.cancel(); }catch(e){} },
  voiceNote(lang){
    const v=this.pick(lang); if(!v) return "No English voice installed";
    const vl=(v.lang||"").replace("_","-").toLowerCase();
    return (vl===lang.toLowerCase()?"":"No "+accLabel(lang)+" voice "+DASH+" using ")+v.name;
  }
};

  supported: !!SR, rec:null,
  start(onInterim){
    return new Promise((res,rej)=>{
      if(!SR) return rej({code:"unsupported"});
      const r=new SR(); this.rec=r; r.lang="en-US"; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
      let final="";
      r.onresult=e=>{ let interim=""; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) final+=t+" "; else interim+=t; } onInterim&&onInterim((final+interim).trim()); };
      r.onerror=e=>{ this.rec=null; rej({code:e.error||"error"}); };
      r.onend=()=>{ this.rec=null; res(final.trim()); };
      try{ r.start(); }catch(e){ rej({code:"start-failed"}); }
    });
  },
  stop(){ try{ this.rec&&this.rec.stop(); }catch(e){} }
};

const RX = {

  auth:/\b(first and last name|full name|verify (the|your) account|confirm (the|your) account|send(ing)? (you )?a pin|read it back|date of birth|last four|that matches|you('re| are) verified|verified)\b/i,
  recording:/\b(recorded for (training|quality)|being recorded|record(ing)? (this|the) call|stop the recording)\b/i,
  listen:/.+/,
  paraphrase:/\b(just to (make sure|confirm|check) (i|i've|i have)|so,? (to recap|if i('ve| have) (got|understood))|let me (say|play) (that|it) back|is that (everything|right|correct)|have i missed anything|if i('ve| have) understood)\b/i,
  empathy:/\b(sorry (you|that|to hear|about)|that sounds|not how anyone|i can (see|hear|imagine)|awful|stressful|rotten|miserable|genuinely|understand (the|that|why|how much)|you('re| are) right to|no one should|shouldn't have to|i'm glad you (called|got in touch))\b/i,
  clarify:/\?/,
  policy:/\b(72|seventy.two|hours|covered|policy|access failure|uninhabitable|not as (listed|advertised)|as advertised|strict|moderate|flexible|firm|limited|refund|rebook|aircover|resolution cent|wear and tear|14 days|30 days|15 days|non.?refundable|penalt|dispute|extenuating|reasonably clean|house rule)\b/i,
  options:/\b(two (options|paths|things|ways)|either|here('s| is) (what|how)|what i can do|i can (look|start|help|approve|arrange)|rebook|refund|next step|i('ll| will) (message|send|attach|note|process|put))\b/i,
  summary:/\b(before we (finish|wrap up|close)|let me (go over|summari[sz]e|recap)|to (summari[sz]e|sum up|recap)|so today|what we('ve| have) (covered|done|agreed)|everything we covered)\b/i,
  confirm:/\b(explained (the|those|these) steps|does that (all )?make sense|is there anything else (i can|you need|you'd like)|anything else i can help)\b/i,
  close:/\b(close (this|the) case|go ahead and close|closing (this|the) case|i('ll| will) close)\b/i,
  ownership:/\b(i('m| am) going to|i will|i'll|let me|i can|from here|i('m| am) your|right now|starting now|on my side|i('ve| have) (noted|attached|sent|processed))\b/i,
  expectations:/\b(within (the )?(hour|\d+|a|two|twenty|thirty)|by (tomorrow|tonight|this evening|four|six|\d)|in (about )?(\d+|two|ten|twenty|thirty) minutes|a day or two|15 days|today|couple of days)\b/i,
  future:/\b(reference|case (number|\d)|message (me|the case|through the app)|in writing|summary|call (you )?(back|straight back))\b/i,
  chat_transfer:/\b(continue (this |it )?(over|by|on|via) chat|move (this|you|it) to chat|happy to continue (this )?(over|on) chat)\b/i,
};
const FLAG = {
  liability:/\b(we (damaged|broke|failed|messed up|screwed)|our (mistake|fault)|we('re| are) (at fault|to blame)|i'?m sorry (that )?we)\b/i,
  promise:/\b(definitely|guarantee|i promise you('ll| will) (get|receive)|you will (get|receive) a full|100% refund)\b/i,
  calm_down:/\b(calm down|relax|no need to (shout|yell)|don'?t (cry|be upset))\b/i,
  unfortunately_opener:/(^\s*unfortunately|as per (our )?(policy|terms))/i,
  "72h_wrong":/72 hours? (from|after|of) (the )?(check.?in|booking|reservation)/i,
  blame:/\b(the (host|guest) is lying|the (host|guest) (damaged|broke)|(host|guest)'?s fault)\b/i,
  sensitive_data:/\b(password|full card|whole card|card number|cvv|security code|verification code)\b/i,
  pay_unfair:/\b(just (give|refund) (it|them|him|her)|refund (everything|it all) to (make|keep)|i'll approve it to (avoid|end))\b/i,
};
const PHASE_DIM = {opening:"structure",auth:"auth",recording:"recording",listen:null,paraphrase:"paraphrase",empathy:"empathy",clarify:"structure",policy:"policy",options:"ownership",summary:"summary",confirm:"closing",close:"closing",ownership:"ownership",expectations:"ownership",future:"closing"};
function offlineGrade(scn, turn, text){
  const exp=turn.expects||[]; const hit=[], miss=[];
  for(const p of exp){ (RX[p]||RX.listen).test(text)?hit.push(p):miss.push(p); }
  const flags=Object.keys(FLAG).filter(k=>FLAG[k].test(text));
  const scores={}; for(const d of DIMS) scores[d.id]=null;
  const rel=new Set(["language"]); for(const p of exp){ const dm=PHASE_DIM[p]; if(dm) rel.add(dm); }
  const has=p=>hit.includes(p);
  if(rel.has("auth")) scores.auth=flags.includes("sensitive_data")?0:(has("auth")?2:0);
  if(rel.has("recording")) scores.recording=scn.callback?(has("recording")?2:0):null;
  if(rel.has("paraphrase")) scores.paraphrase=has("paraphrase")?2:0;
  if(rel.has("empathy")) scores.empathy=flags.includes("calm_down")?0:(has("empathy")?2:0);
  if(rel.has("ownership")) scores.ownership=(flags.includes("liability")||flags.includes("promise"))?0:(RX.ownership.test(text)?2:0);
  if(rel.has("policy")) scores.policy=(flags.includes("72h_wrong")||flags.includes("blame"))?0:(has("policy")?2:0);
  if(rel.has("structure")) scores.structure=Math.min(3,Math.round((exp.length?hit.length/exp.length:1)*3));
  if(rel.has("summary")) scores.summary=has("summary")?2:0;
  if(rel.has("closing")) scores.closing=(has("confirm")?1:0)+(has("close")?1:0)+(RX.future.test(text)?1:0);
  scores.language=flags.includes("unfortunately_opener")?1:2;
  if(rel.has("policy")||rel.has("ownership")) scores.retention=flags.includes("pay_unfair")?0:(/\b(goodwill|you've been with us|your history)\b/i.test(text)||new RegExp("\\b"+scn.caller.name.split(" ")[0]+"\\b","i").test(text)?2:1);
  const critical=[];
  if(exp.includes("auth")&&(!has("auth")||flags.includes("sensitive_data"))) critical.push(flags.includes("sensitive_data")?"sensitive_data":"auth_missing");
  if(exp.includes("recording")&&scn.callback&&!has("recording")) critical.push("recording_missing");
  if(exp.includes("summary")&&!has("summary")) critical.push("summary_missing");
  let total=weightedTotal(scores); if(critical.length) total=Math.min(total,D.rubric.scoring.critical_cap);
  return {offline:true,total,scores,phases_hit:hit,phases_missed:miss,flags,critical,customer_reaction:(critical.length||total<9)?"weak":(total>=15?"good":"ok")};
}
function weightedTotal(scores){ let t=0,w=0; for(const d of DIMS){ const s=scores?scores[d.id]:null; if(s===null||s===undefined) continue; t+=s*d.weight; w+=3*d.weight; } return w?Math.round(t/w*24):0; }
function bandFor(total,critical){ if(critical&&critical.length) return D.rubric.scoring.critical_band; return D.rubric.scoring.bands.find(x=>total>=x.min)||D.rubric.scoring.bands[D.rubric.scoring.bands.length-1]; }

function diffWords(ref,got){

  while(i<m){ html+='<span class="miss">'+esc(a[i++])+'</span>'; } while(j<n){ html+='<span class="extra">'+esc(b[j++])+'</span>'; }
  return {html,pct:m?Math.round(ok/m*100):0};
}

/* ---------------------------------------------------------------
   PWA -- installable, opens offline, self-updates when online.
   Only outside the claude.ai viewer (there, window.claude exists and
   service workers are not allowed). BUILD is stamped by build.py.
---------------------------------------------------------------- */
const BUILD = "20260912-1527";
const CLAUDE_URL = "https://claude.ai/code/artifact/025fdbf5-a9fc-41e5-84a3-71aff5161ad2";
const IS_PWA_HOST = ("serviceWorker" in navigator) && /^https?:/.test(location.protocol) && !(window.claude && typeof claude.use==="function");
if (IS_PWA_HOST) {
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("./sw.js");
      const check = ()=>{ try{ reg.update(); }catch(e){} };
      window.addEventListener("online", check); setInterval(check, 30*60*1000);
      reg.addEventListener("updatefound", ()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener("statechange", ()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller){ nw.postMessage({type:"SKIP_WAITING"}); } }); });
      let reloaded=false; navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(reloaded) return; reloaded=true; toast("Updated \u2014 reloading the new version\u2026"); setTimeout(()=>location.reload(), 900); });
    }catch(e){ console.warn("sw", e); }
  });
}
