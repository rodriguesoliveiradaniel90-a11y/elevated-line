<style>
/* ============================================================
   ELEVATED LINE v3 -- training simulator for Airbnb Elevated Support
   Single-file app; content inlined by build.py as pure ASCII JSON.
   This template is ASCII-only on purpose (no charset dependency).
   No API keys anywhere. Online mode uses claude.use("sample") and is
   OFF by default -- the user switches it on from the header.
   ============================================================ */
:root{
  --paper:#F5F4F0; --surface:#FFFFFF; --surface-2:#ECEAE4; --line:#D9D6CE;
  --ink:#171F29; --ink-2:#44505E; --muted:#6B7684;
  --accent:#0E6E66; --accent-ink:#FFFFFF; --accent-soft:#D6ECE8;
  --customer:#B8410E; --customer-soft:#F9E6DC;
  --good:#15803D; --good-soft:#DCFCE7; --warn:#A85A07; --warn-soft:#FDF0D5; --crit:#B42323; --crit-soft:#FBE2E2;
  --shadow:0 1px 2px rgba(23,31,41,.05),0 8px 24px rgba(23,31,41,.06);
  --r:16px; --r-s:10px;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E151D; --surface:#151F2A; --surface-2:#1C2833; --line:#283645;
    --ink:#E8ECF1; --ink-2:#B9C3CE; --muted:#8C9AAA;
    --accent:#34D3BE; --accent-ink:#05201B; --accent-soft:#113D38;
    --customer:#FB9748; --customer-soft:#3A2415;
    --good:#4ADE80; --good-soft:#12321F; --warn:#FBBF24; --warn-soft:#3A2A0A; --crit:#F87171; --crit-soft:#3B1515;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0E151D; --surface:#151F2A; --surface-2:#1C2833; --line:#283645;
  --ink:#E8ECF1; --ink-2:#B9C3CE; --muted:#8C9AAA;
  --accent:#34D3BE; --accent-ink:#05201B; --accent-soft:#113D38;
  --customer:#FB9748; --customer-soft:#3A2415;
  --good:#4ADE80; --good-soft:#12321F; --warn:#FBBF24; --warn-soft:#3A2A0A; --crit:#F87171; --crit-soft:#3B1515;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.mono{font-family:var(--f-mono);font-size:.86rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header .brand{font-family:var(--f-ui);font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px}
header .brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
header .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.active{background:var(--ink);color:var(--paper)}
.seg button.active.on{background:var(--accent);color:var(--accent-ink)}
.seg .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
main{flex:1;padding:16px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:none;border:0;border-radius:var(--r-s);padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--f-ui);font-size:.64rem;font-weight:600;cursor:pointer}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--accent);background:var(--accent-soft)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.card.crit{border-color:var(--crit);background:var(--crit-soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 14px;font-family:var(--f-ui);font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.big{padding:16px 18px;font-size:1rem;border-radius:14px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-family:var(--f-ui);font-size:.72rem;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.code{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--paper)}
select,input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
textarea{min-height:96px;resize:vertical;line-height:1.4}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.small{display:block}
label.small select,label.small input[type=text]{margin-top:4px}

/* incoming call */
.ring{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px 22px;text-align:center}
.ring .orb{width:96px;height:96px;border-radius:50%;background:var(--customer-soft);color:var(--customer);display:grid;place-items:center;position:relative}
.ring .orb svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ring .orb::before,.ring .orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--customer);opacity:0;animation:ripple 1.8s infinite}
.ring .orb::after{animation-delay:.9s}
@keyframes ripple{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring .orb::before,.ring .orb::after{animation:none}}
.ring h1{font-size:1.3rem}
.ring .num{font-family:var(--f-mono);color:var(--muted)}

/* scenario list */
.scn{position:relative;padding-left:18px;cursor:pointer}
.scn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:var(--r) 0 0 var(--r);background:var(--good)}
.scn.s2::before{background:var(--warn)} .scn.s3::before{background:var(--crit)}
.scn h3{font-size:.98rem}
.scn .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* call screen */
.caller{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--customer-soft);color:var(--customer);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:1.1rem;flex:none}
.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 4px;margin-top:12px}
.phases .ph{display:flex;flex-direction:column;gap:4px}
.phases .ph i{display:block;height:5px;border-radius:3px;background:var(--line)}
.phases .ph.hit i{background:var(--accent)}
.phases .ph.exp i{background:var(--accent-soft);outline:1px dashed var(--accent)}
.phases .ph.critmiss i{background:var(--crit)}
.phases .ph span{font-family:var(--f-ui);font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases .ph.crit span{font-weight:700;color:var(--ink-2)}
.locked{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r-s)}
.transcript{display:flex;flex-direction:column;gap:10px;max-height:40vh;overflow:auto;padding:4px 2px}
.bubble{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.4}
.bubble.c{align-self:flex-start;background:var(--customer-soft);border-bottom-left-radius:4px;border-left:3px solid var(--customer)}
.bubble.a{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.bubble.sys{align-self:center;background:var(--surface-2);font-size:.8rem;color:var(--muted);font-family:var(--f-ui)}
.bubble .who{display:block;font-family:var(--f-ui);font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.bubble.c .who{color:var(--customer)} .bubble.a .who{color:var(--accent)}
.talk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.mic{width:66px;height:66px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.mic.live{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s infinite}
.mic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.interim{font-style:italic;color:var(--muted);min-height:1.2em}
.holdbar{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-s);padding:8px 12px;font-family:var(--f-ui);font-weight:600}
.holdbar b{font-variant-numeric:tabular-nums;font-size:1.2rem}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* feedback */
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-ui)}
.score b{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.dims{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.dims .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center}
.dims .bar i{display:block;height:100%;background:var(--accent)}
.dims .na{color:var(--muted);font-style:italic}
.fb h4{font-family:var(--f-ui);font-size:.78rem;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fb blockquote{margin:0;padding:8px 10px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 var(--r-s) var(--r-s) 0}
.fix{display:grid;grid-template-columns:1fr;gap:4px;font-size:.92rem}
.fix .w{color:var(--crit);text-decoration:line-through;text-decoration-thickness:1.5px}
.fix .r{color:var(--good);font-weight:600}
.flag{background:var(--crit-soft);color:var(--crit);border-radius:var(--r-s);padding:8px 10px;font-size:.9rem}
.banner{background:var(--crit);color:#fff;border-radius:var(--r-s);padding:10px 12px;font-family:var(--f-ui);font-weight:700}
details summary{cursor:pointer;font-family:var(--f-ui);font-weight:600;font-size:.9rem;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
.model{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;line-height:1.5}
.lex{display:flex;gap:6px;flex-wrap:wrap}
.lex .chip{font-family:var(--f-mono);font-weight:500;text-transform:none;letter-spacing:0}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.92rem}
.check .ok{color:var(--good);font-weight:700} .check .no{color:var(--crit);font-weight:700} .check .na{color:var(--muted)}

/* drills diff */
.diff span{padding:1px 3px;border-radius:4px;margin-right:2px}
.diff .ok{background:var(--good-soft);color:var(--good)} .diff .miss{background:var(--crit-soft);color:var(--crit)} .diff .extra{color:var(--muted);text-decoration:line-through}

/* phrases / policy */
.line{padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .t{font-size:1rem;line-height:1.45}
.line .why{color:var(--muted);font-size:.86rem;margin-top:4px}
.avoid .t{color:var(--crit)}
.kv{display:grid;grid-template-columns:minmax(84px,30%) 1fr;gap:6px 12px;font-size:.92rem;overflow-wrap:anywhere}
.kv.stack{grid-template-columns:1fr}
.pathcard{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;margin-top:8px}
.pathcard b{font-family:var(--f-ui);display:block;margin-bottom:4px}
.kv b{font-family:var(--f-ui);font-weight:600;color:var(--ink-2)}
ul.tight{margin:6px 0 0 18px;padding:0} ul.tight li{margin:3px 0}
ol.tight{margin:6px 0 0 18px;padding:0} ol.tight li{margin:4px 0}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px;font-family:var(--f-ui);font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer}
.subtabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:var(--r-s);padding:10px}
.stat b{display:block;font-family:var(--f-ui);font-size:1.4rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-family:var(--f-ui);font-size:.82rem;font-weight:600;z-index:9;box-shadow:var(--shadow);max-width:92%}
.hidden{display:none!important}
</style>

<script type="application/json" id="d-scenarios">{"_about":"Biblioteca de cen\u00e1rios offline. Cada turno tem a fala do cliente, o que se espera do agente ('expects' \u2014 chaves da rubrica/fases), a resposta-modelo e o coment\u00e1rio do coach. 'customer_if_weak' \u00e9 a fala alternativa do cliente quando a resposta anterior foi fraca (escalada). {name} \u00e9 substitu\u00eddo pelo nome do agente. Online, o app tamb\u00e9m GERA cen\u00e1rios novos com este mesmo esquema. v2: cada cen\u00e1rio traz 'auth' (caminho e dados fict\u00edcios que o cliente vai dar), 'callback' (exige aviso de grava\u00e7\u00e3o), 'value_tier' (alto valor = n\u00e3o pode ser perdido) e um turno final obrigat\u00f3rio de sumariza\u00e7\u00e3o \u2192 confirma\u00e7\u00e3o \u2192 fechamento.","schema_version":2,"categories":{"access":"Access failure","uninhabitable":"Uninhabitable conditions","mismatch":"Not as advertised","host_cancel":"Host cancellation","guest_cancel":"Guest cancellation","host_damage":"Host damage claim","appeal":"Appeals & disputes","repeat_contact":"Repeat contact"},"call_types":{"inbound_guest":"Inbound \u00b7 guest calls you","outbound_guest":"Outbound \u00b7 you call the guest","outbound_host":"Outbound \u00b7 you call the host","inbound_host":"Inbound \u00b7 host calls you"},"phases":["opening","auth","recording","listen","paraphrase","empathy","clarify","policy","options","summary","confirm","close"],"scenarios":[{"id":"acc-in-01","title":"Lockbox code fails at 11:30 pm","category":"access","callType":"inbound_guest","severity":3,"emotion":"panicked","accent":"en-AU","caller":{"name":"Jess","role":"guest"},"context":{"listing":"2-bed flat, Melbourne CBD","booking":"3 nights, checked in tonight","policy":"Flexible","facts":["self check-in via lockbox","host not answering for 40 min","two children aged 4 and 7 in the car","discovered 40 min ago \u2014 inside 72h"]},"lexicon":["lockbox","code","keypad","self check-in"],"turns":[{"customer":"Hi \u2014 hi, sorry, is this Airbnb? The lockbox code the host sent doesn't work, I've tried it six times, it's half eleven at night and I've got two kids asleep in the car. Nobody's answering. I don't know what to do.","expects":["opening","empathy","auth"],"model":"Yes, you've reached Airbnb Elevated Support, this is {name} \u2014 I'm going to help you with this right now. First: are you and the kids somewhere safe, in the car with the doors locked? Good. Let me just confirm I've got the right booking \u2014 is this the two-bedroom in Melbourne CBD, checking in tonight?","coach":"P\u00e2nico: seguran\u00e7a primeiro, uma instru\u00e7\u00e3o por vez, voz firme. Verifique com dados n\u00e3o sens\u00edveis (cidade, data). N\u00e3o explique pol\u00edtica ainda."},{"customer":"Yes, that's it. What do I do? I can't keep them in the car all night.","customer_if_weak":"Are you even listening? I said I have KIDS in the car. Do something.","expects":["ownership","clarify","options","auth"],"model":"You won't have to. Here's what happens now: I'm going to message and call the host from my side while we talk. If I can't reach them in the next ten minutes, I'll start looking at somewhere comparable nearby for tonight. Can you tell me the exact number you typed, and whether the keypad lights up when you press it? Before we go any further, I need to verify the account: I'm sending a PIN to the phone number ending in 0447 right now \u2014 could you read it back to me when it arrives?","coach":"Dois caminhos concretos com prazo (host em 10 min \u2192 remarca\u00e7\u00e3o). Pergunta t\u00e9cnica curta (keypad acende?) pode resolver na hora."},{"customer":"Okay \u2014 it's just come through. 8 2 9 1 5 3.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: you arrived at half eleven, the lockbox code was rejected six times, and the host hasn't answered in forty minutes \u2014 with the two kids in the car. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"It lights up but just beeps red. I typed 4-4-7-1 like the message says.","expects":["policy","options","expectations"],"model":"Thank you \u2014 that tells me the code itself is being rejected, not the keypad. I've sent the host an urgent message. Because your check-in time has passed and the host isn't responding, this is what we call an access failure, and it's covered: if we can't get you in, we'll rebook you somewhere comparable tonight, or refund the nights you can't use. Give me two minutes on the line while I check availability \u2014 I'm not going anywhere.","coach":"Nomeia a pol\u00edtica em ingl\u00eas simples ('access failure') e o que ela garante. N\u00e3o promete o resultado da an\u00e1lise, promete a a\u00e7\u00e3o de agora."},{"customer":"Okay. Thank you. Sorry, I'm just \u2014 thank you.","expects":["future"],"model":"You don't need to apologise for anything. Your case reference is 4471 \u2014 if we get cut off, message the case in the app and I'll call you straight back on this number. I'm staying with you until you're inside somewhere with the kids.","coach":"N\u00famero do caso, plano para queda de linha, compromisso de continuidade. Nada de 'have a nice night'."},{"customer":"Okay \u2014 yes.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, you couldn't get into the flat because the lockbox code was rejected, and the host wasn't responding. Second, I've messaged and called the host, opened this as an access failure, and started looking at a comparable place for tonight. And third, you'll get options by message within the next few minutes and I'm staying on the case until you're inside somewhere. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 4471. Thank you for your time, Jess.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Rebooking tonight if host unreachable; refund of unusable nights.","policy_ref":"checkin_trouble","why":"Check-in time passed + host unresponsive + inside 72h = access failure."},"auth":{"path":"pin","customer_name":"Jess Carmody","verified_phone_ends":"0447","pin":"829153"},"callback":false,"value_tier":"standard","reference":"4471"},{"id":"acc-in-02","title":"Wrong directions \u2014 sent to the wrong building","category":"access","callType":"inbound_guest","severity":2,"emotion":"frustrated","accent":"en-IE","caller":{"name":"Ciar\u00e1n","role":"guest"},"context":{"listing":"Studio, Porto","booking":"5 nights","policy":"Moderate","facts":["check-in instructions had the wrong street number","host replied after 90 min with correct address","guest arrived 2h late, missed a dinner booking","wants compensation for the dinner"]},"lexicon":["check-in instructions","buzzer","directions","street number"],"turns":[{"customer":"Right, so the check-in instructions sent us to number 12 and it was number 21. The buzzer at 12 did nothing, we stood there like eejits for an hour and a half, and we missed a dinner I'd booked months ago. I'm in now, but honestly.","expects":["opening","empathy","auth"],"model":"I'm sorry \u2014 an hour and a half on the wrong doorstep after a flight is a rotten start, and losing the dinner on top of it. I'm glad you're in now. Let me pull up the booking \u2014 the studio in Porto, five nights? Before we go any further, I just need to confirm the account \u2014 could I have your first and last name, please?","coach":"Empatia espec\u00edfica (hora e meia, jantar). Reconhece que est\u00e1 resolvido o acesso antes de discutir compensa\u00e7\u00e3o."},{"customer":"It's Ciar\u00e1n Doyle.","expects":["auth","paraphrase"],"model":"Thank you, Ciar\u00e1n \u2014 that matches what I have here. So, just to make sure I've got this right: the check-in instructions sent you to number 12 instead of 21, the buzzer did nothing, you lost about an hour and a half and missed a dinner you'd booked. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"That's the one. So what are you going to do about the dinner? That was a hundred and forty euro.","expects":["clarify","policy","options"],"model":"Let me be straight with you about what's covered and what isn't. Wrong instructions that delay your access are something we take seriously, and I'm noting it against the host. The dinner itself isn't something the policy reimburses \u2014 it covers the stay, not costs outside it. What I can look at is the delay to your first night. Do you still have the host's original message with the wrong number?","coach":"Negativa clara sobre o jantar (fora do escopo), sem 'unfortunately'. Abre o caminho que existe (impacto na primeira noite). Pede evid\u00eancia."},{"customer":"I do, yeah. Fine. I just want it noted, to be honest \u2014 I don't want the next person going through that.","customer_if_weak":"So that's a no, is it? Grand. Typical.","expects":["ownership","future"],"model":"It's noted, with the message attached, and the host will hear about the instructions. I'll message you a summary within the hour so you have it in writing. Your reference is 5820 \u2014 if anything else comes up during the week, reply on that thread and it comes straight to me. Enjoy Porto; the second night's usually better than the first.","coach":"Fecha com registro, resumo escrito, n\u00famero do caso, e um toque humano leve \u2014 depois que o problema est\u00e1 resolvido, o humor \u00e9 permitido."},{"customer":"Right.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the check-in instructions had the wrong street number and it cost you an hour and a half and a dinner booking. Second, I've noted the wrong instructions against the host, with the host's original message attached, and I'm looking at the impact on your first night. And third, the dinner itself isn't something the policy reimburses, and I'll send you a written summary within the hour. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 5820. Thank you for your time, Ciar\u00e1n.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Note against host; possible partial for first-night impact; no reimbursement for external dinner cost.","policy_ref":"rebooking_refund","why":"Policy covers the stay, not third-party costs."},"auth":{"path":"alura","customer_name":"Ciar\u00e1n Doyle"},"callback":false,"value_tier":"standard","reference":"5820"},{"id":"acc-out-01","title":"Calling the host about the failed lockbox","category":"access","callType":"outbound_host","severity":3,"emotion":"host_defensive","accent":"en-GB","caller":{"name":"Marco","role":"host"},"context":{"listing":"2-bed flat, Melbourne CBD","booking":"guest Jess, 3 nights","facts":["guest could not get in until 01:10","host's phone was off overnight","host says the code 'always works'","payout for night 1 will be affected"]},"lexicon":["lockbox","access failure","payout","dispute"],"turns":[{"customer":"Yeah, hello? Airbnb? Look, I saw the messages. That code has worked for two hundred guests. I don't know what she was pressing.","expects":["opening","auth","listen","recording"],"model":"Hi Marco, this is {name} from Airbnb's Elevated Support team \u2014 I'm calling about last night's check-in for the reservation with Jess. I've read the messages, and I'm calling because I want your side of it on the record before anything is decided. Can you walk me through how the code is set up and when it was last changed? Before we go on, two quick things: this call is being recorded for training and quality purposes \u2014 is that okay with you? And just to confirm I'm speaking with the right person, could I have your first and last name?","coach":"Apresenta\u00e7\u00e3o completa em outbound. Enquadra como 'ouvir o seu lado'. Pergunta aberta e factual \u2014 n\u00e3o 'the guest says you\u2026'."},{"customer":"Yeah, that's fine. It's Marco Bellini.","expects":["auth","paraphrase"],"model":"Thank you. Thank you, Marco \u2014 that matches what I have here. So, just to make sure I've got this right: from your side the code 4471 has worked for two hundred guests, your phone was on charge overnight, and the guest did get in eventually. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"It's the same code, 4471, hasn't changed in a year. My phone was on charge, I'm not on call twenty-four seven. She got in eventually, didn't she?","customer_if_weak":"So you've already decided. Whose side are you on exactly?","expects":["empathy","policy","clarify"],"model":"She did, at ten past one \u2014 after about ninety minutes outside with two young children. I understand you can't be awake all night; nobody expects that. The difficulty is that the check-in time had passed and no one could be reached, and the policy treats that as an access failure regardless of why the code failed. Is there any chance the lockbox battery is low? That would explain a red beep on a correct code.","coach":"Fato (ten past one, ninety minutes) + reconhecimento do limite humano + regra explicada com o motivo. Oferece uma causa t\u00e9cnica plaus\u00edvel que n\u00e3o culpa ningu\u00e9m."},{"customer":"\u2026Actually, it might be. It's been flashing. So what happens to my payout?","expects":["policy","options","future"],"model":"I'll be clear so there are no surprises: the first night is affected, because the guest couldn't use it. The remaining two nights are unaffected. You'll see the exact figure in the app today. If you replace the battery and send me a photo, I'll add it to the file \u2014 it shows you acted on it. And if you believe something's been missed, you can dispute the decision from the reservation page; I'll message you the steps.","coach":"Not\u00edcia ruim clara com escopo (noite 1 apenas). D\u00e1 ao host algo a fazer (foto da bateria). Caminho de contesta\u00e7\u00e3o com passos."},{"customer":"Alright. Thanks for actually calling, I suppose.","expects":[],"model":"Of course. You'll have the summary and the dispute steps by message within the hour. Thanks for talking it through, Marco.","coach":"Fecho curto e sem ironia de volta."},{"customer":"Alright.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the guest couldn't get in until ten past one, which the policy treats as an access failure regardless of the cause. Second, the first night's payout is affected; the other two nights are not. And third, if you replace the lockbox battery and send me a photo I'll add it to the file, and you can dispute the decision from the reservation page \u2014 I'll message you the steps. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 4471. Thank you for your time, Marco.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Night 1 payout reduced; host may dispute; note about battery.","policy_ref":"rebooking_refund","why":"Access failure affects payout for the portion of the stay affected."},"auth":{"path":"alura","customer_name":"Marco Bellini"},"callback":true,"value_tier":"high","reference":"4471"},{"id":"unin-in-01","title":"Bed bugs on night two","category":"uninhabitable","callType":"inbound_guest","severity":3,"emotion":"angry","accent":"en-US","caller":{"name":"Darnell","role":"guest"},"context":{"listing":"1-bed apartment, Chicago","booking":"6 nights, currently night 2","policy":"Strict","facts":["photos of bites and mattress seams uploaded","host offered a 'deep clean' tomorrow","guest has left for a hotel tonight \u2014 $210","reported within 3 hours of discovery"]},"lexicon":["bed bugs","bites","mattress","infestation","exterminator"],"turns":[{"customer":"We woke up covered in bites. Bed bugs. I have photos of the mattress seams, it's disgusting. The host is offering a 'deep clean' tomorrow \u2014 I'm not sleeping there again. We're in a hotel and I want every cent back.","expects":["opening","empathy","auth"],"model":"This is {name} with Airbnb Elevated Support. Waking up covered in bites is a genuinely awful thing to go through, and moving to a hotel was the right call \u2014 you don't have to sleep there again. I can see the photos on the case already. Let me confirm the reservation: the one-bedroom in Chicago, six nights, you're on night two? Before we go any further, I need to verify the account, and as you're not calling from the number we have on file I'll need a few details: your full name, the phone number on the account, your date of birth, and the last four digits of the payment method.","coach":"Valida a decis\u00e3o de sair (\u00e9 fator de decis\u00e3o da pol\u00edtica). Confirma que j\u00e1 viu a evid\u00eancia \u2014 mostra preparo."},{"customer":"Seriously? Fine. Darnell Washington. 312-555-0143. Date of birth 2 August 1988. And the card ends in 9018.","expects":["auth","paraphrase"],"model":"Thank you \u2014 that all matches. You're verified. So, just to make sure I've got this right: you woke up this morning covered in bites, you've got photos of the mattress seams, the host offered a deep clean, and you've moved to a hotel and don't want to go back. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Yes. And don't tell me about the host's cleaning. Bed bugs don't go away with a deep clean, that needs an exterminator.","customer_if_weak":"You people always side with the host. I'm done. Refund. Now.","expects":["policy","options","clarify"],"model":"You're right that this isn't a cleaning issue \u2014 a suspected infestation is a health matter, and it falls under what we call uninhabitable conditions, which is covered. Here's what that means in practice: the nights you can't use are refundable, and I can help you rebook somewhere comparable for the rest of the trip if you'd rather not manage that from a hotel. Two quick questions so I get the review right: what time did you first notice the bites, and did the host see the photos?","coach":"Concorda com o fato t\u00e9cnico (n\u00e3o \u00e9 limpeza). Nomeia a categoria e o que ela garante. Duas perguntas de decis\u00e3o: descoberta (72h) e contato com host."},{"customer":"This morning, around seven. Yeah, I sent him the photos, that's when he offered the clean. What about the hotel? That's two hundred and ten dollars.","expects":["policy","options","expectations"],"model":"Seven this morning \u2014 that's well inside the 72-hour window, so timing is not an issue here. On the refund: the four remaining nights are what I'll put forward, and given the photos and that you've had to leave, I'd expect that to be straightforward \u2014 but I'm not the one who signs it off, so I'll say 'expect' rather than 'promise'. The hotel is a separate question: it's not covered as a rule, but where a guest has to leave for a health issue, it's something the reviewer can consider with the receipt. Send me the receipt and I'll attach it with a note.","coach":"Confirma prazo explicitamente (alivia). Diferencia 'expect' de 'promise'. Hotel: honesto sobre a regra, mas mostra o caminho para o reviewer considerar."},{"customer":"Fine. How long?","expects":["expectations","future"],"model":"The review should be done within a day or two. Refunds go out immediately on our side and usually land within 15 days depending on your bank. Your case reference is 9034. I'll message you tomorrow either way \u2014 and if you want help rebooking tonight, say the word and I'll start now.","coach":"Prazos reais (1\u20132 dias, 15 dias), n\u00famero do caso, follow-up com prazo, oferta ativa."},{"customer":"Fine. Go on.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, you found what looks like bed bugs on night two, with photos, and you've left for a hotel. Second, this falls under uninhabitable conditions and is covered; I've put forward the four remaining nights for refund with your photos, and attached the hotel receipt with a note for the reviewer. And third, review takes a day or two, refunds usually land within 15 days, and I'll message you tomorrow either way \u2014 I can also help you rebook tonight if you want. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 9034. Thank you for your time, Darnell.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Refund of remaining nights; rebooking help; hotel receipt attached for reviewer consideration.","policy_ref":"rebooking_refund","why":"Uninhabitable (health hazard), guest vacated, reported within hours, evidence strong."},"auth":{"path":"manual","customer_name":"Darnell Washington","phone":"312-555-0143","dob":"2 August 1988","payment_last4":"9018"},"callback":false,"value_tier":"high","reference":"9034"},{"id":"unin-in-02","title":"Dirty on arrival \u2014 host wants a second chance","category":"uninhabitable","callType":"inbound_guest","severity":2,"emotion":"sarcastic","accent":"en-GB","caller":{"name":"Priya","role":"guest"},"context":{"listing":"Cottage, Cotswolds","booking":"4 nights, arrived 2h ago","policy":"Moderate","facts":["sticky worktops, hair in the plughole, bins full, one used towel","host says cleaner 'must have missed it' and offers to send her back tonight","guest hasn't decided whether to stay"]},"lexicon":["worktops","plughole","bins","soiled linens","musty"],"turns":[{"customer":"Oh, brilliant, a real person. So the cottage: sticky worktops, hair in the plughole, bins overflowing, and a used towel on the rail. Lovely. The host says the cleaner 'must have missed it'. Missed the whole house, apparently.","expects":["opening","empathy","auth"],"model":"Hi Priya, this is {name} at Airbnb Elevated Support. That's not how you want to walk into a four-night stay, and I'm not going to pretend a used towel is a small thing. Let me look at the booking \u2014 the cottage in the Cotswolds, arrived this afternoon? Before we go any further, I just need to confirm the account \u2014 could I have your first and last name, please?","coach":"Sarcasmo: n\u00e3o ri junto, n\u00e3o se defende; responde ao conte\u00fado com compet\u00eancia. Nomeia o detalhe mais grave (toalha usada)."},{"customer":"Oh, security theatre, lovely. It's Priya Shah.","expects":["auth","paraphrase"],"model":"Thank you, Priya \u2014 that matches what I have here. So, just to make sure I've got this right: the cottage wasn't clean on arrival \u2014 sticky worktops, hair in the plughole, full bins, a used towel \u2014 and the host has offered to send the cleaner back tonight. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Correct. So do I stay in the filth or what?","expects":["clarify","options","policy"],"model":"You've got a choice, and I'll tell you what each one means. The host has offered to send the cleaner back tonight \u2014 if you're willing to let that happen, I'd photograph everything first, and if it's properly done, you keep the stay and I'd still note the arrival state. If you don't want to stay, that's reasonable too: a place that isn't reasonably clean on arrival is something we cover, and I'd look at rebooking or refund. Which way are you leaning?","coach":"Duas op\u00e7\u00f5es reais, cada uma com consequ\u00eancia. Deixa o cliente decidir. N\u00e3o empurra a 'segunda chance' do host."},{"customer":"\u2026I'll give the cleaner one chance. But if it's not right, I'm not staying.","customer_if_weak":"You're really selling this, aren't you. Fine. One chance.","expects":["ownership","future"],"model":"That's fair. Here's what I'll do: I'm noting the arrival condition with your photos now, so if tonight doesn't go well, you don't have to re-explain anything \u2014 you just message the case and I pick it up. Reference is 3312. Take a photo when the cleaner's done, either way. And if you do decide to leave, you're still inside the window; nothing is lost by giving it a go.","coach":"Protege o cliente contra a 'segunda chance' virar armadilha: registra tudo agora, confirma que o prazo n\u00e3o corre contra ele."},{"customer":"Sure, wrap it up.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the cottage wasn't properly cleaned when you arrived, and you've documented it with photos. Second, you've chosen to give the cleaner one chance tonight; I've recorded the arrival condition on the case so nothing is lost if it doesn't work out. And third, if it isn't right, message the case and we look at rebooking or refund \u2014 you're still inside the reporting window either way. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 3312. Thank you for your time, Priya.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Documented; guest chooses second clean; refund/rebook path stays open.","policy_ref":"cleanliness","why":"Not reasonably clean is covered; giving host a chance is guest's choice, not a policy requirement."},"auth":{"path":"alura","customer_name":"Priya Shah"},"callback":false,"value_tier":"standard","reference":"3312"},{"id":"unin-in-03","title":"No heating in January \u2014 third contact","category":"repeat_contact","callType":"inbound_guest","severity":3,"emotion":"frustrated","accent":"en-GB","caller":{"name":"Tom","role":"guest"},"context":{"listing":"Flat, Edinburgh","booking":"7 nights, day 3","policy":"Firm","facts":["boiler down since night 1","two previous agents promised callbacks \u2014 none came","host sent a plumber who couldn't fix it","outside temperature \u22122\u00b0C","reported day 1 \u2014 inside 72h"]},"lexicon":["boiler","radiators","stone cold","callback","follow up"],"turns":[{"customer":"This is the third time I've called. Boiler's been dead since the first night, radiators stone cold, it's minus two outside. Two people promised to call me back. Nobody did. I'm not explaining it all again.","expects":["opening","empathy","ownership","auth"],"model":"You shouldn't have to, and you won't. I've got the notes in front of me \u2014 boiler out since Tuesday night, plumber came Wednes 've had refunded, we've been sleeping in coats.","expects":["policy","expectations","future"],"model":"Understood \u2014 rebooking it is, and I'm starting the search now. On the three nights: they're the nights affected, so that's exactly what I'm putting forward for refund, with the plumber's visit as evidence. I won't promise the reviewer's answer, but I'll tell you I'd be surprised by anything else. I'll message you options within the hour, and I'll call you back at four o'clock today whether or not I have news \u2014 you have my word on that one, and you'll be able to hold me to it on the case notes.","coach":"Callback com hora exata, registrado \u2014 repara a quebra de confian\u00e7a anterior com um compromisso verific\u00e1vel."},{"customer":"Four o'clock. Fine.","expects":["future"],"model":"Four o'clock. Your reference is 7715, and any message on it comes to me. Put the kettle on \u2014 that at least still works.","coach":"Fecho com o compromisso repetido. Humor leve permitido porque h\u00e1 progresso."},{"customer":"Right.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, no heating since Tuesday night, a failed repair, and two callbacks that didn't happen \u2014 I'm sorry about those. Second, we're rebooking you somewhere with working heating for the remaining nights, and the three nights without heating are going forward for refund with the plumber's visit as evidence. And third, you'll get rebooking options by message within the hour, and I'll call you at four o'clock today whether or not there's news. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 7715. Thank you for your time, Tom.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr as de decis\u00e3o."},{"customer":"Okay \u2014 it's just come through. 7 1 9 4 4 8.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: there's a large dog living in the house that isn't on the listing, you're allergic and already wheezing, and the host laughed it off. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"I've got a photo, yes. I arrived about an hour ago. Rebook, please \u2014 I don't know the area.","customer_if_weak":"Sorry \u2014 'covered' means what, exactly? I'm confused.","expects":["ownership","expectations","future"],"model":"Then rebooking it is, and I'm starting now. You'll get options by message in the next twenty minutes \u2014 pick one and I'll move the booking. The photo's attached to the case, reference 4487. Keep the inhaler handy and stay outside till we've got you sorted. I'll stay on the case until you're in the new place.","coach":"A\u00e7\u00e3o imediata, prazo, n\u00famero, cuidado com a sa\u00fade, continuidade."},{"customer":"Okay, I think so.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the listing didn't disclose a dog, and with your allergy you can't stay there. Second, this counts as not as advertised and it's covered; I'm rebooking you somewhere comparable tonight and your photo is on the case. And third, you'll get options by message in the next twenty minutes \u2014 stay outside with your inhaler until we've got you sorted. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 4487. Thank you for your time, Naledi.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Rebook tonight; undisclosed pet is a mismatch; health prioritised.","policy_ref":"rebooking_refund","why":"Listing failed to disclose a pet present."},"auth":{"path":"pin","customer_name":"Naledi Mokoena","verified_phone_ends":"2213","pin":"719448"},"callback":false,"value_tier":"standard","reference":"4487"},{"id":"hc-in-01","title":"Host cancelled two days before a wedding trip","category":"host_cancel","callType":"inbound_guest","severity":3,"emotion":"angry","accent":"en-NG","caller":{"name":"Chidi","role":"guest"},"context":{"listing":"Villa, Lagos","booking":"4 nights, check-in in 2 days","policy":"Strict (irrelevant \u2014 host cancelled)","facts":["host cancelled citing 'family emergency' with no documentation","comparable villas now 2\u00d7 the price","guest is bringing 8 family members for a wedding"]},"lexicon":["cancelled","two days before","double the price","rebook","host cancellation"],"turns":[{"customer":"The host cancelled on us! Two days before! Eight of us are coming for my sister's wedding and now everywhere is double the price. This is not acceptable. What are you people doing about it?","expects":["opening","empathy","auth"],"model":"This is {name} with Airbnb Elevated Support \u2014 a host cancelling two days before a family wedding is exactly the kind of thing this team exists for, and I'm going to work on it with you now. Let me confirm the booking: the villa in Lagos, four nights, checking in the day after tomorrow, eight guests? Before we go any further, I need to verify the account, and as you're not calling from the number we have on file I'll need a few details: your full name, the phone number on the account, your date of birth, and the last four digits of the payment method.","coach":"Raiva: fato espec\u00edfico + a\u00e7\u00e3o, sem defender o host. Verifica."},{"customer":"Seriously? Fine. Chidi Okonkwo. +234 803 555 0102. Date of birth 11 November 1986. And the card ends in 7745.","expects":["auth","paraphrase"],"model":"Thank you \u2014 that all matches. You're verified. So, just to make sure I've got this right: the host cancelled two days before check-in citing a family emergency, eight of you are coming for your sister's wedding, and comparable places are now double the price. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Yes! And he said 'family emergency' \u2014 no proof, nothing. He probably got a better offer.","customer_if_weak":"You are just reading from a script. I want action, not sympathy.","expects":["policy","options","ownership"],"model":"Here's what's certain, whatever the host's reason: you get a full refund, including fees, and we help you rebook. That part isn't up for review \u2014 it's automatic when a host cancels. What I'm going to do now is look for comparable villas for the same dates, and where the price is higher, there's support I can look at for the difference; I can't promise the exact amount until I see the options, but I can promise I'll present them with the numbers. Give me a few minutes on the line.","coach":"Separa o certo (reembolso autom\u00e1tico) do a avaliar (diferen\u00e7a de pre\u00e7o). N\u00e3o especula sobre a motiva\u00e7\u00e3o do host."},{"customer":"And the host? He just gets away with it?","expects":["policy","future"],"model":"No. A host who cancels this close to check-in without a valid, documented reason faces a penalty fee, their calendar gets blocked for those dates, and they can lose Superhost status or be removed. I can't share the details of what happens to his account, but I can tell you it isn't nothing. Your job is the wedding; mine is the villa. Reference 8801 \u2014 I'll message options within the hour and call you back before six.","coach":"Responde com a pol\u00edtica real de penalidade sem revelar dados do host. Redireciona para o que importa ao cliente."},{"customer":"Fine. Go on.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the host cancelled two days out; you get a full refund including fees, automatically, and we help you rebook. Second, I'm searching comparable villas for the same dates and will present options with the numbers, including what support may apply to the price difference. And third, the host faces the cancellation penalty under policy; you'll get options within the hour and I'll call you back before six. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 8801. Thank you for your time, Chidi.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Full refund incl. fees; rebooking assistance; host penalised per policy.","policy_ref":"host_cancellation_policy","why":"Host cancellation before check-in = full refund and rebooking help; host penalty tier by notice window."},"auth":{"path":"manual","customer_name":"Chidi Okonkwo","phone":"+234 803 555 0102","dob":"11 November 1986","payment_last4":"7745"},"callback":false,"value_tier":"high","reference":"8801"},{"id":"hc-out-01","title":"Calling a host who cancelled 5 days out","category":"host_cancel","callType":"outbound_host","severity":2,"emotion":"host_pleading","accent":"en-IE","caller":{"name":"Siobh\u00e1n","role":"host"},"context":{"listing":"Cottage, Galway","booking":"guest family, 3 nights","facts":["host cancelled 5 days before check-in \u2014 burst pipe flooded the cottage","host has a plumber's report","this is her only listing and main income","penalty applies unless documented valid reason"]},"lexicon":["burst pipe","flooded","penalty","documentation","calendar blocked"],"turns":[{"customer":"Hello? Oh, Airbnb \u2014 please, I didn't want to cancel, the pipe burst in the night, the whole ground floor is under water. This is my only income, I've kids, I can't take a fine on top of this.","expects":["opening","auth","empathy","recording"],"model":"Hi Siobh\u00e1n, this is {name} from Airbnb's Elevated Support team, calling about the cancellation for the cottage in Galway. I've seen your message about the pipe, and I'm calling to make sure your side is properly documented \u2014 because that's what decides whether a penalty applies. A flooded ground floor is a real emergency; let's get it on the record. Before we go on, two quick things: this call is being recorded for training and quality purposes \u2014 is that okay with you? And just to confirm I'm speaking with the right person, could I have your first and last name?","coach":"Apresenta\u00e7\u00e3o outbound; enquadra a liga\u00e7\u00e3o como AJUDA para documentar \u2014 o que \u00e9 verdade. Reconhece a emerg\u00eancia sem prometer."},{"customer":"Yeah, that's fine. It's Siobh\u00e1n Walsh.","expects":["auth","paraphrase"],"model":"Thank you. Thank you, Siobh\u00e1n \u2014 that matches what I have here. So, just to make sure I've got this right: a pipe burst in the night, the ground floor flooded, you cancelled five days before check-in, and this is your only listing. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Yes \u2014 yes, I have the plumber's report, and photos, God, so many photos.","customer_if_weak":"Are you going to fine me or not? Just tell me.","expects":["policy","clarify","ownership"],"model":"That's exactly what's needed. Here's how it works: a cancellation five days out normally carries a fee, but a valid reason outside your control \u2014 and a burst pipe with a plumber's report is a textbook example \u2014 can waive it. I can't decide that on this call; a reviewer does. What I can do is attach the report and photos myself, right now, and flag it as documented. Can you upload the report in the app, or send it to me on the case?","coach":"Explica a regra e a exce\u00e7\u00e3o com honestidade ('normally a fee\u2026 can waive'). Diz o limite ('I can't decide') e a a\u00e7\u00e3o ('I'll attach')."},{"customer":"I'll send it now. And the guests \u2014 they're not going to hate me?","expects":["policy","expectations","future"],"model":"The guests get a full refund and we help them rebook \u2014 that happens automatically, so they're taken care of. Your calendar for those dates will show as blocked; that's standard after any cancellation. You'll have the reviewer's decision by message, usually within a couple of days. Reference for you is 5502. I know this is a hard week \u2014 you've done the right thing by documenting it.","coach":"Responde \u00e0 preocupa\u00e7\u00e3o humana (os h\u00f3spedes), explica o bloqueio de calend\u00e1rio sem dramatizar, prazo, n\u00famero, sem falsa esperan\u00e7a."},{"customer":"Okay. Thank you.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, you cancelled because of a burst pipe and a flooded ground floor, and you have the plumber's report and photos. Second, a cancellation five days out normally carries a fee, but a documented reason outside your control can waive it; I'm attaching your evidence and flagging it as documented \u2014 a reviewer decides. And third, the guests are refunded and rebooked automatically, your calendar shows blocked for those dates, and you'll have the decision by message within a couple of days. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 5502. Thank you for your time, Siobh\u00e1n.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Penalty likely waived with documentation; guests refunded and rebooked; calendar blocked for dates.","policy_ref":"host_cancellation_policy","why":"Valid reason outside host's control, with documentation, can exempt the fee."},"auth":{"path":"alura","customer_name":"Siobh\u00e1n Walsh"},"callback":true,"value_tier":"high","reference":"5502"},{"id":"gc-in-01","title":"Cancelling a Strict booking 10 days out","category":"guest_cancel","callType":"inbound_guest","severity":2,"emotion":"disappointed","accent":"en-US","caller":{"name":"Megan","role":"guest"}, that's not what you were hoping to hear.","coach":"Negativa clara, com a regra explicada, sem 'unfortunately'. Reconhece a decep\u00e7\u00e3o depois do fato, n\u00e3o antes."},{"customer":"Nothing at all? That's brutal. Can't you ask the host?","customer_if_weak":"Seriously? I've never had a problem with this app before.","expects":["options","ownership","future"],"model":"There are two things worth trying, and I'll be honest about the odds. First, you can message the host and ask if they'd offer a partial refund \u2014 some do, especially if they can re-let the dates; it's their call, not ours, but it costs nothing to ask, and I can help you word it. Second, if the host re-books those nights, some choose to refund then. What I can't do is override the policy from here. Would you like me to help with the message to the host?","coach":"Honesto sobre 'it's their call'. D\u00e1 uma a\u00e7\u00e3o concreta (ajudar a escrever). N\u00e3o promete o que n\u00e3o controla."},{"customer":"Yeah, okay. Help me write it.","expects":["ownership","future"],"model":"Sure. Something like: 'Hi, my work trip was cancelled and I no longer need the cabin. I understand the policy is Strict; if you're able to re-book the dates, would you consider a partial refund? Thank you.' Short and polite works best. Send that, and if the host replies, message me on case 3390 and I'll help with next steps.","coach":"Entrega o texto pronto. Fecha com n\u00famero e caminho."},{"customer":"Okay.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, you need to cancel the cabin because your trip fell through. Second, the booking is on a Strict policy and, at ten days out and booked three weeks ago, the policy itself doesn't refund it. And third, you're going to message the host to ask for a partial refund if they can re-let the dates \u2014 I gave you the wording \u2014 and if they reply, message me on the case. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 3390. Thank you for your time, Megan.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"No refund under Strict; guest may request goodwill refund from host; no override.","policy_ref":"cancellation_policies_guest","why":"Outside both Strict windows; no reservation issue."},"auth":{"path":"alura","customer_name":"Megan Foster"},"callback":false,"value_tier":"standard","reference":"3390"},{"id":"gc-in-02","title":"Cancelling after a death in the family","category":"guest_cancel","callType":"inbound_guest","severity":3,"emotion":"grieving","accent":"en-GB","caller":{"name":"Helen","role":"guest"},"context":{"listing":"Apartment, Rome","booking":"6 nights, check-in in 4 days","policy":"Firm","facts":["guest's father died yesterday","guest is not sure what she's asking for","extenuating circumstances path exists and requires documentation"]},"lexicon":["bereavement","documentation","extenuating circumstances","cancel"],"turns":[{"customer":"Hello. I\u2026 I need to cancel Rome. My dad died yesterday. I don't really know what I'm asking for, I just can't go.","expects":["opening","empathy","auth"],"model":"Helen, I'm so sorry about your dad. This is {name} at Airbnb \u2014 you don't need to know what you're asking for; I'll take care of the details. Let's just get Rome off your list. Is it all right if I ask you two or three short questions, and then you don't have to think about this again today? Before we go any further, I just need to confirm the account \u2014 could I have your first and last name, please?","coach":"Condol\u00eancias curtas e sinceras. Tira o peso ('I'll take care of the details'). Pede permiss\u00e3o para as perguntas."},{"customer":"It's Helen Marsh.","expects":["auth","paraphrase"],"model":"Thank you, Helen \u2014 that matches what I have here. So, just to make sure I've got this right: your father died yesterday and you need to cancel Rome. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Yes. Okay.","expects":["policy","clarify","ownership"],"model":"Thank you. There's a process for situations like this \u2014 it's separate from the normal cancellation rules, and it's there for exactly this. It does ask for a document at some point, like a death certificate or a notice from the funeral director; there's no rush on that, and I'll message you what's accepted so you don't have to search. Today, I'll cancel the booking and open that process on your behalf. Is the email on the account the best place to send you the summary?","coach":"Menciona a documenta\u00e7\u00e3o com cuidado, sem pressa, oferecendo a lista. Faz o trabalho por ela."},{"customer":"Yes. Thank you. I'm sorry, I'm a mess.","customer_if_weak":"I just\u2026 can you please just do it? I can't do forms today.","expects":["empathy","future"],"model":"You're not a mess; you're someone whose dad died yesterday. Everything's done on my side \u2014 the booking is cancelled and the case is open, reference 1174. You'll get one message from me with what's needed, and there's no deadline you need to worry about this week. Take care of yourself and your family, Helen.","coach":"Confirma que est\u00e1 feito, sem tarefas para hoje, n\u00famero, encerramento humano."},{"customer":"Yes. Thank you.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the Rome booking is cancelled. Second, I've opened the extenuating-circumstances process on your behalf; it asks for one document at some point and I'll message you what's accepted \u2014 there's no deadline you need to worry about this week. And third, you'll get one message from me with what's needed, and nothing else is required from you today. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 1174. Thank you for your time, Helen.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Cancel; open extenuating circumstances review; documentation requested gently, later.","policy_ref":"cancellation_policies_guest","why":"Extenuating circumstances path is separate from the listing's policy tier."},"auth":{"path":"alura","customer_name":"Helen Marsh"},"callback":false,"value_tier":"standard","reference":"1174"},{"id":"gc-in-03","title":"Monthly stay \u2014 wants out after week one","category":"guest_cancel","callType":"inbound_guest","severity":2,"emotion":"confused","accent":"en-AU","caller":{"name":"Liam","role":"guest"},"context":{"listing":"Flat, Sydney","booking":"3-month stay, currently week 1","policy":"Long-term","facts":["guest got a job in another city","thinks he can just cancel and get the rest back","monthly stays: next month is non-refundable after start"]},"lexicon":["monthly stay","28 nights","non-refundable","next month","change dates"],"turns":[{"customer":"G'day. So I've got the three-month place in Sydney but I've just landed a job in Brisbane. I'm a week in. I'll just cancel and get the rest back, yeah?","expects":["opening","auth","clarify"],"model":"Hi Liam, {name} at Airbnb \u2014 congrats on the job. Let me check the booking so I give you the right answer, because stays of 28 nights or more work differently. The flat in Sydney, three months, you're in week one? Before we go any further, I need to verify the account: I'm sending a PIN to the phone number ending in 6630 right now \u2014 could you read it back to me when it arrives?","coach":"Sinaliza cedo que a regra \u00e9 diferente, sem entregar a m\u00e1 not\u00edcia antes de verificar."},{"customer":"Okay \u2014 it's just come through. 3 3 8 1 0 9.","expects":["auth","paraphrase"],"model":"Perfect, that matches \u2014 you're verified. So, just to make sure I've got this right: you're a week into a three-month stay in Sydney, you've got a job in Brisbane, and you want to cancel. Is that everything?","coach":"Feche a autentica\u00e7\u00e3o com 'verified/that matches' ANTES de qualquer dado da conta. Depois, parafraseie o problema com as suas palavras e pergunte se faltou algo.","customer_if_weak":"Hang on \u2014 did you actually verify me, or are we just carrying on?"},{"customer":"Yeah, that's it. Differently how?","expects":["policy","empathy"],"model":"For long stays, the rule is: once the stay has started, the next month is non-refundable when you cancel. So if you cancel today, you'd still be charged for the coming month, and the months after that would be refunded. I know that's a chunk \u2014 I'd rather tell you clearly than have it surprise you on the statement.","coach":"Regra em uma frase, com o exemplo aplicado ao caso. Reconhece o impacto."},{"customer":"Ah, that's rough. Is there any way around er 28 nights."},"auth":{"path":"pin","customer_name":"Liam Hartley","verified_phone_ends":"6630","pin":"338109"},"callback":false,"value_tier":"standard","reference":"2105"},{"id":"hd-out-01","title":"Host damage claim \u2014 worn sofa vs broken frame","category":"host_damage","callType":"outbound_host","severity":2,"emotion":"host_indignant","accent":"en-US","caller":{"name":"Dana","role":"host"},"context":{"listing":"Condo, Austin","booking":"guest checked out 9 days ago","facts":["host claims $1,200 for a sofa","photos show a sagging, stained cushion and a cracked wooden leg","host has NOT yet requested via Resolution Center","14-day Resolution Center window still open (5 days left)","wear and tear excluded; physical damage covered"]},"lexicon":["wear and tear","damage","Resolution Center","14 days","itemised","quote"],"turns":[{"customer":"Finally. So are you paying for my sofa or not? Twelve hundred dollars. That guest destroyed it and you people take forever.","expects":["opening","auth","listen","recording"],"model":"Hi Dana, this is {name} from Airbnb's Elevated Support team, about the condo in Austin and the sofa. I've looked at your photos, and I'm calling because there's a step that hasn't happened yet that affects whether this can be paid at all \u2014 I want to walk you through it so nothing gets lost. First, can you tell me what the sofa looked like before this guest, and how old it is? Before we go on, two quick things: this call is being recorded for training and quality purposes \u2014 is that okay with you? And just to confirm I'm speaking with the right person, could I have your first and last name?","coach":"N\u00e3o responde 'sim ou n\u00e3o' ao ultimato. Sinaliza que h\u00e1 um passo faltando (Resolution Center) e enquadra como ajuda. Pergunta factual."},{"customer":"Yeah, that's fine. It's Dana Whitfield.","expects":["auth","paraphrase"],"model":"Thank you. Thank you, Dana \u2014 that matches what I have here. So, just to make sure I've got th rify me, or are we just carrying on?"},{"customer":"It's a basement, they all get a bit damp. It was fine before. Look, are you covering it or not?","customer_if_weak":"I knew it. You always find a way not to pay.","expects":["policy","empathy"],"model":"I'll tell you straight, because you asked straight: mould and fungi are specifically excluded from Host Damage Protection \u2014 it's in the exclusions alongside weather and normal wear. That's true regardless of whether the guest opened a window. I understand that's frustrating when you're looking at a nine-hundred-pound bill, and I'm not going to dress it up.","coach":"Negativa clara com a regra e a raz\u00e3o. Sem 'unfortunately'. Reconhece o impacto sem pedir desculpa pela regra."},{"customer":"So I'm just out nine hundred quid?","expects":["options","future"],"model":"From Airbnb's protection, yes \u2014 I won't pretend otherwise. Two things that might still be worth your time: if you believe the guest caused specific, unusual damage beyond damp \u2014 say, they blocked a vent \u2014 that's a different claim and you'd need evidence of it; and for a basement, this may be something your own home insurance handles, which I can't advise on but is worth a call. I'll put what I've told you in writing on case 8830 so you have it. I'm sorry it's not better news, Graham.","coach":"Honesto at\u00e9 o fim. Aponta caminhos reais sem inventar cobertura. Por escrito."},{"customer":"Alright.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, mould and fungi are specifically excluded from Host Damage Protection, regardless of ventilation. Second, if you have evidence of specific damage beyond damp \u2014 say, a blocked vent \u2014 that's a separate claim; and your own home insurance may be worth a call, though I can't advise on it. And third, I'm putting what I told you in writing on the case. Have I explained those steps clearly \u2014 is there anything you'd like me to go over again? \u2026 And is there anything else I can help you with today? \u2026 Then I'll go ahead and close this case. You'll have all of this in writing in the app under reference 8830. Thank you for your time, Graham.","coach":"Sequ\u00eancia obrigat\u00f3ria: resumo de TUDO (problema \u2192 feito \u2192 pr\u00f3ximos passos com prazos \u2192 refer\u00eancia) \u2192 'os passos ficaram claros?' \u2192 'mais alguma coisa?' \u2192 'vou fechar o caso' + por escrito no app. Pular o resumo \u00e9 a falha que demite.","customer_if_weak":"Wait \u2014 so what exactly is happening now? I've lost track."}],"resolution":{"correct":"Claim excluded (mould/fungi); explain clearly; point to other avenues without promising.","policy_ref":"host_damage_protection","why":"Explicit exclusion; window behaviour does not change it."},"auth":{"path":"alura","customer_name":"Graham Pollard"},"callback":true,"value_tier":"standard","reference":"8830"},{"id":"app-in-01","title":"Appeal \u2014 denied for reporting after 72h","category":"appeal","callType":"inbound_guest","severity":2,"emotion":"threatening","accent":"en-US","caller":{"name":"Kyle","role":"guest"},"context":{"listing":"Apartment, Miami","booking":"5 nights, stayed all 5","facts":["AC blew warm air the whole stay; guest reported on day 6, after check-out","refund denied \u2014 outside 72h from discovery","guest threatens a one-star review and a chargeback","guest has a message to host from day 2 saying 'AC's not great'"]},"lexicon":["72 hours","dispute","chargeback","one-star review","uphold"],"turns":[{"customer":"Your people denied my refund. The AC blew hot air for five days in Miami. I'm gonna leave a one-star review and I already told my bank to dispute it. So what are you gonna do?","expects":["opening","auth","listen"],"model":"This is {name} with Airbnb Elevated Support. Five days in Miami with an AC blowing warm air sounds miserable, and I want to understand exactly why it was denied before we talk abou at, kinda warm'. That's it.","expects":["policy","options","ownership"],"model":"Okay \u2014 I'll be honest with you about how a reviewer will read that. 'Not great, kinda warm' on day two shows you raised it early, which is in your favour. It's less clear than 'the AC is broken', which a reviewer might read as a comfort complaint rather than a fault. So it's a real basis to dispute, not a guaranteed win. What I'll do is submit the dispute with that message and a note that the issue was raised on day two, and I'll ask for it to be reviewed against the 72-hour rule specifically. Do you have any other messages or photos from the stay \u2014 a thermostat reading, anything?","coach":"Avalia\u00e7\u00e3o honesta da evid\u00eancia (a favor e contra). A\u00e7\u00e3o concreta (dispute + nota). Pede mais evid\u00eancia."},{"customer":"I might have a photo of the thermostat at 82. And the review? The chargeback?","expects":["policy","future"],"model":"Send the thermostat photo \u2014 that's the strongest thing you've mentioned. On the review, that's entirely your right and I won't ask you not to; I'd only say the dispute is a better lever than the review for getting money back. On the chargeback: I'd be doing you a disservice if I didn't tell you that a bank dispute running at the same time as ours can complicate the refund if ours succeeds \u2014 it's your call, but you should know that. Reference 6642; I'll message you when the dispute's logged, within the hour.","coach":"N\u00e3o pede para retirar a avalia\u00e7\u00e3o. Informa a consequ\u00eancia real do chargeback simult\u00e2neo, sem amea\u00e7ar. N\u00famero e prazo."},{"customer":"Yeah, go ahead.","expects":["summary","confirm","close"],"model":"Before we finish, let me go over everything we covered today. First, the denial was based on the 72-hour window, but your day-two message to the host counts as raising the issue early. Second, I'm submitting a dispute with that message and a note asking for review against the
