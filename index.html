<title>Elevated Line</title>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0E6E66">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   ELEVATED LINE v3 -- training simulator for Airbnb Elevated Support
   Single-file app; content inlined by build.py as pure ASCII JSON.
   This template is ASCII-only on purpose (no charset dependency).
   No API keys anywhere. Online mode uses claude.use("sample") and is
   OFF by default -- the user switches it on from the header.
   ============================================================ */
:root{
  --paper:#F5F4F0; --surface:#FFFFFF; --surface-2:#ECEAE4; --line:#D9D6CE;
  --ink:#171F29; --ink-2:#44505E; --muted:#6B7684;
  --accent:#0E6E66; --accent-ink:#FFFFFF; --accent-soft:#D6ECE8;
  --customer:#B8410E; --customer-soft:#F9E6DC;
  --good:#15803D; --good-soft:#DCFCE7; --warn:#A85A07; --warn-soft:#FDF0D5; --crit:#B42323; --crit-soft:#FBE2E2;
  --shadow:0 1px 2px rgba(23,31,41,.05),0 8px 24px rgba(23,31,41,.06);
  --r:16px; --r-s:10px;
  --f-ui:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Source Sans 3","Source Sans Pro",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E151D; --surface:#151F2A; --surface-2:#1C2833; --line:#283645;
    --ink:#E8ECF1; --ink-2:#B9C3CE; --muted:#8C9AAA;
    --accent:#34D3BE; --accent-ink:#05201B; --accent-soft:#113D38;
    --customer:#FB9748; --customer-soft:#3A2415;
    --good:#4ADE80; --good-soft:#12321F; --warn:#FBBF24; --warn-soft:#3A2A0A; --crit:#F87171; --crit-soft:#3B1515;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0E151D; --surface:#151F2A; --surface-2:#1C2833; --line:#283645;
  --ink:#E8ECF1; --ink-2:#B9C3CE; --muted:#8C9AAA;
  --accent:#34D3BE; --accent-ink:#05201B; --accent-soft:#113D38;
  --customer:#FB9748; --customer-soft:#3A2415;
  --good:#4ADE80; --good-soft:#12321F; --warn:#FBBF24; --warn-soft:#3A2A0A; --crit:#F87171; --crit-soft:#3B1515;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.mono{font-family:var(--f-mono);font-size:.86rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-ui);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

#app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header .brand{font-family:var(--f-ui);font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:8px}
header .brand i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
header .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 11px;font-family:var(--f-ui);font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.active{background:var(--ink);color:var(--paper)}
.seg button.active.on{background:var(--accent);color:var(--accent-ink)}
.seg .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
main{flex:1;padding:16px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:none;border:0;border-radius:var(--r-s);padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-family:var(--f-ui);font-size:.64rem;font-weight:600;cursor:pointer}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.active{color:var(--accent);background:var(--accent-soft)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.card.crit{border-color:var(--crit);background:var(--crit-soft)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 14px;font-family:var(--f-ui);font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.big{padding:16px 18px;font-size:1rem;border-radius:14px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-family:var(--f-ui);font-size:.72rem;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.accent{background:var(--accent-soft);color:var(--accent)}
.code{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--paper)}
select,input[type=text],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
textarea{min-height:96px;resize:vertical;line-height:1.4}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.small{display:block}
label.small select,label.small input[type=text]{margin-top:4px}

/* incoming call */
.ring{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px 22px;text-align:center}
.ring .orb{width:96px;height:96px;border-radius:50%;background:var(--customer-soft);color:var(--customer);display:grid;place-items:center;position:relative}
.ring .orb svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ring .orb::before,.ring .orb::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--customer);opacity:0;animation:ripple 1.8s infinite}
.ring .orb::after{animation-delay:.9s}
@keyframes ripple{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring .orb::before,.ring .orb::after{animation:none}}
.ring h1{font-size:1.3rem}
.ring .num{font-family:var(--f-mono);color:var(--muted)}

/* scenario list */
.scn{position:relative;padding-left:18px;cursor:pointer}
.scn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:var(--r) 0 0 var(--r);background:var(--good)}
.scn.s2::before{background:var(--warn)} .scn.s3::before{background:var(--crit)}
.scn h3{font-size:.98rem}
.scn .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* call screen */
.caller{display:flex;gap:12px;align-items:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--customer-soft);color:var(--customer);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:1.1rem;flex:none}
.phases{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 4px;margin-top:12px}
.phases .ph{display:flex;flex-direction:column;gap:4px}
.phases .ph i{display:block;height:5px;border-radius:3px;background:var(--line)}
.phases .ph.hit i{background:var(--accent)}
.phases .ph.exp i{background:var(--accent-soft);outline:1px dashed var(--accent)}
.phases .ph.critmiss i{background:var(--crit)}
.phases .ph span{font-family:var(--f-ui);font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phases .ph.crit span{font-weight:700;color:var(--ink-2)}
.locked{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r-s)}
.transcript{display:flex;flex-direction:column;gap:10px;max-height:40vh;overflow:auto;padding:4px 2px}
.bubble{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.4}
.bubble.c{align-self:flex-start;background:var(--customer-soft);border-bottom-left-radius:4px;border-left:3px solid var(--customer)}
.bubble.a{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.bubble.sys{align-self:center;background:var(--surface-2);font-size:.8rem;color:var(--muted);font-family:var(--f-ui)}
.bubble .who{display:block;font-family:var(--f-ui);font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.bubble.c .who{color:var(--customer)} .bubble.a .who{color:var(--accent)}
.talk{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
.mic{width:66px;height:66px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.mic.live{background:var(--accent);color:var(--accent-ink);animation:pulse 1.2s infinite}
.mic svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.interim{font-style:italic;color:var(--muted);min-height:1.2em}
.holdbar{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-s);padding:8px 12px;font-family:var(--f-ui);font-weight:600}
.holdbar b{font-variant-numeric:tabular-nums;font-size:1.2rem}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* feedback */
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--f-ui)}
.score b{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums}
.dims{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.dims .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;align-self:center}
.dims .bar i{display:block;height:100%;background:var(--accent)}
.dims .na{color:var(--muted);font-style:italic}
.fb h4{font-family:var(--f-ui);font-size:.78rem;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fb blockquote{margin:0;padding:8px 10px;border-left:3px solid var(--line);background:var(--surface-2);border-radius:0 var(--r-s) var(--r-s) 0}
.fix{display:grid;grid-template-columns:1fr;gap:4px;font-size:.92rem}
.fix .w{color:var(--crit);text-decoration:line-through;text-decoration-thickness:1.5px}
.fix .r{color:var(--good);font-weight:600}
.flag{background:var(--crit-soft);color:var(--crit);border-radius:var(--r-s);padding:8px 10px;font-size:.9rem}
.banner{background:var(--crit);color:#fff;border-radius:var(--r-s);padding:10px 12px;font-family:var(--f-ui);font-weight:700}
details summary{cursor:pointer;font-family:var(--f-ui);font-weight:600;font-size:.9rem;padding:6px 0;list-style:none;display:flex;align-items:center;gap:8px}
details summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
.model{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;line-height:1.5}
.lex{display:flex;gap:6px;flex-wrap:wrap}
.lex .chip{font-family:var(--f-mono);font-weight:500;text-transform:none;letter-spacing:0}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:.92rem}
.check .ok{color:var(--good);font-weight:700} .check .no{color:var(--crit);font-weight:700} .check .na{color:var(--muted)}

/* drills diff */
.diff span{padding:1px 3px;border-radius:4px;margin-right:2px}
.diff .ok{background:var(--good-soft);color:var(--good)} .diff .miss{background:var(--crit-soft);color:var(--crit)} .diff .extra{color:var(--muted);text-decoration:line-through}

/* phrases / policy */
.line{padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .t{font-size:1rem;line-height:1.45}
.line .why{color:var(--muted);font-size:.86rem;margin-top:4px}
.avoid .t{color:var(--crit)}
.kv{display:grid;grid-template-columns:minmax(84px,30%) 1fr;gap:6px 12px;font-size:.92rem;overflow-wrap:anywhere}
.kv.stack{grid-template-columns:1fr}
.pathcard{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;margin-top:8px}
.pathcard b{font-family:var(--f-ui);display:block;margin-bottom:4px}
.kv b{font-family:var(--f-ui);font-weight:600;color:var(--ink-2)}
ul.tight{margin:6px 0 0 18px;padding:0} ul.tight li{margin:3px 0}
ol.tight{margin:6px 0 0 18px;padding:0} ol.tight li{margin:4px 0}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:8px;font-family:var(--f-ui);font-weight:600;font-size:.84rem;color:var(--muted);cursor:pointer}
.subtabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:var(--r-s);padding:10px}
.stat b{display:block;font-family:var(--f-ui);font-size:1.4rem;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-family:var(--f-ui);font-size:.82rem;font-weight:600;z-index:9;box-shadow:var(--shadow);max-width:92%}
.hidden{display:none!important}
</style>

<div id="app">
  <header>
    <div class="brand"><i></i>Elevated Line</div>
    <div class="spacer"></div>
    <div class="seg" id="modeSeg" title="Offline never calls Claude. Online grades with Claude and uses your account."></div>
  </header>
  <main id="view"></main>
  <nav class="tabs"><div class="inner" id="tabs"></div></nav>
</div>

<script type="application/json" id="d-scenarios">__SCENARIOS__</script>
<script type="application/json" id="d-emotions">__EMOTIONS__</script>
<script type="application/json" id="d-phrases">__PHRASES__</script>
<script type="application/json" id="d-policies">__POLICIES__</script>
<script type="application/json" id="d-rubric">__RUBRIC__</script>
<script type="application/json" id="d-drills">__DRILLS__</script>
<script type="application/json" id="d-vocab">__VOCAB__</script>
<script type="application/json" id="d-ops">__OPS__</script>

<script>
/* ---------------------------------------------------------------
   DATA
---------------------------------------------------------------- */
const D = {};
for (const k of ["scenarios","emotions","phrases","policies","rubric","drills","vocab","ops"]) {
  try { D[k] = JSON.parse(document.getElementById("d-"+k).textContent); } catch(e) { D[k] = null; console.error("data",k,e); }
}
const PHASES = D.scenarios.phases;
const PHASE_LABEL = {opening:"Open",auth:"Auth",recording:"Record",listen:"Listen",paraphrase:"Rephrase",empathy:"Empathy",clarify:"Clarify",policy:"Policy",options:"Resolve",summary:"Summary",confirm:"Confirm",close:"Close"};
const CRITICAL_PHASES = ["auth","recording","summary"];
const EMO = Object.fromEntries((D.emotions.emotions||[]).map(e=>[e.id,e]));
const ACC = D.drills.accents;
const DIMS = D.rubric.dimensions;
const DOT = "\u00b7", ELL = "\u2026", DASH = "\u2014", STAR = "\u2605", OK = "\u2713", NO = "\u2717";

/* ---------------------------------------------------------------
   STORE (localStorage only)
---------------------------------------------------------------- */
const Store = {
  get(k,d){ try{ const v=localStorage.getItem("el."+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("el."+k, JSON.stringify(v)); }catch(e){} },
};
const S = {
  settings: Object.assign({agentName:"Agent", accent:"en-GB", rate:0.92, typedOnly:false, mode:"offline", depth:"quick", voiceMap:{}}, Store.get("settings",{})),
  progress: Store.get("progress",{}),
  drills:   Store.get("drills",{}),
  custom:   Store.get("custom",[]),
  recent:   Store.get("recent",[]),
};
const save = ()=>{ Store.set("settings",S.settings); Store.set("progress",S.progress); Store.set("drills",S.drills); Store.set("custom",S.custom); Store.set("recent",S.recent); };
const NAME = ()=> S.settings.agentName || "Agent";
const fill = t => (t||"").replace(/\{name\}/g, NAME());

/* ---------------------------------------------------------------
   VOICE -- TTS with quality-ranked voice choice, per-accent override,
   sentence chunking (Android cuts long utterances), natural rate.
---------------------------------------------------------------- */
const Voice = {
  voices: [], queue:[], speaking:false,
  refresh(){ try{ this.voices = (speechSynthesis.getVoices()||[]).filter(v=>/^en([-_]|$)/i.test(v.lang||"")); }catch(e){ this.voices=[]; } },
  score(v, lang){
    const n=(v.name||"")+" "+(v.voiceURI||""); let s=0;
    const vl=(v.lang||"").replace("_","-").toLowerCase();
    if(vl===lang.toLowerCase()) s+=10; else if(vl.startsWith("en")) s+=2;
    if(/google/i.test(n)) s+=5;
    if(/natural|neural|premium|enhanced|wavenet|journey|studio/i.test(n)) s+=4;
    if(/espeak|compact|klatt|eloquence|festival|pico|svox/i.test(n)) s-=8;
    if(v.localService) s+=1;
    return s;
  },
  pick(lang){
    const L=this.voices; if(!L.length) return null;
    const uri=S.settings.voiceMap[lang]; if(uri){ const v=L.find(x=>x.voiceURI===uri); if(v) return v; }
    return [...L].sort((a,b)=>this.score(b,lang)-this.score(a,lang))[0];
  },
  chunks(text){ return String(text).replace(/\s+/g," ").match(/[^.!?]+[.!?]+["')\]]?|[^.!?]+$/g) || [String(text)]; },
  speak(text, lang, rate){
    this.stop();
    const v=this.pick(lang||S.settings.accent); const r=rate||S.settings.rate||0.92;
    const parts=this.chunks(text); let done=0;
    return new Promise(res=>{
      const next=()=>{ if(done>=parts.length){ this.speaking=false; return res(true); }
        const u=new SpeechSynthesisUtterance(parts[done++].trim());
        if(v){ u.voice=v; u.lang=v.lang; } else { u.lang=lang||"en-GB"; }
        u.rate=r; u.pitch=1; u.volume=1;
        u.onend=next; u.onerror=()=>{ this.speaking=false; res(false); };
        this.speaking=true; try{ speechSynthesis.speak(u); }catch(e){ res(false); } };
      next();
    });
  },
  stop(){ this.speaking=false; try{ speechSynthesis.cancel(); }catch(e){} },
  voiceNote(lang){
    const v=this.pick(lang); if(!v) return "No English voice installed";
    const vl=(v.lang||"").replace("_","-").toLowerCase();
    return (vl===lang.toLowerCase()?"":"No "+accLabel(lang)+" voice "+DASH+" using ")+v.name;
  }
};
Voice.refresh();

  empathy:/\b(sorry (you|that|to hear|about)|that sounds|not how anyone|i can (see|hear|imagine)|awful|stressful|rotten|miserable|genuinely|understand (the|that|why|how much)|you('re| are) right to|no one should|shouldn't have to|i'm glad you (called|got in touch))\b/i,
  clarify:/\?/,
  policy:/\b(72|seventy.two|hours|covered|policy|access failure|uninhabitable|not as (listed|advertised)|as advertised|strict|moderate|flexible|firm|limited|refund|rebook|aircover|resolution cent|wear and tear|14 days|30 days|15 days|non.?refundable|penalt|dispute|extenuating|reasonably clean|house rule)\b/i,

  summary:/\b(before we (finish|wrap up|close)|let me (go over|summari[sz]e|recap)|to (summari[sz]e|sum up|recap)|so today|what we('ve| have) (covered|done|agreed)|everything we covered)\b/i,
  confirm:/\b(explained (the|those|these) steps|does that (all )?make sense|is there anything else (i can|you need|you'd like)|anything else i can help)\b/i,

  expectations:/\b(within (the )?(hour|\d+|a|two|twenty|thirty)|by (tomorrow|tonight|this evening|four|six|\d)|in (about )?(\d+|two|ten|twenty|thirty) minutes|a day or two|15 days|today|couple of days)\b/i,
  future:/\b(reference|case (number|\d)|message (me|the case|through the app)|in writing|summary|call (you )?(back|straight back))\b/i,
  chat_transfer:/\b(continue (this |it )?(over|by|on|via) chat|move (this|you|it) to chat|happy to continue (this )?(over|on) chat)\b/i,
};
const FLAG = {
  liability:/\b(we (damaged|broke|failed|messed up|screwed)|our (mistake|fault)|we('re| are) (at fault|to blame)|i'?m sorry (that )?we)\b/i,
  promise:/\b(definitely|guarantee|i promise you('ll| will) (get|receive)|you will (get|receive) a full|100% refund)\b/i,
  calm_down:/\b(calm down|relax|no need to (shout|yell)|don'?t (cry|be upset))\b/i,
  unfortunately_opener:/(^\s*unfortunately|as per (our )?(policy|terms))/i,
  "72h_wrong":/72 hours? (from|after|of) (the )?(check.?in|booking|reservation)/i,
  blame:/\b(the (host|guest) is lying|the (host|guest) (damaged|broke)|(host|guest)'?s fault)\b/i,
  sensitive_data:/\b(password|full card|whole card|card number|cvv|security code|verification code)\b/i,
  pay_unfair:/\b(just (give|refund) (it|them|him|her)|refund (everything|it all) to (make|keep)|i'll approve it to (avoid|end))\b/i,

const PHASE_DIM = {opening:"structure",auth:"auth",recording:"recording",listen:null,paraphrase:"paraphrase",empathy:"empathy",clarify:"structure",policy:"policy",options:"ownership",summary:"summary",confirm:"closing",close:"closing",ownership:"ownership",expectations:"ownership",future:"closing"};
function offlineGrade(scn, turn, text){
  const exp=turn.expects||[]; const hit=[], miss=[];
  for(const p of exp){ (RX[p]||RX.listen).test(text)?hit.push(p):miss.push(p); }
  const flags=Object.keys(FLAG).filter(k=>FLAG[k].test(text));
  const scores={}; for(const d of DIMS) scores[d.id]=null;
  const rel=new Set(["language"]); for(const p of exp){ const dm=PHASE_DIM[p]; if(dm) rel.add(dm); }
  const has=p=>hit.includes(p);
  if(rel.has("auth")) scores.auth=flags.includes("sensitive_data")?0:(has("auth")?2:0);
  if(rel.has("recording")) scores.recording=scn.callback?(has("recording")?2:0):null;
  if(rel.has("paraphrase")) scores.paraphrase=has("paraphrase")?2:0;
  if(rel.has("empathy")) scores.empathy=flags.includes("calm_down")?0:(has("empathy")?2:0);
  if(rel.has("ownership")) scores.ownership=(flags.includes("liability")||flags.includes("promise"))?0:(RX.ownership.test(text)?2:0);
  if(rel.has("policy")) scores.policy=(flags.includes("72h_wrong")||flags.includes("blame"))?0:(has("policy")?2:0);
  if(rel.has("structure")) scores.structure=Math.min(3,Math.round((exp.length?hit.length/exp.length:1)*3));
  if(rel.has("summary")) scores.summary=has("summary")?2:0;
  if(rel.has("closing")) scores.closing=(has("confirm")?1:0)+(has("close")?1:0)+(RX.future.test(text)?1:0);
  scores.language=flags.includes("unfortunately_opener")?1:2;
  if(rel.has("policy")||rel.has("ownership")) scores.retention=flags.includes("pay_unfair")?0:(/\b(goodwill|you've been with us|your history)\b/i.test(text)||new RegExp("\\b"+scn.caller.name.split(" ")[0]+"\\b","i").test(text)?2:1);
  const critical=[];
  if(exp.includes("auth")&&(!has("auth")||flags.includes("sensitive_data"))) critical.push(flags.includes("sensitive_data")?"sensitive_data":"auth_missing");
  if(exp.includes("recording")&&scn.callback&&!has("recording")) critical.push("recording_missing");
  if(exp.includes("summary")&&!has("summary")) critical.push("summary_missing");
  let total=weightedTotal(scores); if(critical.length) total=Math.min(total,D.rubric.scoring.critical_cap);
  return {offline:true,total,scores,phases_hit:hit,phases_missed:miss,flags,critical,customer_reaction:(critical.length||total<9)?"weak":(total>=15?"good":"ok")};
}
function weightedTotal(scores){ let t=0,w=0; for(const d of DIMS){ const s=scores?scores[d.id]:null; if(s===null||s===undefined) continue; t+=s*d.weight; w+=3*d.weight; } return w?Math.round(t/w*24):0; }
function bandFor(total,critical){ if(critical&&critical.length) return D.rubric.scoring.critical_band; return D.rubric.scoring.bands.find(x=>total>=x.min)||D.rubric.scoring.bands[D.rubric.scoring.bands.length-1]; }

function diffWords(ref,got){

  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,html="",ok=0;
  while(i<m&&j<n){ if(a[i]===b[j]){ html+='<span class="ok">'+esc(a[i])+'</span>'; ok++; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ html+='<span class="miss">'+esc(a[i])+'</span>'; i++; } else { html+='<span class="extra">'+esc(b[j])+'</span>'; j++; } }
  while(i<m){ html+='<span class="miss">'+esc(a[i++])+'</span>'; } while(j<n){ html+='<span class="extra">'+esc(b[j++])+'</span>'; }
  return {html,pct:m?Math.round(ok/m*100):0};
}

/* ---------------------------------------------------------------
   PWA -- installable, opens offline, self-updates when online.
   Only outside the claude.ai viewer (there, window.claude exists and
   service workers are not allowed). BUILD is stamped by build.py.
---------------------------------------------------------------- */
const BUILD = "__BUILD__";
const CLAUDE_URL = "__CLAUDE_URL__";
const IS_PWA_HOST = ("serviceWorker" in navigator) && /^https?:/.test(location.protocol) && !(window.claude && typeof claude.use==="function");
if (IS_PWA_HOST) {
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("./sw.js");
      const check = ()=>{ try{ reg.update(); }catch(e){} };
      window.addEventListener("online", check); setInterval(check, 30*60*1000);
      reg.addEventListener("updatefound", ()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener("statechange", ()=>{ if(nw.state==="installed" && navigator.serviceWorker.controller){ nw.postMessage({type:"SKIP_WAITING"}); } }); });
      let reloaded=false; navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(reloaded) return; reloaded=true; toast("Updated \u2014 reloading the new version\u2026"); setTimeout(()=>location.reload(), 900); });
    }catch(e){ console.warn("sw", e); }
  });
}
